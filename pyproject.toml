[project]
name = "ryza"
version = "0.1.0"
description = "Ryza — 自動運用システム: データ基盤と会計マイグレーション基盤"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pandas>=2.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # dashboard/github_api.py(タスクページの GitHub REST 取得)のテストが import するため。
    # streamlit 本体は dev に入れない(UI はテスト対象外の方針を維持)。
    "requests>=2.31",
]
# 経営管理部ジョブ ops-weekly(T-004)の実行時依存。BigQuery は bq_table_missing 条件でのみ
# 使うため遅延インポート。デプロイイメージ(docker/ops)では .[ops] を入れる。
ops = [
    "google-cloud-bigquery>=3.0",
]
# Ryza 本体 Discord Bot(T-006)の GCE 常駐時依存。テスト(tests/bot)は純ロジックのみで
# discord.py を import しないため dev には含めない。VM プロビジョニングで .[bot] を入れる。
# secret-manager は起動時にトークンを取得する(RYZA_DISCORD_TOKEN 未指定時のみ・遅延 import)。
bot = [
    "discord.py>=2.6,<3.0",
    "google-cloud-secret-manager>=2.20",
]
# 運用ダッシュボード(Issue #10 → VM 認証付き公開・2026-08-03 代表指示)。
# 本体依存に入れない(ジョブには不要)。閲覧環境(ローカル/VM)で .[dashboard] を入れる。
# T-018 以降、tests/dashboard は viz ヘルパの純ロジックに加え Streamlit の AppTest で
# 全ページのヘッドレス描画も検証するため、CI は .[dev] に加えて .[dashboard] も入れる
# (.github/workflows/ci.yml)。streamlit 未導入の環境では該当テストが skip される。
# requests はタスクページの GitHub REST 取得(dashboard/github_api.py)用。
dashboard = [
    "streamlit>=1.37",
    "requests>=2.31",
]
# 階層0前処理（T-010）の埋め込みモデル実行時依存。torch が重いため本体依存に入れず隔離する。
# テスト（tests/preprocess）は実モデルをロードせずダミー埋め込みを注入するため dev には含めない。
# 本番/実測時のみ .[preprocess] を入れる（初回はモデルの重みダウンロードが発生する）。
preprocess = [
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ryza"]

[tool.ruff]
line-length = 100
target-version = "py312"
# site/ は T-001 とは無関係のステータスサイト生成スクリプト（既存）。lint 対象外。
extend-exclude = ["site"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
# 明示的なマーカー登録(未登録マーカーは pytest が PytestUnknownMarkWarning を出す)。
# F-14b(Issue #124 pass5-4): commit を伴うテストを機械的に選別・直列化するための
# マーカー。現状の実行構成は変更しないが、将来 xdist 等で並列化する際に
# ``-m "not commits_shared_state"`` で分離できるようにする。
markers = [
    "commits_shared_state: テスト DB に対して commit を伴い共有状態(ops.trading_state 等)を変更するテスト。原状復帰は finally で行うが、並行実行では他テストと干渉し得るため直列化対象として明示する(F-14b / Issue #124)",
]
