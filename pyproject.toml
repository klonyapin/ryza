[project]
name = "ryza"
version = "0.1.0"
description = "Ryza — 自動運用システム: データ基盤と会計マイグレーション基盤"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pandas>=2.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# 経営管理部ジョブ ops-weekly(T-004)の実行時依存。BigQuery は bq_table_missing 条件でのみ
# 使うため遅延インポート。デプロイイメージ(docker/ops)では .[ops] を入れる。
ops = [
    "google-cloud-bigquery>=3.0",
]
# Ryza 本体 Discord Bot(T-006)の GCE 常駐時依存。テスト(tests/bot)は純ロジックのみで
# discord.py を import しないため dev には含めない。VM プロビジョニングで .[bot] を入れる。
# secret-manager は起動時にトークンを取得する(RYZA_DISCORD_TOKEN 未指定時のみ・遅延 import)。
bot = [
    "discord.py>=2.6,<3.0",
    "google-cloud-secret-manager>=2.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ryza"]

[tool.ruff]
line-length = 100
target-version = "py312"
# site/ は T-001 とは無関係のステータスサイト生成スクリプト（既存）。lint 対象外。
extend-exclude = ["site"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
