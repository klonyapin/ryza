# FM 設定: Jim(統計エッジ・非 LLM・日次)— T-017
# 正: docs/design/40-fund-managers.md(哲学)・81-fm-mandates.md(マンデート = 何をどこまで)。
# 本ファイルは「哲学の器」の中の**パラメータ**であり、リスク上限ではない(上限は IPS と
# config/mandates/jim.yaml が持ち、ゲートが判定する)。値の根拠は各行のコメントが正。
version: "1"
producer: fm.jim.daily

signal:
  # 20日/60日 SMA クロス。中期トレンドの標準的な観測窓(1か月/3か月の営業日近似)で、
  # 特別な最適化を経ていない既定値をあえて使う。パラメータ探索はバックテスト基盤
  # (E5/E9 の多重検定補正つき)が整うまで行わない — 過適合の持ち込みを避けるため。
  fast_window: 20
  slow_window: 60
  # 出来高フィルタ: シグナル日の出来高が直近平均の何倍以上を要求するか。
  # 1.0 = 平均以上。薄商いの銘柄で SMA クロスだけを拾うと執行コスト(スリッページ)が
  # エッジを食い潰すため(E4 全コスト込み評価)。
  volume_window: 20
  min_volume_ratio: 1.0
  timeframe: "1d"

sizing:
  # ポッド仮想資本(マンデートの ¥2,000,000)を等分する最大スロット数。
  # 8 スロット = 1銘柄あたり ¥250,000 = 仮想資本の 12.5%。マンデートのポッド内集中度
  # 上限 20%(81 §3)より狭く、境界に張り付かない。「小さな優位×多数」(40)に沿って
  # Ben より分散させる。**スロット数は確信度・スコアと無関係**(不変原則1)。
  max_slots: 8

# 1日に新規に建てるポジションの上限(執行の当日集中を避ける決定論の上限)。
max_new_positions: 3
# 1回の実行で走査するユニバースの上限(コスト・実行時間のガード)。
max_universe: 200
