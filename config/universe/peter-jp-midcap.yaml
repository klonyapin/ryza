# curated ユニバース: Peter の国内中堅株タグ(jp_equity_midcap_cash)
#
# 用途: config/mandates/peter.yaml の universe([jp_equity_midcap_cash, us_equity_cash])の
#       うち **jp_equity_midcap_cash** に属する銘柄を明示列挙する。決定論ルール
#       (src/ryza/risk/classify.py)は時価総額系タグを付けない — 母集団データ(時価総額・
#       流動性の分位)が要るため。タグが供給されるまで Peter の国内側ユニバースは空で
#       あり、それは fail-closed の設計どおりの挙動である(タグを緩めて埋めてはならない
#       — T-019 §2-2)。
# 反映: daily の curated 段が自動照合する(手動 CLI は初回・緊急時のみ)。付与は
#       market.instrument_classification(+0026 履歴)へ書かれ、point-in-time で
#       「いつからその銘柄が jp_equity_midcap_cash だったか」を再現できる。
# 手順の正: docs/ops/fm-curated-universe.md
#
# ── 選定基準(criterion の根拠)────────────────────────────────────────────────
# 「中堅(midcap)」の本来の定義は時価総額・流動性の実測分位である。実測が整備される
# までの初版は**代理基準**を使う — jim-curated.yaml が日経225 を流動性の代理としたのと
# 同型の論法である:
#
#   TOPIX Mid400 の構成銘柄であり、かつ東証プライム市場に上場する内国普通株式
#
# TOPIX Mid400 は JPX(東京証券取引所)が算出・公表する TOPIX ニューインデックス
# シリーズの規模別区分で、「TOPIX 500 のうち TOPIX 100(超大型 Core30+大型 Large70)を
# 除く 400 銘柄」= 時価総額・流動性が TOPIX 100 に**次ぐ**銘柄群である(出典: JPX
# 「TOPIXニューインデックスシリーズ」規模別指数の定義)。取引所自身が公表する公式の
# 「中堅」区分であるため、恣意的な閾値を持ち込まずに midcap を切り出せる。定義上
# TOPIX 100(トヨタ・ソニー等の超大型)は**構造的に除外**される。
#
# 構成の確認に使った一次情報源: JPX「『TOPIXニューインデックスシリーズ』の定期選定
# 結果及び構成銘柄一覧」(2025-10-07 公表・2025-10-31 適用、
# https://www.jpx.co.jp/markets/indices/topix/tvdivq00000030ne-att/mei2_12_size.pdf)。
# 本ファイルの全銘柄は同資料で **2025年10月の定期入替の前後とも TOPIX Mid400** で
# あることを確認した(入替をまたいで区分が安定している銘柄のみを採る)。
#
# 本ファイルは Mid400 全400銘柄の写しでは**ない**。確認の取れた銘柄だけを東証33業種の
# 分散を持たせて列挙した初版サブセットである(fail-closed: 掲載外の銘柄には永遠にタグが
# 付かない。網羅は実測分位への移行時に基準ごと解決する)。
#
# ── この版でカバーしないもの ──────────────────────────────────────────────────
# - **us_equity_cash タグは供給しない**。決定論ルール(classify_instrument)が
#   venue(NYSE/NASDAQ)から付与するため curated 供給の対象外である
# - TOPIX Small 以下・スタンダード/グロース市場・ETF/REIT は対象外(criterion のとおり)
#
# ── 運用上の注意 ──────────────────────────────────────────────────────────────
# - TOPIX Mid400 の構成銘柄は**年1回の定期入替(10月最終営業日)**と臨時入替で変わる。
#   **承認時と定期見直し時に、entries が当時の Mid400 構成銘柄であることを必ず
#   突き合わせること**。本ファイルはその時点の写しであり、Mid400 の正ではない。
#   とくに Mid400 → TOPIX 100 へ**昇格**した銘柄は「もう midcap でない」ため撤回が要る
# - approved_at が null の間、ローダは読み込みを拒否する(未承認のリストでユニバースを
#   広げない)。承認は投資委員会(代表)。本ファイルは config/governance.yaml の
#   protected_areas(area: mandates)に登録された config/universe/** に属し、変更
#   コミットには `Approved:` トレーラが要る(承認の正はそちら — 審査 C-24)
# - **銘柄を1行足すことは「Peter が売買できる銘柄を1つ増やす」こと**である。rationale の
#   無いエントリはローダが拒否する
# - content_sha256 は criterion + 全エントリ(symbol・tags・rationale)の正規化ハッシュ。
#   内容を変えたら version と併せて更新し、再承認する(審査 C-25)。
#   再計算: uv run python -c "import yaml,pathlib;from ryza.risk.classify import
#   curated_content_digest as d;r=yaml.safe_load(pathlib.Path('config/universe/peter-jp-midcap.yaml')
#   .read_text());print(d(r['criterion'], r['entries']))"

name: peter-jp-midcap
version: "1"
criterion: >-
  TOPIX Mid400(JPX が公表する TOPIX ニューインデックスシリーズの規模別区分 —
  TOPIX 500 のうち TOPIX 100 を除く 400 銘柄)の構成銘柄であり、かつ東証プライム市場に
  上場する内国普通株式。時価総額・流動性の実測分位が整備されるまでの
  「中堅(midcap)」の代理基準。
manages_tags: [jp_equity_midcap_cash]

# 承認記録(null の間は反映されない)。approved_at は ISO 日付、approved_by は
# 'representative' 固定(起草者が自分で名乗れない — 審査 C-24)。
# **本ファイルは未承認のまま起案されている** — 承認は投資委員会(代表)。
approved_at: null
approved_by: null

# criterion + entries の正規化 sha256(内容と版の紐付け — 審査 C-25)。
