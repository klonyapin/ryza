# config/governance.yaml — 権限マトリクス・保護領域・統制テーブル(定款の機械可読版)
# 正: docs/design/06-constitution.md(v0.3)
# 保護領域(定款第5条): 本ファイル自身の変更も承認記録(みなし承認 48h または明示)必須。
version: "0.4"
status: active # 2026-08-03 代表批准(批准 PR マージ)により発効
source: docs/design/06-constitution.md

roles:
  representative: 代表(ユーザー)。専決事項の決定者
  cio: CIO ペルソナ(執行側統括・起草)
  independent_officer: 独立役員ペルソナ(非執行・批判専任・盲検レビュー)
  audit: 監査部門(read-only・代表直接報告)
  design_lead: 設計リード(Fable 開発セッション)
  department_job: 部門ジョブ(取込・分析・報道・経営管理などの決定論ジョブ)
  fm: ファンドマネージャーペルソナ(ポッド運用。マンデート範囲内)

# 定款第3条: 代表の明示承認が必須の専決事項(v0.3 で3つに縮減 — 2026-08-03 代表指示)
representative_reserved:
  - constitution_amendment # 委任範囲自体を定めるため委任不可
  - live_money # 出資・増資・実弾投入・実弾移行・実弾での戦略昇格
  - kill_switch_resume # 復帰権は委任不可(発動は代表がいつでも可能)

# 定款第3条: みなし承認(negative consent)。#承認 通知後、異議なければ自動発効。
# governance.decisions に decision='deemed' で記録し、明示承認と区別する。
deemed_approval:
  channel: 承認
  effective: on_notice # v0.4: 通知と同時に発効(期限待ちなし)。PR リンク必須
  veto: anytime # 代表はいつでも否認可。否認 → 遅滞なく取消(revert)+派生効果を #運営 へ報告
  audit_metric: deemed_ratio # 否認ゼロの長期継続は形骸化アラート(監査部門)
  unnotified_change: violation # 通知なき発効は A-18 の無承認変更扱い
  live_escalation: リスク上限を緩める方向の IPS・マンデート改訂は実弾移行後は事前明示承認に格上げ

# 定款第4条: 変更対象4層と改訂権限。
# 層帰属は最上位一致優先(glob が重複する場合は上位層の手続が勝つ)。
# 起草と承認の分離: 保護領域・決議対象は起票者と承認者を分離する(05-governance §6-4)。
document_layers:
  precedence: highest_layer_match_wins
  L1:
    docs:
      - path: docs/design/06-constitution.md
        draft_by: [representative, cio]
      - path: config/governance.yaml
        draft_by: [representative, cio]
    review_by: [independent_officer] # 盲検 = 議論規約3(起草者・代表の選好を伝えないプロンプト分離)
    approve_by: [representative]
  L2:
    docs:
      - path: docs/design/80-ips.md
        draft_by: [representative, cio] # v0.3: CIO は月次レビュー(80 §2.1)から起案可能。発効はみなし承認 7 日
      - path: docs/design/70-writing-standard.md
        draft_by: [cio]
      - path: docs/design/05-governance.md
        draft_by: [cio]
    review_by: [independent_officer]
    approve_by: [representative_deemed] # みなし承認(IPS 7日/他 48h — 定款第3条)
  L3:
    docs:
      - path: docs/design/81-fm-mandates.md
        draft_by: [cio]
      - path: docs/design/*.md
        draft_by: [cio, department_job]
      - path: personas/*/charter.md
        draft_by: [cio]
    review_by: [independent_officer] # 重要変更のみ
    approve_by: [representative_deemed] # みなし承認 48h(投資委員会)
  L4:
    docs:
      - path: config/*.yaml
        draft_by: [design_lead, department_job]
      - path: docs/tasks/*.md
        draft_by: [design_lead]
      - path: src/**
        draft_by: [design_lead, department_job]
      - path: migrations/*.sql
        draft_by: [design_lead]
      - path: ops/**
        draft_by: [design_lead]
    review_by: [design_lead]
    approve_by: [design_lead] # ただし protected_areas は独立役員審査+みなし承認 48h(承認トレーラ必須)

# 定款第5条: 保護領域(変更に代表の承認記録が必須。A-18 が git 履歴と突合)
protected_areas:
  - path: docs/design/06-constitution.md
    area: constitution
  - path: config/governance.yaml
    area: constitution
  - path: docs/design/80-ips.md
    area: ips
  - path: config/ips.yaml
    area: ips
  - path: docs/design/70-writing-standard.md
    area: writing_standard
  - path: src/ryza/bot/killswitch.py
    area: kill_switch
  - path: migrations/0012_killswitch_modes.sql
    area: kill_switch
  - path: src/ryza/ledger/** # 会計エンジン
    area: ledger_engine
  - path: src/ryza/ips.py # IPS ローダ・マンデート整合検証(コンプラゲートの参照実装)
    area: compliance_gate
  - path: config/mandates/*.yaml
    area: mandates
  - path: docs/design/81-fm-mandates.md
    area: mandates
  - path: migrations/*.sql # スキーマ全体(帳簿分離・証憑制約は migrations に宿る。C-1/懸念1-S1)
    area: schema
  - path: src/ryza/bot/main.py # Kill Switch の配線・コマンド登録(懸念1-S2)
    area: kill_switch
  - path: src/ryza/bot/approvals.py # 承認フロー(懸念1-S2)
    area: kill_switch
  - path: tests/test_ips.py # 不変条件テスト自体を保護(懸念1)。拡充時に invariant テストを追記
    area: invariant_tests
  - path: ops/deploy-bot.sh # デプロイ経路(懸念1-S3)
    area: deploy_path
  - path: ops/deploy-daily.sh
    area: deploy_path
  - path: ops/deploy-ops-weekly.sh
    area: deploy_path
  # 独立役員審査 2026-08-03(アイコン上書き 0020 の審査・C-4)が指摘した登録漏れ。
  # 本スクリプトは DB ロールの権限定義・IAP 許可リスト・稼働コードの git 検証を持つ
  # 実質的なデプロイ経路であり、未登録のままでは A-18-1 が権限定義の無承認変更を検出しない。
  # 出典: docs/reviews/0020-org-icon-overrides-independent-review.md C-4
  - path: ops/deploy-dashboard.sh
    area: deploy_path
  # デプロイゲート関数の実体(並行ラインで新設)。deploy-*.sh が呼ぶ検証ロジックが
  # ここに移るため、スクリプト本体だけを保護しても統制はゲート関数側から外せてしまう。
  - path: ops/lib/**
    area: deploy_path
  - path: CLAUDE.md # 不変原則・議論規約の写し(C-1)
    area: constitution
  - path: src/ryza/audit/** # 監査部門コード(A-18 系。自己申告 notes の「未登録」警告を解消)
    area: audit
  - path: ops/deploy-a18.sh # 監査ジョブのデプロイ経路(PR #40)
    area: deploy_path
  - path: src/ryza/risk/** # リスクエンジン(リミット判定+測定値の定義。navflow 審査 重要-8 で登録 — 測定定義の変更も第5条の対象。C-2 の宿題消化)
    area: risk_limits
  - path: src/ryza/gate/** # コンプラゲート実装(T-014。参照実装 src/ryza/ips.py と同じ area の棚卸し)
    area: compliance_gate
  # 独立役員審査 dads-design 中-4 が指摘した登録漏れ(2026-08-03)。CLAUDE.md 不変原則6の
  # 「デプロイ経路」に該当するが未登録だった稼働イメージの定義:
  #   dashboard/Dockerfile   … COPY 対象と CMD(= 稼働コードの中身)を直接決める
  #   docker/**              … ops/postgres の稼働イメージ定義
  #   .streamlit/config.toml … server.enableStaticServing=true 等、本番の配信挙動を決める
  # 出典: docs/reviews/dads-design-independent-review.md 中-4・設計リード裁定
  - path: dashboard/Dockerfile
    area: deploy_path
  - path: docker/**
    area: deploy_path
  - path: .streamlit/config.toml
    area: deploy_path
  # 独立役員審査 2026-08-04 中-5。CI は「開発管理 §2-3(検証)」の唯一の執行点であり、
  # required status check の実体でもある。`Run tests` ステップを削るだけで不変条件テスト
  # (帳簿分離・Kill Switch 経路・保護領域パス実在)が静かに無効化されるため、ops/lib/** を
  # 登録したのと同じ論法で保護する。area: ci は本登録で新設。
  - path: .github/workflows/ci.yml
    area: ci
  # 棚卸しの記録(2026-08-04・中-5): 以下は稼働経路でないため **対象外** と判断した。
  #   site/Dockerfile … site/ は静的サイトの生成物であり、資産・注文・承認のどの経路にも
  #                     触れない(改変の最悪影響は公開ページの表示崩れ)
  #   compose.yaml    … ローカル開発用の DB 起動定義。本番の稼働イメージは
  #                     docker/postgres/Dockerfile(登録済み)と Cloud Run 側の定義が決める
  #   ops/fetch-fonts.sh … 生成物(フォント)がリポジトリに入るだけで稼働経路ではない
  # この判断が変わる場合(site を動的化する・compose を本番に使う等)は登録し直すこと。

# 承認記録の様式(定款第5条・C-5): 保護領域の変更コミットは本文末尾に承認トレーラを必須と
# する。A-18-1 はこのトレーラと承認記録(governance.decisions)・GitHub を突合する。
#
#   様式 v1:  Approved: <参照>
#   様式 v2:  Approved: <参照> reviewed=<40桁 SHA>        ← 推奨(v1 は経過措置)
#
# **参照の書き方**(独立役員審査 2026-08-04 重要-2 の様式明確化):
#   - GitHub Issue / PR は **URL で書く**(例 https://github.com/klonyapin/ryza/pull/78)。
#     `#78` や裸の `78` は Issue 番号とも決定 ID とも読め、偶然一致が fail-open になるため
#     A-18-1 は照合せず「照合できない参照」として注記に出す
#   - governance.decisions の ID を指すときは接頭辞つきで `decision:<id>` と書く
#   - **自リポジトリの** PR URL は GitHub API で実在+マージ済みを照合する(架空 URL は違反)。
#     他リポジトリ(klonyapin/ryza 以外)の PR URL は権限外のため照合できず、通したうえで
#     「照合対象外 N 件」として報告に開示する — 外部 URL は承認記録として使わないこと
#   - API に到達できない実行では従来どおり存在検査までに縮退する(fail-open)。縮退した週は
#     報告が緑にならず「照合不能 N 件(要手動確認)」が出る(緑 = 全照合が成立した週)
#   - PR マージコミット(`Merge pull request #N`)は上に加え、API の merge_commit_sha が
#     当該マージと一致することまで照合する(実在 PR 番号を件名に流用する偽装の封鎖)
#   - 1コミットに複数のトレーラを並べてよい(独立役員審査+代表の明示承認など)。有効な承認が
#     1つでもあれば受理し、否認済みの参照を併記していれば取消義務の検討対象として報告に残る
#
# **reviewed=<40桁 SHA>(様式 v2・任意拡張)**: 独立審査が実際に見たコミットを固定する。
# A-18-1 の PR 承継(トレーラ有効な PR マージが持ち込んだコミット群を承認扱いにする規則)は、
# reviewed があるとき **reviewed の祖先に限定**される。審査・#承認 通知の後にブランチへ
# push したコミットは承継されず無承認変更として検出される(審査後 push の吸収の封鎖 —
# 独立役員審査 2026-08-04 重大-2)。40 桁 hex でない・リポジトリに存在しない reviewed は
# 様式不備として **承継の起点にしない**(不備を「制限なし」に読み替えない fail-safe)。
# 様式不備の判定: 40 桁 hex でない / リポジトリに存在しない / **当該 PR のブランチ(マージの
# 第2親)の祖先でない**(他ブランチの SHA で「reviewed 限定」の表示だけを得る偽装を排除)/
# 同一行に reviewed が複数ある。
#
# **解釈されないキー**: `mode=` `notified=` は書いてもよいが A-18 は解釈しない(定款 v0.4 の
# みなし承認は「通知と同時に発効」で、通知の実在・配送は A-18-5 が検査するため)。未知キー
# (綴り誤り)と余剰語は報告 notes に警告として出る — 黙って v1 扱いに落とさない。
#
# reviewed 無し(v1)のトレーラは**期限付きの経過措置**であり、承継件数を毎週の報告に開示する。
# 打ち切りと reviewed 必須化(定款 C-5 改訂 = L1 手続)は ops/reminders.yaml の
# `trailer-v1-sunset`(2026-09-01・実弾移行前)に登録済み。
# reviewed の申告が「独立審査が実際に見た SHA」かは承認記録側に持たないと突合できない —
# 後続は `decision-reviewed-sha`(2026-08-17)。
#
# 定款第5条 C-5 が要求するのは `Approved: <参照>` までであり、reviewed= は **任意拡張**である
# (必須化は定款の改訂を要する L1 手続)。したがって本節の追記は定款と齟齬しない — v1 のまま
# でも承認は成立し、v2 は承継範囲を自ら狭める側の記法として上乗せされる。
approval_trailer: "Approved:"

# 既知違反の受容記録(A-18-1 の acknowledged_findings — 独立役員審査 C-3)。
#
# 是正不能な過去の違反(git 履歴の書き換えなしには消せない evil merge 等)を毎週の警告に
# 載せ続けると「毎週赤いが誰も見ない」形骸化(05-governance §6-5)を招く。受容は隠蔽ではなく
# 明示で行う: A-18-1 は一致した違反を violations から外す代わりに、報告 embed の別フィールド
# 「受容済み既知違反: N 件」として **必ず可視化** する(黙って消さない)。
#
# 運用規則:
#   - **追記オンリー**。既存エントリの削除・書換は受容の隠蔽にあたり禁止(A-18-1 の履歴突合が
#     効かなくなる)。誤登録は削除でなく新エントリの注記で是正する
#   - 本ファイル自身が protected_areas(area: constitution)であり、エントリの追加は
#     独立役員審査 → #承認 通知 → みなし承認の L1 手続を要する(定款第3条・第5条)
#   - 一致条件は **commit(40桁の完全 SHA)と paths(その違反で触れた保護パスの集合)の完全一致**。
#     どちらかが違えば受容は効かず従来どおり違反として表示される。保護領域を後から追加して
#     同じコミットが別の保護パスにも触れていたと判明した場合、paths 集合が変わるため受容は
#     自動的に外れる(将来の別の違反を巻き込まない)
#   - 一致する違反が無くなったエントリ(改番・登録漏れ)は報告 notes に「陳腐化」として出る
#   - commit は **40 桁 hex の完全 SHA** のみ有効。短縮 SHA・欠落エントリは索引に入れず
#     「無効」として notes に開示する(黙って落とすと受容できたと誤認するため)
#   - **限界と担保(独立役員審査 2026-08-04 低-8)**: reason / approval_ref の**書換**は
#     A-18-1 の一致キー(commit + paths)に影響しないため、受容の成否としては検出されない。
#     担保は本ファイル自身が protected_areas(area: constitution)であること — 書換コミットは
#     A-18-1 の突合対象になり Approved トレーラ(または承認済み PR)を要求される。すなわち
#     「気付かれずに理由を書き換える」ことはできないが、「承認を経て書き換える」ことは可能。
#     受容の削除は違反の復活として自動的に顕在化する(自己是正的)。
# 履歴注記(2026-08-04): 当初は `2191285…`(ops/deploy-dashboard.sh・PR #58 配下の evil merge)も
# 受容登録する予定だったが、同じ PR で A-18-1 に **PR 承継** ルール(トレーラ有効な PR マージが
# 持ち込んだコミット群は承認を承継する)を入れた結果、親 PR #58 のマージがトレーラを持つため
# 承継でカバーされ、受容は不要になった(同様に `3814ba1…`/PR #70・`91e249b…`/PR #73 も承継)。
# 本エントリは main に到達する前の草案段階で取り下げたものであり、追記オンリー規則が禁じる
# 「発効済み受容の削除」ではない。承継の可視化は報告 embed の「PR 承継で承認: N コミット」で行う。
acknowledged_findings:
  - commit: 7a56c98fb624f2c72288c73b47018cbf63c253a1
    paths:
      - migrations/0016_nav_daily.sql
      - src/ryza/risk/daily.py
    reason: >-
      evil merge(origin/main 統合時のコンフリクト解消差分)で migrations/0016_nav_daily.sql と
      src/ryza/risk/daily.py に触れ Approved トレーラが無い。内容自体は PR #56 のみなし承認で
      カバーされているが、マージ自身のトレーラを欠く。親 PR #56 のマージコミットにも Approved
      トレーラが無いため PR 承継(2026-08-04 裁定)でもカバーできない。git 履歴の書き換えなしに
      是正できない。
    approval_ref: https://github.com/klonyapin/ryza/pull/56
    acknowledged_on: "2026-08-03"

# 定款第6条: 統制テーブル(J-SOX RCM 様式の応用)。A-18 監査ジョブが verification を実行する。
# enforcement: schema(DB 制約)| gate(実行時ゲート)| ci(テスト・lint)| audit(監査ジョブ)| declaration(宣言のみ)
controls:
  - rule: 定款第5条(保護領域の無承認変更禁止)
    risk: 保護コード・文書が承認なく書き換えられる
    enforcement: audit # 実弾移行前に ci(ブランチ保護+トレーラ検査)へ昇格すること(第5条前提条件)
    kind: 発見
    verification: 保護パスの変更コミットの Approved トレーラと承認記録(Issue 決議 / governance.decisions)の突合(A-18-1)
  - rule: 定款第5条(不変条件テストによる振る舞い保護)
    risk: 保護パスに触れない新規ファイル(migration 追加・配線変更)で保護対象の振る舞いが無効化される
    enforcement: ci
    kind: 予防
    verification: 帳簿間参照禁止・Kill Switch 経路存在・マンデート整合の不変条件テスト(tests/test_ips.py ほか。拡充は A-18 実装タスクに含める)
  - rule: 定款第5条(稼働コード=承認済みコードの一致)
    risk: デプロイスクリプト改変や未承認ブランチからのデプロイで承認履歴と稼働実体が乖離する
    enforcement: declaration # deploy スクリプトへの main-SHA 検証実装まで宣言
    kind: 予防
    verification: deploy-* が main の HEAD SHA を記録し A-18 が VM 上の稼働 SHA と突合(未実装)
  - rule: 定款第6条2項(発効文書と config の整合)
    risk: 文書は改訂されたがエンジン参照値が旧いまま乖離する
    enforcement: audit
    kind: 発見
