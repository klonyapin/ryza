# 定款第6条: 統制テーブル(J-SOX RCM 様式の応用)。A-18 監査ジョブが verification を実行する。
# enforcement: schema(DB 制約)| gate(実行時ゲート)| ci(テスト・lint)| audit(監査ジョブ)| declaration(宣言のみ)
controls:
  - rule: 定款第5条(保護領域の無承認変更禁止)
    risk: 保護コード・文書が承認なく書き換えられる
    enforcement: audit # 実弾移行前に ci(ブランチ保護+トレーラ検査)へ昇格すること(第5条前提条件)
    kind: 発見
    verification: 保護パスの変更コミットの Approved トレーラと承認記録(Issue 決議 / governance.decisions)の突合(A-18-1)
  - rule: 定款第5条(不変条件テストによる振る舞い保護)
    risk: 保護パスに触れない新規ファイル(migration 追加・配線変更)で保護対象の振る舞いが無効化される
    enforcement: ci
    kind: 予防
    verification: 帳簿間参照禁止・Kill Switch 経路存在・マンデート整合の不変条件テスト(tests/test_ips.py ほか。拡充は A-18 実装タスクに含める)
  - rule: 定款第5条(稼働コード=承認済みコードの一致)
    risk: デプロイスクリプト改変や未承認ブランチからのデプロイで承認履歴と稼働実体が乖離する
    enforcement: declaration # deploy スクリプトへの main-SHA 検証実装まで宣言
    kind: 予防
    verification: deploy-* が main の HEAD SHA を記録し A-18 が VM 上の稼働 SHA と突合(未実装)
  - rule: 定款第6条2項(発効文書と config の整合)
    risk: 文書は改訂されたがエンジン参照値が旧いまま乖離する
    enforcement: audit
    kind: 発見
    verification: 80-ips.md の版・値と config/ips.yaml の一致検査(A-18-2)。tests/test_ips.py が CI で先行検知
  - rule: 定款第2条2項(判断と執行の分離)
    risk: LLM 出力が発注・サイジングに直結する
    enforcement: ci
    kind: 予防
    verification: >-
      サイジング経路に確信度・スコア系の引数が入らないことのシグネチャ検査(tests/fm/test_sizing.py。
      2026-08-04 に実装 src/ryza/fm/** ともども protected_areas 登録済み)。
      killswitch・執行経路モジュールが research/llm を import しないことの静的検査(A-18-3)は未実装
  - rule: 第4条(下層文書は上層を緩められない)
    risk: マンデートが IPS より緩い上限を持つ
    enforcement: gate
    kind: 予防
    verification: src/ryza/ips.py validate_mandates(CI は tests/test_ips.py)
  - rule: 第7条禁止(帳簿間参照の禁止 — 不変原則2)
    risk: ファンド帳簿と運営帳簿が混合する
    enforcement: schema
    kind: 予防
    verification: ledger スキーマの book_id 制約(migrations)
  - rule: 第7条義務(証憑・リネージ記録 — 不変原則3)
    risk: 出所不明のデータ・生成物が意思決定に使われる
    enforcement: schema
    kind: 予防
    verification: evidence_id NOT NULL・lineage_edges 記録(migrations)+ A-5 証跡監査
  - rule: 第7条構造的保証(独立役員の異議経路・監査の独立)
    risk: 執行側が批判経路を無効化する
    enforcement: declaration # 執行点未実装(役員室・監査ジョブ実装時に protected_areas へ昇格)
    kind: 予防
    verification: A-18 が「宣言のみ」条文として四半期棚卸しに載せる
  - rule: 議論規約2(決議への反対意見書添付)
    risk: 追従による無批判な決議
    enforcement: declaration # 役員室実装時に決議フローで強制
    kind: 予防
    verification: 同上
  - rule: 開発管理 §2-1(全変更 PR 化 — 2026-08-03 代表指示。保護領域に限らず全変更を PR 経由とする)
    risk: レビューを経ない直 push・非 PR マージで main が変更される
    enforcement: gate # 予防=GitHub ブランチ保護(PR 必須・CI 必須・force push 禁止・管理者含む。2026-08-03 設定)
    kind: 予防
    verification: 発見の二重底は A-18-4 — 基準コミット(PR_RULE_BASELINE_COMMIT=4c7f6e9)以降の main first-parent で、直 push と PR マージ件名を持たないマージを列挙。例外なし(Approved トレーラ付きでも違反)
  - rule: 開発管理 §2-3(検証 — CI による全テスト・lint・YAML 検証)
    risk: 検証されないコードが main に入る
    enforcement: ci # required status check 'test'
    kind: 予防
    verification: GitHub Actions ci.yml(pytest 全件+ruff+YAML パース)。required check のため未通過はマージ不能
  - rule: 開発管理 §3-1(保護領域・新規モジュールの独立審査と意見書保存)
    risk: 起草者のみの判断で保護領域が変更される
    enforcement: declaration # 審査なし統合の機械検出は未実装(A-18 拡張候補)。現状は手続+docs/reviews の保存実績で監査
    kind: 予防
    verification: docs/reviews の意見書と保護領域 PR の対応を四半期棚卸しで確認
  - rule: 開発管理 §4-2(エージェントによる GitHub 設定変更の禁止)
    risk: エージェントが代表の認証でブランチ保護等を解除する
    enforcement: declaration # fine-grained token 分離まで技術的予防なし(正直な自己申告)
    kind: 予防
    verification: 四半期棚卸しで token 分離の実装可否を再評価
  # 以下 4 行は A-18-5〜8。実装済みの検査が統制表に無く、表と実装の乖離が累積していた
  # (独立役員審査 2026-08-04 SHA-6)。統制表は定款第6条の正本なので、監査が実行している
  # 検査は全て行を持つ。
  - rule: 定款第3条2号(みなし承認は #承認 への通知と同時に発効)
    risk: 記録は作られたが通知が配送されず「発効したが誰も知らない」状態が続く
    enforcement: audit
    kind: 発見
    verification: decision='deemed' の通知参照(outbox:<id>)が UNNOTIFIED_DEEMED_MINUTES を超えて未配送なら違反として列挙(A-18-5)
  - rule: 議論規約1・05-governance §6-5(批判を経ない決議の形骸化検出)
    risk: 鮮度なしの確認で決議が通り続け、独立役員の批判経路が実質的に無効化される
    enforcement: audit
    kind: 発見
    verification: minute_resolutions の confirmed_without_critic の連続・累積を boardroom の閾値で判定(A-18-6)
  - rule: 定款第3条(保護領域 PR には #承認 への通知=承認記録が必要)
    risk: --deemed の叩き忘れで保護領域の変更が通知なきまま発効する
    enforcement: audit
    kind: 発見
    verification: 保護領域に触れた PR マージのうち proposal_ref が当該 PR に完全一致する承認記録を持たないものを列挙(A-18-7。緑は分母つき)
  - rule: 定款第5条(独立審査が見た内容と発効した内容の一致)
    risk: 審査対象の申告(トレーラ reviewed=)が承認記録と食い違い、審査後の変更が承認済みに見える
    enforcement: audit
    kind: 発見
    verification: トレーラ reviewed= と decisions.reviewed_sha が両方ある決定の一致検査(A-18-8)。不一致時の承継範囲は記録側を採用。片側のみの件数も開示
