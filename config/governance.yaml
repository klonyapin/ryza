# 承認記録の様式(定款第5条・C-5): 保護領域の変更コミットは本文末尾に承認トレーラを必須と
# する。A-18-1 はこのトレーラと承認記録(governance.decisions)・GitHub を突合する。
#
#   様式 v1:  Approved: <参照>
#   様式 v2:  Approved: <参照> reviewed=<40桁 SHA>        ← 推奨(v1 は経過措置)
#
# **参照の書き方**(独立役員審査 2026-08-04 重要-2 の様式明確化):
#   - GitHub Issue / PR は **URL で書く**(例 https://github.com/klonyapin/ryza/pull/78)。
#     `#78` や裸の `78` は Issue 番号とも決定 ID とも読め、偶然一致が fail-open になるため
#     A-18-1 は照合せず「照合できない参照」として注記に出す
#   - governance.decisions の ID を指すときは接頭辞つきで `decision:<id>` と書く
#   - **自リポジトリの** PR URL は GitHub API で実在+マージ済みを照合する(架空 URL は違反)。
#     他リポジトリ(klonyapin/ryza 以外)の PR URL は権限外のため照合できず、通したうえで
#     「照合対象外 N 件」として報告に開示する — 外部 URL は承認記録として使わないこと
#   - API に到達できない実行では従来どおり存在検査までに縮退する(fail-open)。縮退した週は
#     報告が緑にならず「照合不能 N 件(要手動確認)」が出る(緑 = 全照合が成立した週)
#   - PR マージコミット(`Merge pull request #N`)は上に加え、API の merge_commit_sha が
#     当該マージと一致することまで照合する(実在 PR 番号を件名に流用する偽装の封鎖)
#   - 1コミットに複数のトレーラを並べてよい(独立役員審査+代表の明示承認など)。有効な承認が
#     1つでもあれば受理し、否認済みの参照を併記していれば取消義務の検討対象として報告に残る
#
# **reviewed=<40桁 SHA>(様式 v2・任意拡張)**: 独立審査が実際に見たコミットを固定する。
# A-18-1 の PR 承継(トレーラ有効な PR マージが持ち込んだコミット群を承認扱いにする規則)は、
# reviewed があるとき **reviewed の祖先に限定**される。審査・#承認 通知の後にブランチへ
# push したコミットは承継されず無承認変更として検出される(審査後 push の吸収の封鎖 —
# 独立役員審査 2026-08-04 重大-2)。40 桁 hex でない・リポジトリに存在しない reviewed は
# 様式不備として **承継の起点にしない**(不備を「制限なし」に読み替えない fail-safe)。
# 様式不備の判定: 40 桁 hex でない / リポジトリに存在しない / **当該 PR のブランチ(マージの
# 第2親)の祖先でない**(他ブランチの SHA で「reviewed 限定」の表示だけを得る偽装を排除)/
# 同一行に reviewed が複数ある。
#
# **解釈されないキー**: `mode=` `notified=` は書いてもよいが A-18 は解釈しない(定款 v0.4 の
# みなし承認は「通知と同時に発効」で、通知の実在・配送は A-18-5 が検査するため)。未知キー
# (綴り誤り)と余剰語は報告 notes に警告として出る — 黙って v1 扱いに落とさない。
#
# reviewed 無し(v1)のトレーラは**期限付きの経過措置**であり、承継件数を毎週の報告に開示する。
# 打ち切りと reviewed 必須化(定款 C-5 改訂 = L1 手続)は ops/reminders.yaml の
# `trailer-v1-sunset`(2026-09-01・実弾移行前)に登録済み。
# reviewed の申告は承認記録側の `governance.decisions.reviewed_sha`(migrations/0029)と
# 突合される(**A-18-8**)。両方に値がある決定で食い違えば所見になるため、マージ後に
# トレーラの reviewed だけを差し替える・別 PR の SHA を複写する、といった片側の改変は出る。
# **一致は証明ではない**: どちらも発効を起票した側が書く申告であり、審査エージェント自身の
# 署名は無い(同じ値を両方に書けば一致する)。審査エージェントの出力から機械的に埋まる経路は
# ops/reminders.yaml の後続課題。
#
# 定款第5条 C-5 が要求するのは `Approved: <参照>` までであり、reviewed= は **任意拡張**である
# (必須化は定款の改訂を要する L1 手続)。したがって本節の追記は定款と齟齬しない — v1 のまま
# でも承認は成立し、v2 は承継範囲を自ら狭める側の記法として上乗せされる。
approval_trailer: "Approved:"

# 既知違反の受容記録(A-18-1 の acknowledged_findings — 独立役員審査 C-3)。
#
# 是正不能な過去の違反(git 履歴の書き換えなしには消せない evil merge 等)を毎週の警告に
# 載せ続けると「毎週赤いが誰も見ない」形骸化(05-governance §6-5)を招く。受容は隠蔽ではなく
# 明示で行う: A-18-1 は一致した違反を violations から外す代わりに、報告 embed の別フィールド
# 「受容済み既知違反: N 件」として **必ず可視化** する(黙って消さない)。
#
# 運用規則:
#   - **追記オンリー**。既存エントリの削除・書換は受容の隠蔽にあたり禁止(A-18-1 の履歴突合が
#     効かなくなる)。誤登録は削除でなく新エントリの注記で是正する。
#     **同一キー(commit + paths)の重複追記も「書換」とみなし禁止**(独立役員審査 低-1 — 追記の
#     形をとった表示メタデータの差し替えになるため。検出時は後のエントリが無効・下記参照)
#   - 本ファイル自身が protected_areas(area: constitution)であり、エントリの追加は
#     独立役員審査 → #承認 通知 → みなし承認の L1 手続を要する(定款第3条・第5条)
#   - **kind**(省略時 `a18-1`)で受容の対象検査を区別する。`a18-1` = 保護領域の無承認変更
#     (キー: commit + paths)。`a18-8` = 審査対象 SHA の不一致(キー: commit + ref +
#     trailer_reviewed。いずれも 40 桁の完全 SHA / 参照の完全一致)。A-18-8 の不一致は
#     **訂正経路が構造的に存在しない**(承認記録は追記オンリー、main のコミットメッセージは
#     改変不能)ため、受容が無いと手入力の打ち間違い1件で週次監査が恒常 ⚠️ 化する
#     (独立役員審査 2026-08-04 SHA-3)。受容しても報告には別枠で必ず出る
#   - 一致条件は **commit(40桁の完全 SHA)と paths(その違反で触れた保護パスの集合)の完全一致**。
#     どちらかが違えば受容は効かず従来どおり違反として表示される。保護領域を後から追加して
#     同じコミットが別の保護パスにも触れていたと判明した場合、paths 集合が変わるため受容は
#     自動的に外れる(将来の別の違反を巻き込まない)
#   - **承継(supersedes)— 2026-08-04 追加・reminder ack-supersede-mechanism**。上の「保護領域を
#     追加すると受容が自動的に外れる」挙動は、追記オンリー規則(既存 paths の書換は禁止)と
#     組み合わさると **受容済み evil merge が触れたファイルを含む tree は以後 protected_areas に
#     追加できない** というラチェットになる。過去の git 事故が将来の統制強化を縛るのは本末転倒
#     なので、新エントリに次の形で旧エントリを承継させる:
#
#         supersedes:
#           commit: <旧エントリと同じ 40 桁 SHA>
#           paths: [<旧エントリの paths>]   # kind は省略時 a18-1
#
#     paths は **集合として照合**する(順序・重複・前後の空白は無視して正規化してから一致を見る。
#     独立役員審査 低-2 の様式明確化 — 「逐語で」は実装より厳しい記述だった)。スカラ文字列は
#     1文字ずつ分解されるため無効として開示する(低-3): 必ずリストで書くこと。
#
#     承継が成立する条件は4つすべて: ①同一コミット ②旧エントリが**自分より前に**存在
#     ③paths が**真の拡張**(旧 ⊂ 新)④新エントリに reason がある。拡張だけを正当な理由と
#     するのは、縮小・入替・理由なき差し替えが「受容の隠蔽」と機械的に区別できないため。
#     条件を満たさない supersedes を持つエントリは **受容として効かない**(fail-safe: 違反は
#     出たまま)。承継が成立した旧エントリは陳腐化注記の対象から外れるが、**承継の事実は毎回
#     notes に出る**(誰が何を承継したかが週次報告に残る)。旧エントリは削除しない
#     (追記オンリーは維持 — 承継は「書換の代替」であって「削除の代替」ではない)。
#     承継が受容の範囲を広げないことの担保: 一致は拡張後も **完全一致**のままなので、実在しない
#     違反を先回りで受容することはできない(paths を水増ししたエントリはどの違反にも当たらず
#     「陳腐化」として鳴る)。新しい違反を覆えるのは、保護領域の追加そのものが承認を経た場合の、
#     同一コミットの同一違反に限られる。
#     **ダイヤモンド承継は許容**(独立役員審査 低-5): 同一の旧エントリを複数の新エントリが承継して
#     よい(保護領域を二度に分けて追加した場合に自然に生じる)。違反に当たらない側は陳腐化として
#     鳴るため、隠蔽には転用できない
#   - **同一キーの重複追記は後のエントリが無効**(独立役員審査 2026-08-04 低-1)。既存エントリと
#     同じ (commit, paths) のエントリを追記すると、索引の後勝ち上書きで報告に出る
#     ack_reason / approval_ref =「誰の・どの承認で受容されたか」が**無開示のまま差し替わる**
#     (下の限界注記 低-8 は「書換」を想定しており、「同一キーの追記」は禁止列挙の外だった)。
#     A-18-1 は重複を検出したら後のエントリを受容として効かせず(fail-safe)、両エントリの
#     approval_ref・acknowledged_on・reason を notes に開示する。**同一キーの追記も書換とみなし
#     禁止する** — 表示メタデータの是正は、承継(paths が変わる場合)か新規注記で行うこと
#   - 一致する違反が無くなったエントリ(改番・登録漏れ)は報告 notes に「陳腐化」として出る
#     (上の承継が成立した旧エントリだけが例外で、代わりに承継の注記が毎回出る)
#   - commit は **40 桁 hex の完全 SHA** のみ有効。短縮 SHA・欠落エントリは索引に入れず
#     「無効」として notes に開示する(黙って落とすと受容できたと誤認するため)
#   - **限界と担保(独立役員審査 2026-08-04 低-8)**: reason / approval_ref の**書換**は
#     A-18-1 の一致キー(commit + paths)に影響しないため、受容の成否としては検出されない。
#     担保は本ファイル自身が protected_areas(area: constitution)であること — 書換コミットは
#     A-18-1 の突合対象になり Approved トレーラ(または承認済み PR)を要求される。すなわち
#     「気付かれずに理由を書き換える」ことはできないが、「承認を経て書き換える」ことは可能。
#     受容の削除は違反の復活として自動的に顕在化する(自己是正的)。
# 履歴注記(2026-08-04): 当初は `2191285…`(ops/deploy-dashboard.sh・PR #58 配下の evil merge)も
# 受容登録する予定だったが、同じ PR で A-18-1 に **PR 承継** ルール(トレーラ有効な PR マージが
# 持ち込んだコミット群は承認を承継する)を入れた結果、親 PR #58 のマージがトレーラを持つため
# 承継でカバーされ、受容は不要になった(同様に `3814ba1…`/PR #70・`91e249b…`/PR #73 も承継)。
# 本エントリは main に到達する前の草案段階で取り下げたものであり、追記オンリー規則が禁じる
# 「発効済み受容の削除」ではない。承継の可視化は報告 embed の「PR 承継で承認: N コミット」で行う。
