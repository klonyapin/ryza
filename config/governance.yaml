# config/governance.yaml — 権限マトリクス・保護領域・統制テーブル(定款の機械可読版)
# 正: docs/design/06-constitution.md(v0.3)
# 保護領域(定款第5条): 本ファイル自身の変更も承認記録(みなし承認 48h または明示)必須。
version: "0.4"
status: active # 2026-08-03 代表批准(批准 PR マージ)により発効
source: docs/design/06-constitution.md

roles:
  representative: 代表(ユーザー)。専決事項の決定者
  cio: CIO ペルソナ(執行側統括・起草)
  independent_officer: 独立役員ペルソナ(非執行・批判専任・盲検レビュー)
  audit: 監査部門(read-only・代表直接報告)
  design_lead: 設計リード(Fable 開発セッション)
  department_job: 部門ジョブ(取込・分析・報道・経営管理などの決定論ジョブ)
  fm: ファンドマネージャーペルソナ(ポッド運用。マンデート範囲内)

# 定款第3条: 代表の明示承認が必須の専決事項(v0.3 で3つに縮減 — 2026-08-03 代表指示)
representative_reserved:
  - constitution_amendment # 委任範囲自体を定めるため委任不可
  - live_money # 出資・増資・実弾投入・実弾移行・実弾での戦略昇格
  - kill_switch_resume # 復帰権は委任不可(発動は代表がいつでも可能)

# 定款第3条: みなし承認(negative consent)。#承認 通知後、異議なければ自動発効。
# governance.decisions に decision='deemed' で記録し、明示承認と区別する。
deemed_approval:
  channel: 承認
  effective: on_notice # v0.4: 通知と同時に発効(期限待ちなし)。PR リンク必須
  veto: anytime # 代表はいつでも否認可。否認 → 遅滞なく取消(revert)+派生効果を #運営 へ報告
  audit_metric: deemed_ratio # 否認ゼロの長期継続は形骸化アラート(監査部門)
  unnotified_change: violation # 通知なき発効は A-18 の無承認変更扱い
  # 執行点は2つ。A-18-5=記録はあるが通知が未配送(滞留)、A-18-7=保護領域 PR に対応する
  # 記録がそもそも無い(--deemed の叩き忘れ)。前者だけでは「一度も通知していない」が漏れる。
  live_escalation: リスク上限を緩める方向の IPS・マンデート改訂は実弾移行後は事前明示承認に格上げ

# 定款第4条: 変更対象4層と改訂権限。
# 層帰属は最上位一致優先(glob が重複する場合は上位層の手続が勝つ)。
# 起草と承認の分離: 保護領域・決議対象は起票者と承認者を分離する(05-governance §6-4)。
document_layers:
  precedence: highest_layer_match_wins
  L1:
    docs:
      - path: docs/design/06-constitution.md
        draft_by: [representative, cio]
      - path: config/governance.yaml
        draft_by: [representative, cio]
    review_by: [independent_officer] # 盲検 = 議論規約3(起草者・代表の選好を伝えないプロンプト分離)
    approve_by: [representative]
  L2:
    docs:
      - path: docs/design/80-ips.md
        draft_by: [representative, cio] # v0.3: CIO は月次レビュー(80 §2.1)から起案可能。発効はみなし承認 7 日
      - path: docs/design/70-writing-standard.md
        draft_by: [cio]
      - path: docs/design/05-governance.md
        draft_by: [cio]
    review_by: [independent_officer]
    approve_by: [representative_deemed] # みなし承認(IPS 7日/他 48h — 定款第3条)
  L3:
    docs:
      - path: docs/design/81-fm-mandates.md
        draft_by: [cio]
      - path: docs/design/*.md
        draft_by: [cio, department_job]
      - path: personas/*/charter.md
        draft_by: [cio]
    review_by: [independent_officer] # 重要変更のみ
    approve_by: [representative_deemed] # みなし承認 48h(投資委員会)
  L4:
    docs:
      - path: config/*.yaml
        draft_by: [design_lead, department_job]
      - path: docs/tasks/*.md
        draft_by: [design_lead]
      - path: src/**
        draft_by: [design_lead, department_job]
      - path: migrations/*.sql
        draft_by: [design_lead]
      - path: ops/**
        draft_by: [design_lead]
    review_by: [design_lead]
    approve_by: [design_lead] # ただし protected_areas は独立役員審査+みなし承認 48h(承認トレーラ必須)

# 定款第5条: 保護領域(変更に代表の承認記録が必須。A-18 が git 履歴と突合)
protected_areas:
  - path: docs/design/06-constitution.md
    area: constitution
  - path: config/governance.yaml
    area: constitution
  - path: docs/design/80-ips.md
    area: ips
  - path: config/ips.yaml
    area: ips
  - path: docs/design/70-writing-standard.md
    area: writing_standard
  - path: src/ryza/bot/killswitch.py
    area: kill_switch
  - path: migrations/0012_killswitch_modes.sql
    area: kill_switch
  - path: src/ryza/ledger/** # 会計エンジン
    area: ledger_engine
  - path: src/ryza/ips.py # IPS ローダ・マンデート整合検証(コンプラゲートの参照実装)
    area: compliance_gate
  - path: config/mandates/*.yaml
    area: mandates
  - path: docs/design/81-fm-mandates.md
    area: mandates
  # 独立役員審査 2026-08-04(FM 運用整備 C-24)。curated ユニバース定義は「マンデートの
  # universe 語彙(liquid_equity 等)に属する母集団を実際に埋める」操作であり、統制上は
  # マンデート変更と同格である。未登録のままだと「銘柄を 35 行足すこと」と「自分で
  # 承認済みと書くこと」を同一 PR・無トレーラで行え、A-18-1 の突合対象にならない。
  # 出典: docs/reviews/t017-fm-agents-independent-review.md C-24
  - path: config/universe/**
    area: mandates
  - path: migrations/*.sql # スキーマ全体(帳簿分離・証憑制約は migrations に宿る。C-1/懸念1-S1)
    area: schema
  - path: src/ryza/bot/main.py # Kill Switch の配線・コマンド登録(懸念1-S2)
    area: kill_switch
  - path: src/ryza/bot/approvals.py # 承認フロー(懸念1-S2)
    area: kill_switch
  - path: tests/test_ips.py # 不変条件テスト自体を保護(懸念1)。拡充時に invariant テストを追記
    area: invariant_tests
  - path: ops/deploy-bot.sh # デプロイ経路(懸念1-S3)
    area: deploy_path
  - path: ops/deploy-daily.sh
    area: deploy_path
  - path: ops/deploy-ops-weekly.sh
    area: deploy_path
  # 独立役員審査 2026-08-03(アイコン上書き 0020 の審査・C-4)が指摘した登録漏れ。
  # 本スクリプトは DB ロールの権限定義・IAP 許可リスト・稼働コードの git 検証を持つ
  # 実質的なデプロイ経路であり、未登録のままでは A-18-1 が権限定義の無承認変更を検出しない。
  # 出典: docs/reviews/0020-org-icon-overrides-independent-review.md C-4
  - path: ops/deploy-dashboard.sh
    area: deploy_path
  # デプロイゲート関数の実体(並行ラインで新設)。deploy-*.sh が呼ぶ検証ロジックが
  # ここに移るため、スクリプト本体だけを保護しても統制はゲート関数側から外せてしまう。
  - path: ops/lib/**
    area: deploy_path
  - path: CLAUDE.md # 不変原則・議論規約の写し(C-1)
    area: constitution
  - path: src/ryza/audit/** # 監査部門コード(A-18 系。自己申告 notes の「未登録」警告を解消)
    area: audit
  - path: ops/deploy-a18.sh # 監査ジョブのデプロイ経路(PR #40)
    area: deploy_path
  # 統治エンジン(2026-08-04 登録): 役員室の批判義務ゲート(mark_resolution・決定論ガード・
  # 詐称無害化)、承認記録 writer(record_deemed_approval/veto)、通知の不可分化(notices)、
  # 着任・盲検(personas)。boardroom-residual 実装時に登録漏れと判明(実装エージェント報告)。
  - path: src/ryza/governance/**
    area: governance_engine
  # 統治実施規程(L2 文書)。役員室・決議・盲検の規範の正。
  - path: docs/design/05-governance.md
    area: governance_doc
  - path: src/ryza/risk/** # リスクエンジン(リミット判定+測定値の定義。navflow 審査 重要-8 で登録 — 測定定義の変更も第5条の対象。C-2 の宿題消化)
    area: risk_limits
  - path: src/ryza/gate/** # コンプラゲート実装(T-014。参照実装 src/ryza/ips.py と同じ area の棚卸し)
    area: compliance_gate
  # 独立役員審査 dads-design 中-4 が指摘した登録漏れ(2026-08-03)。CLAUDE.md 不変原則6の
  # 「デプロイ経路」に該当するが未登録だった稼働イメージの定義:
  #   dashboard/Dockerfile   … COPY 対象と CMD(= 稼働コードの中身)を直接決める
  #   docker/**              … ops/postgres の稼働イメージ定義
  #   .streamlit/config.toml … server.enableStaticServing=true 等、本番の配信挙動を決める
  # 出典: docs/reviews/dads-design-independent-review.md 中-4・設計リード裁定
  - path: dashboard/Dockerfile
    area: deploy_path
  - path: docker/**
    area: deploy_path
  - path: .streamlit/config.toml
    area: deploy_path
  # 独立役員審査 2026-08-04 中-5。CI は「開発管理 §2-3(検証)」の唯一の執行点であり、
  # required status check の実体でもある。`Run tests` ステップを削るだけで不変条件テスト
  # (帳簿分離・Kill Switch 経路・保護領域パス実在)が静かに無効化されるため、ops/lib/** を
  # 登録したのと同じ論法で保護する。area: ci は本登録で新設。
  - path: .github/workflows/ci.yml
    area: ci
  # 棚卸しの記録(2026-08-04・中-5): 以下は稼働経路でないため **対象外** と判断した。
  #   site/Dockerfile … site/ は静的サイトの生成物であり、資産・注文・承認のどの経路にも
  #                     触れない(改変の最悪影響は公開ページの表示崩れ)
  #   compose.yaml    … ローカル開発用の DB 起動定義。本番の稼働イメージは
  #                     docker/postgres/Dockerfile(登録済み)と Cloud Run 側の定義が決める
  #   ops/fetch-fonts.sh … 生成物(フォント)がリポジトリに入るだけで稼働経路ではない
  # この判断が変わる場合(site を動的化する・compose を本番に使う等)は登録し直すこと。

  # ── 対照・ゴールデンを持つテスト(2026-08-04 登録・reminder protect-equivalence-tests)──
  # 登録基準: **テストが実装から独立した参照(旧 SQL の凍結コピー・ゴールデンファイル・
  # 発効値の写し・構造の存在検査)を保持し、その参照を先に書き換えると以後の保護領域変更が
  # テスト差分に現れなくなるもの**。これらは二段手順で無力化できる — (1) 参照を「新形に
  # 合わせて」書き換える(テストは保護外なので無審査・CI も緑)、(2) 後日、実装(保護領域)を
  # 変える(審査に載るが、対照は既に空回りしており審査者は緑の CI を見て等価と誤認する)。
  # tests/test_ips.py を invariant_tests として登録した先例(懸念1)と同じ論法である。
  # 実装側(ledger/risk/gate/migrations/ops/lib)は既に保護領域であり、これらのテストは実務上
  # 同じ PR で動くため、登録による追加の手続コストはほぼゼロで二段手順だけを塞ぐ。
  #
  # 会計・リスクの同値性を固定する対照(査-1)。旧 SQL を逐語で凍結し、新旧が同一データで
  # 完全一致することを固定する。書き換えれば「速さのための近似」が無検出で入り、
  # 遅延仕訳の取りこぼし(再締めされない日)・外部フローの取りこぼし(NAV リターンの誤り→
  # 実現ボラ→発注ブロック判定)がそのまま統制を素通りする。
  - path: tests/ledger/test_stale_query_rewrite.py
    area: invariant_tests
  - path: tests/risk/test_navflow_query_rewrite.py
    area: invariant_tests
  # リスク判定の全キー・スナップショット固定(独立役員審査 2026-08-04 推奨)。ゴールデンを
  # 先に再生成すれば、以後のフラグ・測定値・理由コードの変更が差分に現れない。判定不変の
  # 証拠能力はゴールデン本体(json)に宿るため、テストと同格で登録する。
  - path: tests/risk/test_engine_invariance.py
    area: invariant_tests
  - path: tests/risk/engine_snapshot.json
    area: invariant_tests
  # スキーマ統制の存在検査(帳簿分離・貸借一致・証憑必須・追記オンリー・分類履歴ガードの
  # 各トリガが DB に存在すること)。migrations/*.sql は保護領域だが、**保護は承認を要求する
  # だけでトリガの喪失は検知しない** — 検知しているのはこのテストだけであり、削れば後続の
  # migration が DROP TRIGGER を静かに通せる。controls 表「定款第5条(不変条件テストによる
  # 振る舞い保護)」enforcement: ci の実体そのもの。
  - path: tests/test_migrations.py
    area: invariant_tests
  # デプロイゲートの配線・生成 SQL を本文の文字列で固定する検査(git ゲート・公開バインド
  # 除去・pg_hba・ロール権限ゲートの assertion 群)。ops/lib/** と ops/deploy-dashboard.sh を
  # 登録したのと同じ論法 — ゲート関数を残したまま「呼び出しを外す/assertion を1つ落とす」
  # 改変を検知するのはこのテストだけである。
  - path: tests/ops/test_deploy_guards.py
    area: invariant_tests
  - path: tests/ops/test_deploy_role_gate.py
    area: invariant_tests
  # IPS v1.3 発効値の写し(test_ips_effective_values)+ G-0〜G-10 の pass/block 境界。
  # 写しを先に緩めると、config/ips.yaml(保護領域)を緩める変更が CI 差分に出なくなる。
  - path: tests/gate/test_rules.py
    area: invariant_tests
  # 棚卸しの記録(2026-08-04・reminder protect-equivalence-tests): 以下は **今回は対象外**。
  #   振る舞い回帰テスト(tests/bot/test_killswitch.py・tests/gate/test_lock.py・
  #   tests/governance/test_notices.py・tests/ledger/test_posting.py・tests/risk/test_state.py・
  #   tests/execution/test_runner.py・tests/audit/test_a18.py など)
  #     … 実装を変えれば同時に落ちる構造であり、参照の写しを持たない。統制の実体は DB 制約・
  #       トリガ・実装ロジック側にあり、テストを緩めても実体は残る。実体を変えるには保護領域
  #       (migrations・ledger・governance・risk・gate・audit・killswitch)に触れる必要がある。
  #       ここまで登録すると「保護領域モジュールの全テスト」が保護対象になり、登録基準が
  #       意味を失う。
  #   tests/dashboard/test_dads_theme.py … .streamlit/config.toml の写しを持つが、内容は配色・
  #       行間・コントラスト等の表示品質であり、資産・注文・承認のどの統制にも触れない。
  #   tests/execution/test_config.py・tests/fm/test_sizing.py・tests/research/test_prompting.py
  #     … 「唯一の執行点」に該当するが、対応する実装・設定(config/execution.yaml・
  #       src/ryza/fm/**・src/ryza/research/prompting.py)が**保護領域でない**。テストだけを
  #       登録すると、未保護モジュールを事実上の保護領域に格上げすることになる(実装を変えれば
  #       テストが落ち、通すには保護ファイルの改変=審査が要る)。これは L1 のテスト登録として
  #       決めるべき範囲を超えるため、モジュール自体を保護領域にするかどうかの審査に送る
  #       (reminder ``protect-invariant-tests-phase2``)。とくに tests/fm/test_sizing.py は
  #       不変原則1(LLM の確信度をサイジングに入れない)の唯一の CI 執行点である。
  #       → **phase-2(2026-08-04)で解決**。実装側を先に登録したうえで3件を登録した(下節)。
  #       本段落は「なぜ phase-1 では登録しなかったか」の判断経緯として残す。

  # ── 統制テスト保護 phase-2(2026-08-04 登録・reminder protect-invariant-tests-phase2 /
  #    protect-execution-config)──────────────────────────────────────────────────
  # phase-1 の保留理由は「テストが唯一の CI 執行点だが、対応する実装・設定が未保護」だった。
  # 本節の判断は **実装側を先に登録し、その上でテストを登録する**。片側だけの登録はどちらの
  # 順序でも二段手順を残す — 実装だけならテストの参照を先に緩められ、テストだけなら未保護
  # モジュールを事実上の保護領域に格上げしてしまう。
  #
  # (1) src/ryza/fm/**(area: fm_engine を新設)
  #   不変原則1(LLM の確信度を直接ポジションサイズにしない)の実装がここに宿る。T-017 の
  #   FM 実装時に登録すべきだった漏れであり、ledger/gate/risk と同格に扱う。
  #   **sizing.py だけの登録では足りない**(いずれも sizing.py に触れずに書ける迂回):
  #     - base.py は「提案 → sizing → ゲート → 注文」の唯一の配線であり、sizing を通さずに
  #       数量を作る改変が可能(src/ryza/bot/main.py を Kill Switch の配線として登録したのと
  #       同じ論法)
  #     - schemas.py の Intent に size/weight を1つ足せば、確信度がサイジングへ入る口が開く
  #     - ファイル単位の登録は「新しいモジュールを足す」形の迂回を許す(ops/lib/** ・
  #       src/ryza/risk/** を glob で登録したのと同じ理由)
  #   コスト(明示): ben.py・jim.py・theses.py の変更にも承認手続が要る。FM は開発が活発だが、
  #   上記の迂回口がすべて「sizing.py 以外のファイル」にある以上、部分登録は登録基準自体を
  #   空洞化させる。gate/**・risk/**・ledger/** も同じコストを払っている。
  - path: src/ryza/fm/**
    area: fm_engine
  # (2) src/ryza/research/prompting.py(area: 既存の governance_engine に寄せる)
  #   全 LLM 入口のデータ境界(フェンス記号の無害化・tag の拒否)の実装。governance_engine の
  #   登録理由に挙がっている「役員室の詐称無害化」は boardroom から本モジュールへ**抽出済み**
  #   であり(独立役員審査 T-018 C-2 の是正)、boardroom だけを保護しても防御の実体は保護外に
  #   出たままになる。すなわち本登録は新しい保護の追加ではなく、既存 governance_engine の
  #   保護の穴埋めである。
  #   area を新設しなかった理由は保護の根拠が governance_engine の完全性にあるため。ただし
  #   利用者は役員室に限らない(fm.ben・research.agents.base・press.writer)ので、独立の area
  #   (prompt_boundary 等)へ切り出す判断は四半期棚卸しでありうる。
