# FM 設定: Ben(割安×質×長期・LLM 週次)— T-017
# 正: docs/design/40-fund-managers.md(哲学)・81-fm-mandates.md(マンデート = 何をどこまで)。
# LLM は**候補の採否**だけを出す。金額は sizing.py の決定論コードが決める(不変原則1)。
version: "1"
producer: fm.ben.weekly

# LLM 階層(CLAUDE.md 不変原則7)。銘柄選定は非 LLM ルールでは代替できない判断(定性の
# 事業評価)のため中位を使う。Fable は使わない(研究設計・論文・重要レビュー専用)。
model_tier: mid
# 実行曜日(ISO 8601: 1=月曜 … 7=日曜)。低回転(月数回)のため週1回で足りる。
# 月曜は週末に出た開示・ニュースが前処理を通った直後で、素材が最も揃う。
weekday: 1

sizing:
  # ポッド仮想資本(マンデートの ¥2,000,000)を等分する最大スロット数。
  # 5 スロット = 1銘柄あたり ¥400,000 = 仮想資本の 20%。マンデートのポッド内集中度
  # 上限 40%(81 §3)の半分に留め、安全域(margin of safety)を配分にも効かせる。
  max_slots: 5

# 1回の実行で LLM に出させる新規候補の上限(超過分は決定論に先頭から採用)。
max_candidates: 3
# プロンプトに載せる文書数と本文の切り詰め長(コストのガード)。
max_documents: 25
doc_body_chars: 1200
# プロンプトに載せる過去の自分の提案(判断履歴)の件数。
recent_theses: 10
