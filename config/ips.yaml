# Ryza IPS v1.3 機械可読版(Issue #28)
# 正: docs/design/80-ips.md(v1.3・2026-08-03 発効・ユーザー承認 Issue #4)
# 保護領域(CLAUDE.md 不変原則6): 変更はユーザー起票のみ。版管理+承認記録必須。
# コンプライアンス・リスク両エンジンは本ファイルのみを参照する(80-ips.md ステータス欄)。
# 本ファイルの値はすべて 80-ips.md 本文に根拠を持つ。文書にない値は null + TODO コメントで明示。
version: "1.3"
effective_date: "2026-08-03"
source: docs/design/80-ips.md

fund: # §1 範囲と目的
  base_currency: JPY
  capital_jpy: 10000000 # 出資金 ¥10,000,000 = 初期 ¥1,000,000 + 2026-08-03 増額 ¥9,000,000
  books: [DEMO_FUND] # 当面 DEMO_FUND のみ。全 FM ポッドの合算に適用する

risk_budget: # §3.1 目標リターンの導出規約(E[R] ≈ SR × σ)
  sigma_annual: 0.12 # 運用値: σ予算 = 12%(暫定)
  sigma_annual_max: 0.12 # 実績分布での再較正まで σ予算の上限は 12%
  sr_hypothesis:
    prior: 0.5 # 縮小推定の事前分布 SR 0.5
    update_frequency: quarterly # 四半期更新・信頼区間併記
    range: [0.5, 1.0] # 条件付きレンジの SR 範囲
  expected_return_annual_range: [0.06, 0.13] # SR 0.5〜1.0 の実現で年率 6〜13%(算術)
  drawdown_definition: # DD の測定定義(独立レビュー条件1)
    basis: per_book # 帳簿単位
    peak: since_inception # 設定来ピークからの下落
    measurement: continuous # 連続測定・リセットなし
    calibration_horizon_years: 3 # 3年連続条項: 較正は運用想定ホライズン(3年・連続測定)
    breach_probability_max: 0.10 # ブリーチ確率 ≤10%(3年・連続測定・DD>25%)に対する要件

hard_limits: # §3.2 リスク上限(基準プロファイル aggressive の既定値。適用・監視は帳簿単位)
  max_drawdown: 0.25 # 最大ドローダウン許容(確定)。サーキットブレーカー発動点
  dd_soft_limit: 0.15 # DD 15% 到達時: 警告+新規建て枠を半減(ソフトリミット)
  dd_hard_limit: 0.25 # DD 25% 到達時: 全新規発注停止。復帰は委員会の明示操作のみ
  realized_vol_limit: 0.15 # 実現ボラティリティ上限 = σ予算(12%)+3pp。超過で新規建てブロック
  realized_vol_ewma_days: 20 # EWMA(20日)の年率換算で測定(σ予算の執行機構・独立レビュー条件2)
  daily_es95_nav_max: 0.03 # 日次 ES(95%)上限 = NAV の 3%。超過で新規建てブロック+通知
  gross_leverage_max: 2.0 # レバレッジ上限(グロス/NAV・確定)
  maintenance_margin_buffer: 0.20 # 維持率がブローカー要求+バッファ 20% を下回ったら新規建てブロック
  issuer_concentration_nav_max: 0.20 # 1銘柄集中度上限 = NAV の 20%(発行体単位・全ポッド合算・確定)
  daily_turnover_nav_max: 0.30 # 1日の売買代金上限(暴走ガード)= NAV の 30%(全ポッド合算)

guardrails: # §4.2 エクスポージャー・ガードレール(上限であって目標ではない。ゲート対象)
  single_asset_class_gross_nav_max: 0.70 # 単一資産クラスのグロス ≤ NAV の 70%
  crypto_nav_max: 0.05 # 暗号資産 ≤ NAV の 5%
  crypto_dormant: true # 休眠条項: 初代4名のユニバースに暗号資産はなく、有効化はマンデート改訂(ユーザー承認)による
  cash_nav_min: 0.05 # 現金下限 = NAV の 5%(流動性・追証バッファ)
  issuer_concentration_nav_max: 0.20 # 発行体集中度(§3.2 再掲)

unit_lot_exception: # §7-1 単元例外(日本個別株)。全帳簿共通(E8 小規模帳簿を含む)
  scope: jp_equity_single_name # 日本個別株
  max_units: 1 # 1単元までは集中度20%の超過を許容(2単元目以降は通常判定)
  unit_cost_nav_max: 0.35 # 例外適用は1単元の取得価額が NAV の 35% 以下の銘柄に限る(独立レビュー条件3)
  margin_buy_allowed: false # 例外適用ポジションの信用買いは不可

prohibitions: # §5 禁止事項
  trading_frequency: unrestricted # 取引頻度は制限しない(2026-08-03 ユーザー決定)
  instruments:
    - leveraged_etf # レバレッジ型 ETF
    - inverse_etf # インバース型 ETF
    - supervised_or_delisting_stock # 監理・整理銘柄
  restricted_list: null # 制限銘柄リスト(config で管理)TODO: リストの置き場所は 80-ips.md に未記載
  short_selling:
    allowed: true # ショート許可(レバレッジ・集中度の制約内)
    single_name_nav_max: 0.10 # 個別銘柄ショートは1銘柄 NAV の 10% まで
  mandate_direction: narrow_only # 禁止事項はマンデートで狭めることはできるが、緩めることはできない

products: # §8.2 デリバティブ・商品方針。IPS が明示的に許可しない商品はデフォルト不可
  default: deny
  allowed:
    - listed_equity_cash # 上場現物株式
    - etf # ETF
    - listed_futures_index # 上場先物(指数)
    - listed_futures_rates # 上場先物(金利)
    - listed_futures_commodity # 上場先物(コモディティ)
    - exchange_fx # 取引所 FX
  denied_explicit:
    - otc_derivatives # OTC デリバティブは現時点で不可
    - options # オプションは現時点で不可(ギリシャ管理の実装後に改訂で解禁を検討)

kill_switch: # §5 Kill Switch(多段・2026-08-03 改訂)。保護領域。ユーザーはいつでも発動できる(Discord)
  modes:
    kill: # ① /kill(凍結)—「システムが信用できない」時の既定
      effect: freeze # 全新規発注停止・ポジション維持
      exception_trades: per_trade_user_approval # 凍結中の例外的取引は1件ずつユーザー承認
    winddown: # ② /winddown(計画的現金化)
      effect: staged_liquidation # 決定論アルゴ(TWAP 等)で市場インパクトを抑えて段階的に全ポジションを現金化
      executor: deterministic_code_only # LLM を経由しない決定論コードのみで実行
    flatten: # ③ /flatten(緊急清算)
      effect: immediate_market_liquidation # 成行で即時全清算。コスト・スリッページを受け入れる緊急用
      executor: deterministic_code_only # LLM を経由しない決定論コードのみで実行
      confirmation_steps: 2 # 2段階確認必須
  passive_event_report: 運営 # 凍結中の受動イベント(強制決済・満期等)は検知次第 #運営 へ即時報告
  resume: user_explicit_only # 復帰はユーザーの明示操作のみ

asset_class_taxonomy: # §8.1 資産クラス・タクソノミー(ガードレール判定用の機械可読分類マスタ)
  classes:
    - equity_jp
    - equity_us
    - equity_other
    - bond
    - fx
    - crypto
    - commodity_futures
    - rates
    - cash
  derivative_classification: underlying # 指数先物・ETF は原資産のクラスに分類(株価指数先物=equity、金利先物=rates)
  equity_jp_us_separate: true # 「単一資産クラス 70%」は equity_jp と equity_us を別クラスとして判定

currency_policy: # §8.3 通貨方針
  base: JPY
  fx_hedging: false # 為替ヘッジは行わない(ヘッジコストと運用規模が見合わないため)
  risk_measurement: jpy_converted # 外貨建ての為替リスクは σ予算に内包し円換算で計測・監視

experiment_profiles: # §6 実験プロファイル(実弾移行までの並走運用)
  base_profile: aggressive # §3.2 の値は基準プロファイル aggressive の既定値
  frozen_during_experiment: true # プロファイルは実験中凍結(途中変更はその実験を無効化)
  live_books_profilable: false # 実弾帳簿は本則のみ・プロファイル化不可
  not_profilable: [governance, prohibitions, budget, protected_areas, audit] # §2・§5 等は唯一のまま
  parallel_limit: null # 並走数に固定上限は設けない(月次予算と E9 多重検定補正が原理的制約)
  profiles:
    aggressive: # 本書の値
      max_drawdown: 0.25
      gross_leverage_max: 2.0
      sigma_annual: 0.12
    moderate:
      max_drawdown: 0.15
      gross_leverage_max: 1.5
      sigma_annual: null # TODO: 80-ips.md §6 は moderate の σ予算を明記していない(勝手に決めない)
    conservative:
      max_drawdown: 0.10
      gross_leverage_max: 1.0
      sigma_annual: null # TODO: 80-ips.md §6 は conservative の σ予算を明記していない(勝手に決めない)
    moonshot: # 年率100%級を狙う実験枠。実現可能性の検証自体が実験目的
      max_drawdown: 0.60
      gross_leverage_max: 2.0
      sigma_annual: 0.50
      recalibration_required: true # moonshot 帳簿の較正は起票時に §3.1 と同一手法で再計算する
  e8_sweep: # E8 資本スケール&開始時点スイープ(§1・§6)
    capital_jpy_range: [100000, 1000000] # 戦略の採用判定は ¥10万〜100万の実弾想定規模でのみ行う
    small_book_reduction: single_pod # 縮約規則(独立レビュー C-14): 検証対象戦略のマンデートのみ適用・中央リザーブなし

benchmarks: # §3.2 / §4.3(評価専用。運用をこれに寄せる義務はない)
  - reference_mix # ①参照ミックス複製(旧政策ミックス: 国内株30/外国株30/債券15/戦術10/現金15)
  - equal_weight_buy_and_hold # ②等配分 buy-and-hold(評価プロトコル E3 と整合)
reference_mix: # §4.3 評価用の参照ミックスとしてのみ残す
  equity_jp: 0.30
  equity_foreign: 0.30
  bond: 0.15
  tactical: 0.10
  cash: 0.15

mandates: # 冒頭「優先順位」・81-fm-mandates.md §2-4
  precedence: ips_first # 本書はマンデートに常に優先。ゲートは IPS → マンデートの順に判定
  direction: narrow_only # マンデートが IPS を緩める方向の記述を持つことはスキーマで禁止する
  path: config/mandates
