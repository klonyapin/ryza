# config/feeds.yaml — 汎用ニュース RSS の取込対象。
#
# ingest.news_rss がこのリストを読み、各フィードを 15 分間隔でポーリングして
# docs.documents（source_type は下記 source_type）へ冪等取込する。robots / 利用規約を
# 尊重し、本文はリンク先を取得できる範囲に留める（設計 20-research §2）。
#
# ── 初期セット（設計リード確認待ち・私案）─────────────────────────────────────
# 20-research §2（2026-08-03 更新）で「官公庁・中銀 RSS を初期セットに含める」ことは
# 確定。以下 gov / central_bank ブロックは確定枠として active: true。一般報道社の
# 公開 RSS 選定（日経系・Reuters・Bloomberg 等）は朝刊編集方針の回答を反映して確定する
# ため、下部の news ブロックは active: false（コメント提案）で置いてある。URL は各社の
# 実提供状況に合わせて確定時に差し替える。

feeds:
  # ── 官公庁・中央銀行（確定枠・§2）──────────────────────────────────────────
  - name: 日銀
    url: https://www.boj.or.jp/rss/whatsnew.xml
    source_type: gov
    active: true
  - name: 財務省
    url: https://www.mof.go.jp/rss/new.xml
    source_type: gov
    active: true
  - name: 金融庁
    url: https://www.fsa.go.jp/fsanews.rdf
    source_type: gov
    active: true
  - name: FRB
    url: https://www.federalreserve.gov/feeds/press_all.xml
    source_type: central_bank
    active: true

  # ── 主要国統計局・国際機関（T-012 一括拡張・§2）────────────────────────────
  # URL は 2026-08 時点の私案。初回ポーリングで取得失敗するものは URL を実地確認して
  # 差し替える（失敗は ingest_all の errors と freshness で検知される）。
  # IMF は国際機関だが source_type の語彙（0003_docs.sql: news|filing|paper|social|
  # gov|court|policy + central_bank）に新語を増やさず gov 扱いとする。
  - name: 総務省統計局
    url: https://www.stat.go.jp/rss/whatsnew.xml
    source_type: gov
    active: true
  - name: 米労働統計局BLS
    url: https://www.bls.gov/feed/news_release.rss
    source_type: gov
    active: true
  - name: 米経済分析局BEA
    url: https://apps.bea.gov/rss/rss.xml
    source_type: gov
    active: true
  - name: ECB
    url: https://www.ecb.europa.eu/rss/press.html
    source_type: central_bank
    active: true
  - name: BOE
    url: https://www.bankofengland.co.uk/rss/news
    source_type: central_bank
    active: true
  - name: IMF
    url: https://www.imf.org/external/cntpst/prfeed.aspx
    source_type: gov
    active: true

  # ── 一般報道（私案・設計リード確認待ち: active=false）─────────────────────────
  # 朝刊編集方針の回答を反映して確定する。候補（公開 RSS の提供有無を要確認）:
  # - Reuters（ワールド/マーケット）  https://www.reutersagency.com/feed/
  # - 日経系の公開 RSS（提供範囲を確認）
  # - Bloomberg 公開分（提供範囲を確認）
  # - name: Reuters
  #   url: https://www.reutersagency.com/feed/?best-topics=business-finance
  #   source_type: news
  #   active: false
