      title: "src/ryza/reviews.py の保護領域登録の要否(発効 fail-safe の判定コード)"
      labels: [governance]
      body: "2026-08-04 に新設した `src/ryza/reviews.py` は、みなし承認 CLI が『審査側の記録と起票者の申告が食い違うか』を判定する経路そのものである(食い違えば発効を中止)。**判断は既にパーサ側に宿っている** —— (a) `BLOCKING_VERDICTS`(``reject`` / ``request_changes``)の集合が発効停止のトリガ語彙そのものであり、この集合を空にするだけで verdict による fail-safe は無音で無効化できる、(b) `is_repo_path_ref` / `resolve_review_path` の書式受理境界が『どの参照を意見書として読み、どれをリポジトリ外扱いにするか』を決めており、境界を緩めれば審査記録の突合が形骸化する、(c) 重複キー・様式不備の拒否も同じ論法。したがって本モジュールは『読み取り専用のパーサ』ではなく、governance_engine の一部として保護すべき統制コードである。**判断**: 独立役員審査 C-8 の裁定にしたがい保護登録済み(config/governance.yaml — 2026-08-04)。同時に対応する不変条件テスト `tests/test_reviews.py` も invariant_tests として登録し、境界の受理・拒否を先にテストで緩める二段手順を塞いだ。本リマインダーは登録の合意までの意思決定路であり、目的は完了(status: done)。将来の見直し材料: A-18-8 の `from_review_artifact` の実運用件数、パーサ変更頻度に対する承認手続の運用コスト。"
