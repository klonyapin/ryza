    # +認証不備で全件 404 になる誤検出を避けるため、`repos/<slug>` の到達性を先に確認する。
    # マージ実行者の照合は未実装(GitHub の設定上マージ実行者は PR 作成者と同一になりうるため
    # 統制価値が薄く、ブランチ保護 required review で担保する方が直接的)。
    status: done # 2026-08-04 実装(src/ryza/audit/a18.py の PRVerifier)

  - id: approved-trailer-v2
    what: "Approved トレーラ様式 v2(reviewed=<sha40> 等)と PR 実在照合 — PR 承継の起点検証(独立審査 2026-08-04 重大-1/重大-2 の恒久対策)"
    conditions:
      - type: date_after
        date: "2026-08-10"
    action:
      type: issue_create
      title: "Approved トレーラ様式 v2: 承継を reviewed SHA の祖先に限定し PR 実在を照合する"
      labels: [governance]
      body: "A-18-1 の PR 承継(2026-08-04 導入)は、first-parent 上の『件名がマージ形式・親2・Approved トレーラ有効』なマージが持ち込んだコミット群を承認扱いにする。独立役員審査(docs/reviews/g-a18-protect-independent-review.md「承継ルール審査記録」)は2つの構造的欠陥を PoC 付きで指摘した: **重大-1** `has_approval_trailer` は `^Approved:\\s*\\S+` を見るだけ、`_PR_MERGE_RE` は PR 番号の実在を見ないため、実在しない PR #999999 の件名+架空 URL のトレーラを持つマージが、ブランチ内 evil merge による Kill Switch 改変を violations=0 で通した。承継は偽トレーラ1件の爆風半径を『1コミット』から『ブランチ全体』へ公式化する。**重大-2** 承継は『マージ時点のブランチ全体』に及ぶため、独立審査・#承認 通知の**後**に積まれたコミットも同じトレーラで承認扱いになる(審査後 push の吸収)。実装内容: ①トレーラ様式を `Approved: <url> reviewed=<sha40> mode=deemed|principal notified=<ISO8601>` に拡張する(定款第5条 C-5 様式の改訂 = L1 手続)、②承継を `reviewed` SHA の祖先に限定する(reviewed より後に積まれたコミットは承継しない)、③`mode=deemed` は #承認 通知の実在と発効条件を機械検査する(定款 v0.4 は effective: on_notice のため 48h 経過検査ではなく**通知の実在**を照合する — 審査者の 48h 前提は v0.3 の様式で事実誤認、2026-08-04 設計リード裁定)、④様式不備のトレーラは承継の起点にしない(fail-safe)、⑤`a18-github-pr-verification`(PR 実在の API 照合)と統合してよい。移行: 既存の v1 トレーラ(reviewed 無し)は経過措置として当面 violations にしないが、承継の起点としては扱わない/扱う のいずれにするかを実装時に決めて記録すること。出典: 独立役員審査 2026-08-04 重大-1・重大-2 と反対意見書③(承継は reviewed SHA 固定を伴う場合のみ有効とし、それ以外は受容へ寄せる代替案)。"
    # 2026-08-04 実装(src/ryza/audit/a18.py・config/governance.yaml の様式コメント):
    #   ① 様式 v2 `Approved: <参照> reviewed=<sha40>` を**任意拡張**として受理(approval_trailers /
    #      reviewed_shas)。mode=/notified= は解釈せず属性として無視する — 定款 v0.4 のみなし承認は
    #      「通知と同時に発効」であり、通知の実在照合は A-18-5(未配送の検出)が既に担っているため
    #      トレーラ側に二重の様式を課さない(様式を増やすほど記入漏れで承継が落ちる副作用がある)
    #   ② 承継を reviewed の祖先に限定。reviewed 後に積んだコミットは (b)・(c) のいずれでも救済しない
    #   ③ 様式不備(40 桁 hex でない・リポジトリに存在しない reviewed)は承継の起点にしない(fail-safe)
    #   ④ **移行方針の決定**: v1(reviewed 無し)は当面 violations にせず、承継の起点としても
    #      **従来どおり扱う**。理由 = v1 を起点から外すと過去の全 PR 配下が一斉に違反化し、
    #      「毎週赤いが誰も見ない」形骸化(05-governance §6-5)を招く。代わりに承継件数を
    #      notes と embed(「様式 v1(範囲=マージ時点のブランチ全体)」)に毎週開示する
    #   ⑤ PR 実在照合を統合(a18-github-pr-verification を done に)
    status: done # 2026-08-04 実装(様式 v2 + PR 実在照合)

  - id: trailer-v1-sunset
