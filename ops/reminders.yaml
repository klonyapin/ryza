  - id: veto-origin-column
    what: "governance.decision_vetoes に否認の出所を表す origin 列を足すか判断する(独立役員審査 0021 C-8)"
    conditions:
      - type: date_after
        date: "2026-08-24"
    action:
      type: issue_create
      title: "decision_vetoes に origin 列(否認の出所)を追加するか判断する"
      labels: [impl]
      body: "0021 は decision_vetoes.run_id を NULL 可とした。理由は『否認は代表の作為(意思表示)でありジョブの生成物ではないため、生成元 Run という概念が本来的に無い』であり、独立役員審査 0021 C-8 はこの結論を妥当と認めた(当初コメントの『Discord 経路は Run を持たない』は事実誤認 — press.outbox.run_id は NOT NULL で、Discord 経路でも start_run で Run は取得できる)。ただし run_id が NULL であることは『Run が無い』のか『埋め忘れ』なのかを区別しない。是正候補: origin 列(discord_button|cli|job|migration 等)を足し、どの経路から否認が記録されたかを明示する。判断材料: ①実際に否認が記録される経路が何種類できたか(#承認 のボタン配線後に確定する — governance-deemed-notice-wiring)、②監査(deemed_ratio・A-18)が出所別の集計を必要とするか。必要が無ければ『足さない』を明示的に決めて本リマインダーを done にすること(未決のまま放置しない)。migrations は保護領域のため独立役員審査+みなし承認の手続を経ること。【2026-08-04 判断材料が確定 — 優先度を上げる】否認の記録経路は Discord のみ3つ(#承認 の否認ボタン+モーダル / /veto / /unveto)で、いずれも run_id を記録するようになった(governance-deemed-notice-wiring・独立役員審査 重要-5 後段)。したがって『run_id が NULL = Run が無い』と『埋め忘れ』の区別は当面つくが、**オーナー検証が呼び出し側供給の2引数比較でしかない**ため(同審査 重要-5 前段)、事後に『どの経路から否認が記録されたか』を独立に確認できることが実質的な統制になる。origin 列(discord_button|slash_command|cli|job)の追加を『足す』方向で再評価すること。**(完了 2026-08-04)** migrations/0030 が `governance.decision_vetoes.origin`(text NOT NULL・CHECK IN (discord_button, discord_command, cli, job))を追加した。判断: **足す**。決め手は「run_id では経路を識別できない」ことである —— 否認ボタン経路と `/veto` は同じ job_name(bot.governance.veto)で Run を開くため、meta.runs を辿っても両者を区別できない。オーナー検証が呼び出し側供給の2引数比較でしかない以上(重要-5 前段)、「どの経路から書かれたか」が行に残っていることが、想定外の経路からの否認を事後に検出する唯一の手がかりになる。実装: ①既存行は ADD COLUMN ... NOT NULL DEFAULT 'discord_button' でバックフィルし**直後に DROP DEFAULT**(既定を残すと渡し忘れが黙って通り、列の目的が失われる。UPDATE でのバックフィルは 0021 の追記オンリートリガが拒否するため、行トリガを発火しない DDL の DEFAULT を使った)。バックフィル値は**推定**であり、当時の記録経路がDiscord のみだった事実に基づく(ボタンと /veto の事後判別は不可能 — 同じ job_name)。②`decisions.record_veto` / `record_revert_completion` / `record_veto_withdrawal` と `notices.apply_veto` / `withdraw_veto` は origin を**必須キーワード**で受ける(既定値を置かない)。③Discord の3経路が正しい値を渡すこと(ボタン=discord_button、/veto ・ /unveto=discord_command)を AST テストで固定。④`governance.current_decisions` view に `veto_origin` を通し、#運営 の否認・撤回通知にも「出所」を表示する。**残る限界**: origin も呼び出し側の申告であり、DB は経路を独立に観測していない。捕まえられるのは「配線したつもりのない経路からの記録」であって、経路の詐称ではない。"
    status: done # 2026-08-04 migrations/0030 で origin 列を追加(判断: 足す)

  - id: governance-role-separation
    what: "governance スキーマ(承認・否認・議事録)の DB ロール分離を実弾移行前提条件に加える(独立役員審査 0021 C-9)"
    conditions:
      - type: date_after
        date: "2026-09-01"
    action:
      type: issue_create
      title: "governance スキーマの DB ロール分離(実弾移行前提条件)"
      labels: [impl]
      body: "0021 は decision_vetoes・decisions・minutes・stances に追記オンリートリガ+REVOKE UPDATE,DELETE,TRUNCATE を掛けたが、**REVOKE は所有者ロールには効かない**。現構成はアプリ・ジョブ・マイグレーションが単一ロール(ryza)で動き、そのロールがこれらの表の所有者であるため、REVOKE は実質 no-op であり、所有者は `ALTER TABLE ... DISABLE TRIGGER` でトリガ自体を無効化できる(独立役員審査 0021 C-9(i))。つまり承認・否認・議事録の追記オンリー性は『アプリが行儀よく振る舞うこと』にしか依存していない。既存の db-role-separation-webhook-url(配送コンポーネントの webhook URL 読取制限)は governance スキーマを対象に含めていないため、本件を別リマインダーとして登録する。是正: ①governance スキーマの表を専用の所有者ロールに移し、アプリロールには INSERT/SELECT のみを付与する、②マイグレーション実行ロールのみが DDL を持つ、③A-18 か別監査で『トリガが有効であること』を定期検査する(ロール分離が完了するまでの補償統制として先に入れてもよい)。デモ期間は単一利用者 VM・非公開 DB のため残余リスクを受容するが、実弾移行の前提条件とする。"
    status: pending

