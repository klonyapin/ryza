      labels: [governance]
      body: "現行の boardroom.mark_resolution は『議事録の出席者に独立役員が居るか』しか見ない(src/ryza/governance/boardroom.py)。そのため会議の冒頭で独立役員が別論点に1度発言していれば、その後に代表が持ち出した本題が無批判のまま決議できてしまう(独立役員 再確認審査 懸念A)。実装内容: ①チェックを『最終の代表発言以降に独立役員の発言があるか』へ精緻化する(guard_scope_text と同じ区間の考え方を決議側にも適用)、②confirmed_without_critic=True で通した決議を証跡として残す(現状は DB に痕跡が無く、連続使用を検出できない — governance.minute_resolutions への列追加は保護領域のため独立役員審査が必要)、③監査ジョブ(src/ryza/audit)に『確認付き決議の連続』を 05-governance §6-5(形骸化の防止)のアラートとして追加する。②の列追加なしに③は成立しないため順序に注意。"
    # 2026-08-03 実装(ブランチ resolution-recency)。①minute_critic_recency /
    # critic_spoke_after_last_representative(議事録本文の話者行から復元。判定不能も
    # 通さない fail-closed — 決議精緻化審査 懸念1)、②migrations/0025
    # (confirmed_without_critic の三値。保護領域)、③resolution_confirmation_stats +
    # ops-weekly ダイジェスト行(連続3件 or 走査窓内5件で警告)・ダッシュボードの決議欄。
    # ③の設置先は src/ryza/audit ではなく週次 ops(設計リード指示)。週次の実配線は
    # boardroom-audit-wiring、残る懸念は critic-input-window-decision-visibility /
    # speaker-label-stability へ分割登録した。
    status: done # 2026-08-03 実装・独立役員審査済み(条件付きマージ可。是正反映済み)

