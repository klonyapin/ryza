  - id: curated-universe-daily-reconcile
    what: "承認済み curated ユニバース config の DB 反映が人手の一回きり操作で、実行漏れが無言のドリフトになる(2026-08-04 の fm.jim universe=0)"
    # 起票前に是正済みのため発火条件は空(conditions は OR 評価 → 空なら常に False)。
