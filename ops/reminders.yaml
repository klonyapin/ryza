      title: "ledger: qty==0 の銘柄も評価替えを打つ(全売却後の securities 残渣で NAV が恒久過大)"
      labels: [impl, ledger, risk]
      body: "建玉を全売却した銘柄の `securities` 勘定に前日 MTM の残渣が残り、NAV が**恒久的に過大**になる。`ledger.closing.run_daily_close`(`closing.py` の held_instruments ループ)も `ledger.closing._reapply_mtm` も、`qty == 0` を評価替えの**前**にスキップするため、建玉ゼロの銘柄が時価ゼロへ洗い替えられないからである。売却時の `post_fill` は取得原価ぶん(`cost_released`)しか `securities` を取り崩さないので、評価益ぶんが資産に残る。**独立審査の実測(origin/main でも同一 — 本 PR の回帰ではない)**: 1000株@1000 買い → 終値 1200 で評価替え → 翌日 1200 で全売り → `securities` 残高 200,000・数量 0、NAV 10,200,000→10,400,000、`book_returns` は `[+0.0196, 0.0]`(真値 `[0.0, 0.0]`)。これは新-3 と構造的に同一の恒久的偽リターンであり、`ewma_vol` 経由で誤 `vol_exceeded` の経路に乗る。**本 PR(mtm-replay)固有の害**: 遅延全売り日の再締めが `mtm_reapplied=True` と『その日の終値で評価替えして NAV に反映した』注記を付けながら 1 銘柄も評価替えしない(`positions={}` で残渣は資産に残る)。是正: `qty == 0` でも評価替えを打つ(delta = 0 − 帳簿価額)。**run_daily_close と _reapply_mtm の両呼び出し口を同時に**直すこと(片方だけだと当日と再締めで NAV が食い違う)。売り約定の残渣そのものを post_fill 側で消す設計(時価で取り崩す)も代替として検討し、移動平均法の実現損益計算への影響を評価すること。**src/ryza/ledger/ は保護領域(定款第5条)のため独立役員審査+みなし承認の手続を経ること。別 PR とする。** 出典: docs/reviews/risk-navflow-rollforward-independent-review.md MTM リプレイ審査記録 新-10。"
    # 2026-08-04 実装: run_daily_close と _reapply_mtm の両方で qty==0 の銘柄も評価替えの
    # 対象にし、残渣(= 売却で取り崩されない評価益ぶんの帳簿価額)をゼロへ洗い替える。
    # 数量ゼロの時価は価格に依らずゼロなので終値は引かない(post_mark_to_market の
    # price=None 経路 — 建玉ゼロの銘柄の終値を要求すると上場廃止・バー欠測で締めごと
    # 落ちる)。証憑は price=null + zero_qty_writeoff で「終値 0 円で評価した」と書かない。
    # **審査の処方(delta = 0 − 帳簿価額)はそのままでは危険**: replay_position は
    # broker_fill しか再生しないため現物拠出・資産振替の securities も数量ゼロに見え、
    # 総額を消すと実在の資産が消える(実測: 現物拠出 1,000,000 の日の NAV が丸ごと戻り
    # tests/execution/test_close.py の 2 本が落ちた)。そこで _util.mtm_book_value を
    # 新設し、**評価替え(price_snapshot 証憑)が作った残高だけ**を洗い替える。
    # 代替案(post_fill 側で時価取り崩し)は不採用: 実現損益が『時価 − 時価 = 0』になり
    # 移動平均法の実現/未実現の切り分けが壊れるため(残渣の所在が変わるだけ)。
    # 実測(修正後): d1 NAV 10,400,000 → 10,200,000、securities 残高 0、returns [0.0, 0.0]。
    # 2026-08-04 独立審査(残渣修正審査記録)= 条件付き承認。新-13(将来日付売りの先行記帳で
    # 実在建玉を消す回帰。as_of の非対称)・新-14(kind 偽装で洗い替えを誘発)・新-15
    # (説明不能な残渣の検出器が無い)・新-16(記録スキーマの二重化)を同 PR で是正済み。
    # 新-14 の構造的根治は mtm-separate-account、新-17 は in-kind-contribution-mtm へ分割。
    status: done

  - id: mtm-separate-account
    what: "評価替えの残高を推定でなく勘定体系で切る(MTM を独立勘定へ分離 — 残渣修正審査 新-14 の構造的根治)"
    conditions:
      - type: date_after
        date: "2026-08-24"
    action:
      type: issue_create
      title: "ledger: MTM を独立勘定へ分離し、mtm_book_value の推定をやめる"
      labels: [impl, ledger, risk]
      body: "全売却後の残渣を洗い替える量は `_util.mtm_book_value`(`securities` 勘定のうち evidence.kind='price_snapshot' かつ `journal_entries.posted_by` が締めジョブ由来の行の合計)で**推定**している。洗い替えは NAV を双方向に動かす原始操作なのに、判定子が仕訳の自由記入列である点が本質的な弱さである(独立審査の実測: kind を騙る手仕訳 Dr securities 3,000,000 / Cr capital は、posted_by 判定の追加**前**は次の締めで全額消され NAV 13,000,000→10,000,000、貸方 500,000 は逆に NAV を無から 10,500,000 に増やした)。posted_by の連言追加でこの 2 攻撃は塞いだが、`post_entry` の呼び出し側は依然その値を騙れる。根治: 評価替えの結果を `securities` に混ぜず**独立勘定**(例: `securities_mtm` / 未実現評価勘定)に積み、残渣の同定を勘定残高そのもの(推定不要)にする。BS 表示は securities + mtm の合算、`securities_book_value` / recon の valuation 突合・ダッシュボードの読み替えも同時に設計すること。**勘定科目の追加は migrations(保護領域)を伴うため独立役員審査+みなし承認が必要。** 出典: docs/reviews/risk-navflow-rollforward-independent-review.md 残渣修正審査記録 新-14。 **完了(2026-08-04)**: 採用して実装した(判断の全文は `docs/design/11-mtm-account-separation.md`)。`migrations/0034_ledger_mtm_account.sql` が `securities_mtm`(資産・評価調整)をファンド帳簿に追加し、`post_mark_to_market` の記帳先をそこへ移した。`mtm_book_value` は述語つき集計から**勘定残高**になり判定子が消えた(逆仕訳の除外も残高相殺で不要)。`securities_book_value`(帳簿価額 = 時価)の意味は変えず中身を 2 勘定の合計にしたので、recon の評価額突合・statements・risk 側は無変更で通る。**採否の決め手は移行コストの実測**: 2026-08-04 時点の本番 DB は journal_entries 2 行(出資仕訳のみ)/ securities 明細 0 行 / nav_snapshots 0 行であり、過去残高の振替仕訳も、振替が水位を進めることによる全営業日の再締めも発生しない。追記オンリー(0005)なので履歴が積まれた後の分離は再分類仕訳しか手段が無く、必ず `reclose_stale` に引っかかる — **コスト無しで入れられるのは今だけ**である。**本命の利得は推定の除去ではなく恒等式**: 原価と評価調整を分けたことで『`securities` 残高 = `replay_position` の取得原価』が毎締めに機械検査できるようになり(`closing` の `unexplained_residue`、reason=`cost_identity_broken` / `zero_qty_residue`)、新-15(説明不能な残渣を誰も見ていない)の検出漏れを塞ぐ。**ただし恒等式が覆うのは原価勘定側だけである(重要 — 独立審査 新-19)**: 評価調整勘定を直接叩く偽装(締めジョブ名を騙った `Dr securities_mtm / Cr capital`)は恒等式に一切現れず(審査実測: NAV 13,000,000→10,000,000・`unexplained_residue` は空)、**分離は新-14 の攻撃を塞がない** — 宛先が移るだけである。その経路の防御は `post_mark_to_market` の posted_by 検証と DB トリガ `ledger.check_mtm_line` であって恒等式ではない。構造的に断つには DB ロール分離が要る(未実施 — 申し送りは 11 §7)。**独立審査(2026-08-04)の条件是正**: 新-18 = トリガの逆仕訳免除を `reversal_of` のフラグから**実突合**(対象仕訳に借貸を入れ替えた同一勘定・同一銘柄・同額の明細があるか — `ledger.reversal_mirrors_line`)へ狭めた。フラグ免除のままでは無関係な entry_id を入れるだけで posted_by 検証を迂回でき、審査実測で新-14(a) が完全再現した。新-19 = コード側の文言を設計文書 §5.2-1 の限界に統一。新-20 = 原価勘定にも同型ガード `ledger.check_cost_line`(instrument_id 必須 + 親証憑 kind ∈ `POSITION_EVIDENCE_KINDS` or 実突合済みの逆仕訳)を追加し、instrument_id NULL の無言 NAV 混入(審査実測 12,000,000 が恒久残存)を封鎖した。posted_by ではなく kind で切ったのは、原価勘定の書き手が複数あり posted_by 許可リストは広すぎるか正当な呼び出しを壊すかのどちらかになる一方、kind は `replay_position` が見る値そのものでガードと恒等式が同じ定義を共有するため(11 §6.2)。"
    status: done # 2026-08-04 実装: migrations/0034 + 勘定分離 + 原価恒等式検査(独立審査は PR で)

  - id: in-kind-contribution-mtm
    what: "現物拠出の建玉が一度も評価替えされない前提の是正(残渣修正審査 新-17)"
    conditions:
      - type: date_after
        date: "2026-08-24"
    action:
      type: issue_create
      title: "ledger: 約定を経ない建玉(現物拠出)の建玉数量をどこが持つか決める"
      labels: [impl, ledger]
      body: "`_util.replay_position` は broker_fill 証憑しか再生しないため、約定を経ずに建った `securities`(現物拠出 Dr securities / Cr capital・資産振替)は**数量ゼロに見え、一度も評価替えされない**(独立審査の実測: 終値 1500/2000/500 を渡しても残高は拠出額 1,000,000 のまま、`detail.positions` にも現れない)。数量ゼロ残渣の洗い替えが『約定外の建玉に触れない』で正しくいられるのはこの前提のおかげであり、in-kind を時価評価する必要が出た時点で前提は崩れる(評価替えの対象になった途端、数量の出どころが無い)。決めるべきこと: ①現物拠出を制度として扱うのか(扱わないなら post_entry 側で securities への直接記帳を禁じる方が明快)、②扱うなら建玉数量の真実をどこに持たせるか(`trade.fills` 相当の建玉イベント表 or 拠出時に数量付きの証憑を要求する)。当面は締めの `unexplained_residue`(新-15)が該当銘柄を毎日名指しするので、黙って評価から漏れる状態にはない。出典: docs/reviews/risk-navflow-rollforward-independent-review.md 残渣修正審査記録 新-17。 **完了(2026-08-04)**: ①現物拠出を制度として扱う、②建玉数量の真実は**拠出時の数量つき証憑**に持たせる、を採った。`posting.post_in_kind_contribution` が `kind='in_kind_contribution'` の証憑(instrument_id / qty / price)を作り、`_util.replay_position` の再生対象(`POSITION_EVIDENCE_KINDS`)に含める。以後 in-kind 建玉は `held_instruments` → `post_mark_to_market` の経路に乗り、約定建玉と同じ移動平均法で扱われる(混在ケースの実測: 拠出 1000@1000 + 買い 1000@2000 → 平均原価 1500、500 株を 2500 で売って実現益 500,000)。逆仕訳した拠出は再生から落ち、評価替えの残渣も洗い替えられる。**建玉イベント表を新設する案は採らない** — `trade.fills` と証憑という既存の 2 つの真実に 3 つ目を足すためである。**数量つき証憑を伴わない直接記帳は 0034 の原価勘定ガード(新-20)が書込時に拒否する** — 恒等式で検出する以前に、数量を再生できない行が原価勘定に載れなくなった。**未対応**: 現物払戻・株式分割・併合(いずれも証憑 kind を分けて数量の増減を表現する拡張。未対応の経路が `securities` を動かそうとすると fail-loud で拒否される)。 **独立審査(2026-08-04)の条件是正 — 新-21**: 拠出は約定を経ずに NAV を増やすプリミティブであり、証憑の数量・単価は記帳した側の申告なので**原価恒等式は構造的に必ず成立する(実在性の検査にならない)**。しかも新-17 の是正により架空の拠出は評価替えにも乗るようになった(是正前は原価のまま動かなかった)。統制として ①`posted_by ∈ _util.IN_KIND_POSTED_BY`(運用オペレーション経路のみ)②記帳と**同一トランザクション**での #運営 通知(`press.outbox`・urgent。呼び出し側が落とせない)を入れた。どちらも申告制の域を出ず、実在性は人が見る側での照合に委ねる — 限界の全文は docs/design/11 §7。"
    status: done # 2026-08-04 実装: in_kind_contribution 証憑を replay_position の再生対象に(審査 新-21 の統制込み)

  - id: post-fill-asof-symmetry
    what: "post_fill の cost_released が as_of 非対称で、健全な帳簿でも原価恒等式が偽陽性を出す(MTM 勘定分離審査 新-22)"
    conditions:
      - type: date_after
        date: "2026-08-10"
    action:
      type: issue_create
      title: "ledger: post_fill の売りを as_of 対称にし、cost_identity_broken の偽陽性を消す"
      labels: [impl, ledger, risk]
      body: "`posting.post_fill` の売りは `_util.replay_position(conn, book_id, instrument_id)` を **as_of なし(全期間再生)** で呼んで `cost_released` を決める(`posting.py` の売り分岐)。一方 `closing.run_daily_close` の原価恒等式は `as_of=date` で切るため、**後日付の約定が先に記帳されている日**は健全な帳簿でも両者がずれて `cost_identity_broken` が鳴る。独立審査の実測: d0 買い 100@500 → d2 買い 100@700 を先に記帳 → d1 売り 50@800 → d1 の締めが `{book_value: 20000, replay_cost: 25000, qty: 50, reason: cost_identity_broken}`(d2 の締めでは消える)。この日は #運営 に ⚠️ が飛ぶ。**毎日の通知に載せる検査なので偽陽性の第一の源は先に潰す**(通知疲れは検出器を殺す — 再-7 と同じ論点)。是正の方向: 売りの `cost_released` を `as_of=entry_date` の再生で決める(新-13 が `post_mark_to_market` で行った是正と同型)。**ただし過去日付の約定を後から入れると既記帳の実現損益と食い違う**ため、恒等式側を「その日までに記帳された順序で再生する」に寄せる案も含めて比較すること。会計エンジン(保護領域)。出典: docs/reviews/risk-navflow-rollforward-independent-review.md MTM 勘定分離審査記録 新-22。 **完了(2026-08-04)**: 是正は**2 つで一組**だった。(1) `post_fill` の売りを `as_of=entry_date` の再生にする(保有超過判定も同じ境界になる)。(2) `_util.replay_position` の再生順を `entry_id` から **`(entry_date, entry_id)`** にする。(1) だけでは偽陽性は消えず **d1 から d2 へ移るだけ**である — `entry_id` 順の再生は as_of=d2 のとき d2 の買いを d1 の売りより前に置くため、原価 90,000 に対し残高 95,000 になる(実測。テストの d2 側アサーションがこれを固定している)。絞り込みが日付・並びが記帳順という混成が根因であり、数量は順序に依存しないが移動平均の原価は依存する。実測: 修正前の d1 締めは審査記録どおり `{'1001': {'book_value': '20000', 'replay_cost': '25000', 'qty': '50', 'reason': 'cost_identity_broken'}}` を出し、修正後は d1・d2 とも `{}`。reminder が挙げた「恒等式側をその日までに記帳された順序で再生する案」は採らない — 過去日の原価に将来日付の約定が混ざり point-in-time(不変原則4)を壊すため。**真陽性は温存**: 売りを記帳した後からその売りより前の日付の買いを入れた帳簿は依然として名指しされる(残高 95,000 / 再生 90,000 — 実現損益が古い平均原価で確定している事実)。証憑に `cost_released` を焼き込む案は恒等式を内部整合の検査に退化させる(新-21 と同じ形)ので採らない。回帰テスト: `tests/ledger/test_posting.py::test_sell_releases_cost_at_the_entry_date_not_the_whole_history` / `::test_sell_rejects_quantity_not_held_on_the_entry_date` / `::test_backdated_buy_after_a_sell_still_breaks_the_cost_identity`、`tests/ledger/test_closing.py::test_close_does_not_flag_a_healthy_book_with_a_future_dated_fill`。 **差分審査の是正(再22-1・2026-08-04)**: 上記 (1) は**記帳ガードに穴を開けていた**。売却可能性を `as_of=entry_date` の保有数量だけで判定すると、後日付の売りが記帳済みのとき同じ株を二重に払い出せる(審査実測 P3: 買 d0 100 → 売 d3 100 記帳後の 売 d1 50 が受理され qty=−50 の幻の売建。しかも残高も再生も −25,000 で一致するため**原価恒等式は沈黙**し、締めに負数量の検査も無い — main より弱くなっていた)。是正: 原価は `as_of=entry_date` のままにし、**売却可能性は候補売りを日付位置に挿入した全履歴再生で running 数量が全時点 0 以上**であることを要求する(`_util.worst_running_qty_with_sell` / `_util.position_events`)。「`as_of` 判定と全期間 `qty>=q` の AND」では不足 — 買いが後日付で先行していると途中の負区間を見逃す(実測: 買 d0 100 / 買 d4 100 / 売 d3 60 のとき 売 d1 100 は端点が 100・140 とどちらも通るが推移は d1:0 → **d3:−60** → d4:40)。端点でなく最小値を見る。是正後は両ケースとも拒否し、メッセージが不足の起きる日と数量を名指しする。回帰: `::test_sell_rejects_double_release_when_a_later_dated_sell_exists` / `::test_sell_rejects_a_negative_interval_hidden_by_a_later_dated_buy` / `::test_worst_running_qty_accepts_a_sell_that_stays_non_negative`。出典: 同審査記録 新-22/新-24 是正審査記録 再22-1。"
    status: done # 2026-08-04 実装: post_fill を as_of=entry_date に + replay_position の再生順を (entry_date, entry_id) に(対の是正)

  - id: mtm-account-live-fund
    what: "LIVE_FUND 帳簿を作るときに securities_mtm 勘定を seed する手順(MTM 勘定分離審査 新-23)"
    conditions:
      - type: date_after
        date: "2026-09-01"
    action:
      type: issue_create
      title: "ledger: LIVE_FUND 作成時に評価調整勘定 securities_mtm を必ず seed する"
      labels: [impl, ledger, ops]
      body: "`migrations/0034_ledger_mtm_account.sql` の勘定追加は **適用時点の `book_type='fund'` に対する一回限りの INSERT** であり、コメントの『将来の LIVE_FUND もここに乗る』は**誤り**である(独立審査 新-23 が実測で指摘、コメントは是正済み)。0006 の 18 科目を写して将来のファンド帳簿を作ると、最初の評価替えが `ValueError: 未知の勘定科目: …securities_mtm` で落ちる。fail-loud ではあるが **LIVE_FUND は実弾(定款第3条の3専決)**であり、初日の締めが落ちる設計にはしない。対応: LIVE_FUND を作る migration / 手順に `securities_mtm`(asset・有価証券評価調整)を含めること、または `ledger.books` への INSERT に対するトリガでファンド帳簿の必須勘定を自動 seed すること。後者なら二度と落とせない。出典: 同審査記録 新-23。"
    status: pending

  - id: mtm-posted-by-single-source
    what: "評価替えの posted_by が DB トリガと Python 定数の二重管理(MTM 勘定分離審査 新-24)"
    conditions:
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "ledger: MTM_POSTED_BY をトリガと Python で単一ソース化する"
      labels: [impl, ledger]
      body: "`ledger.check_mtm_line`(migrations/0034)は許可する記帳経路を `'ledger.closing'` で**ハードコード**しており、`_util.MTM_POSTED_BY` と二重管理になっている。2 つ目の値を足すと Python は通し DB が `RaiseException` で拒否する(独立審査 新-24 の実測)。当面の検出として `tests/ledger/test_posting.py::test_every_mtm_posted_by_value_is_accepted_by_the_database`(`MTM_POSTED_BY` の全要素が DB に受理されることを固定)を置いたので**黙って壊れることはない**が、単一ソースにはなっていない。案: (a) 許可値を `ledger` スキーマの小さな設定表に持たせ、トリガと Python の両方がそれを読む(表の更新は migration = 保護領域の変更になる)、(b) トリガ生成を migration テンプレート化して Python 定数から生成する。(a) が素直だが「勘定体系の変更が表の 1 行更新で済む」ことの是非を審査で問うこと。出典: 同審査記録 新-24。 **完了(2026-08-04)**: 案 (a)(設定表)も (b)(テンプレート生成)も**採らなかった**。(a) は表の更新が migration である以上「単一ソース」にならない一方、『勘定体系の統制が 1 行の UPDATE で外せる』書き込み経路を新設する — 保護領域の統制を弱める方向であり、実利(migration を 1 本書かずに済む)に見合わない。(b) は生成物の migration が履歴として固定される以上、生成し直しと適用の手順がむしろ増える。採ったのは**片側だけの変更が必ず落ちることの固定**である: `tests/ledger/test_posting.py::test_mtm_posted_by_matches_the_database_trigger` が `pg_get_functiondef('ledger.check_mtm_line()')` からトリガ本文の許可値集合を抽出し、`_util.MTM_POSTED_BY` と**双方向で**突合する(0019 C-11 の `pg_get_constraintdef` 突合と同じ形。部分文字列検査だけでは『トリガ側にだけ余分な値がある』= Python が知らない記帳経路が DB で通る、を検出できない)。抽出できなかった場合は空集合になって落ちるので、トリガの書き方を変えたときに黙って素通りしない。両側に足す / 片側だけ足すの 3 ケースは `::test_posted_by_single_source_check_detects_one_sided_changes` が DB 非依存で固定。既存の `::test_every_mtm_posted_by_value_is_accepted_by_the_database` は振る舞い側(実際に記帳して DB が受理するか)として残す。将来の変更手順は `_util.MTM_POSTED_BY` の docstring に明記した(Python に足す → **同じ PR で** `CREATE OR REPLACE FUNCTION ledger.check_mtm_line()` の migration を足す → テストが一致を見る。適用済みの 0034 は書き換えない)。 **差分審査の是正(再22-2・2026-08-04)**: `ledger.check_cost_line` の `POSITION_EVIDENCE_KINDS` にも同じ二重管理があり、そちらはテストも登録も無かった。突合部品を変数名でパラメータ化し(`_trigger_allowed_values(source, variable)`)、`::test_cost_evidence_kinds_match_the_database_trigger` を追加。原価勘定側は影響がより直接的で、トリガ側にだけ kind を足すと原価勘定に数量を再生できない行が入り**締めの原価恒等式が毎日鳴る** — 新-22 の是正で守った通知経路をまた汚す経路である。片側だけの変更を捕まえる 3 ケースは両トリガについて parametrize 済み。"
    status: done # 2026-08-04 実装: トリガ定義文字列 ⇔ MTM_POSTED_BY の双方向突合テスト + 変更手順を定数の docstring に

  - id: close-stage-failure-visibility
    what: "締め段が落ちた日にリスク日次が未再締めの系列を黙って測る問題(再々審査 起草者留意点(a)の独立評価 — 中)"
    conditions:
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "jobs.daily: 締め段の失敗をリスク日次へ伝え、未再締めの系列で黙って測らせない"
      labels: [impl, risk, ledger]
      body: "`ledger.closing.reclose_stale` の呼び出し口は `execution/close.py` の `run_demo_close` だけであり、`jobs/daily.py` の `_run_stage` は execution 段の例外を握って後続を走らせる。したがって締めが落ちた日は、当日のスナップショットも再締めも走らないまま `run_risk_daily` が**未再締めの系列を黙って測る**(遅延仕訳が入ったままの NAV で DD・実現ボラ・ES を出し、`risk.limits_state` を更新する)。レポート上は『データ n 営業日』としか出ず、締めが飛んだ事実は実行サマリの execution 段にしか残らない。是正案: (1) `run_risk_daily` に『直近の締めが成功したか』を渡し、失敗日は測定を保留する(fail-safe — T-014 判断11 と同じ姿勢)か、(2) 少なくとも `state_metrics` と embed に『当日の締め未完了』を明記して urgent にする。締めの成否は execution 段の StageResult か、`ledger.nav_snapshots` に当日の行があるかで判定できる。出典: docs/reviews/risk-navflow-rollforward-independent-review.md 再々審査 起草者の留意点3点の独立評価 (a)。 **完了(2026-08-04)**: 是正案 (2) を採った(測定は続けて事実を必ず可視化する)。`jobs/daily.py` が execution 段の `StageResult.ok` を `run_risk_daily(close_ok=...)` へ渡す — 段は savepoint で囲まれているため、落ちた日は当日スナップショットも再締めも残らず、`ok` はそのまま『締めが系列に反映されたか』になる。失敗日は `risk/daily.py` がレポート先頭(独立フィールド『本日の締め』+ description 冒頭)に `⚠ 本日の締めが失敗 — 測定は前日までの系列に基づく` を出し、フラグが 1 つも立っていなくても urgent にし、`state_metrics` に `close_ok` / `close_error` を残す。ダッシュボードのリスクページも `close_ok=false` の測定を警告表示する。案 (1)(測定自体の保留)を採らなかったのは、保留すると `risk.limits_state` が更新されずゲートが古い状態で通し続けるため — 測定を止めるより『この数字は前日までの系列だ』と宣言する方が fail-safe である(独立審査もこの判断を支持。ただし誤 dd_hard の解除が委員会専決である点への留保が付き、IPS 復帰手順への追記を `ips-dd-release-procedure` に登録した)。 **独立審査の条件是正(重大-2)**: 初版の既定 `close_ok=True` は『知らない』を『成功した』と台帳に断定するため、締めが落ちた朝に CLI を手動再実行するだけで警告が消えた。既定を `None`(不明)に変え、そのときは `ledger.nav_snapshots` に当日行があるかを risk 側で自己検証する(無ければ `CLOSE_MISSING_NOTE` + urgent + `metrics.close_ok=false` / `close_self_checked=true`)。呼び出し側の作法に fail-safe を依存させない。出典: docs/reviews/risk-observability-independent-review.md 重大-2。"
    status: done # 2026-08-04 実装: jobs/daily → run_risk_daily(close_ok) + レポート先頭警告 + urgent(審査 重大-2 是正済み)

  - id: ips-dd-release-procedure
    what: "IPS §3.2 復帰手順に『dd_hard 設定時イベントの close_ok 確認』を追記する(独立役員審査 2026-08-04 の留保条件)"
    conditions:
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "IPS §3.2 復帰条項の運用手順に close_ok 確認を明記する(CIO 起票)"
      labels: [decision, risk, ips]
      body: "締めが落ちた日でもリスク日次は測定を続ける(前日までの系列であることを宣言して続行 — `risk/daily.py` の `close_ok`)。この設計は独立役員審査 2026-08-04 で支持されたが、**留保条件が 1 つ付いている**: 未再締めの系列は過去 NAV が誤りうるため `dd_hard` が誤って立つ可能性があり、その解除は委員会専決(`risk.state.release_dd_hard`)である。誤検知でも解除には委員会の明示操作が要り、運用者は『測定の前提が壊れていた日に立ったフラグか』を判断する材料を手順として持っていない。是正: IPS §3.2 の復帰条項の運用手順に『dd_hard が立った際は、当該 `risk.limits_state_events`(event=engine_update)の `metrics.close_ok` / `close_self_checked` を確認し、false であれば締めを完了させたうえで再測定してから復帰可否を審議する』を明記する。**コード変更は不要**(`metrics` に既に記録済み)。IPS は L2 文書のため CIO 起票メモ+投資委員会決議で改訂すること(定款第4条)。起票メモには『この確認を怠ると、締め障害由来の誤 dd_hard がラッチとして残り、解除のたびに委員会の議事が消費される』というコストを添える。出典: docs/reviews/risk-observability-independent-review.md(設計判断の段落)。 **完了(2026-08-04・CIO 起票代行)**: docs/design/80-ips.md §3.2 の表の直後に「dd_hard 復帰手順の前提確認」を追記した — 復帰審議の前に `risk.limits_state_events`(`event=engine_update`)の `metrics.close_ok` / `close_self_checked` を確認し、`close_ok=false` なら締め完了後の再測定を先に行う。`config/ips.yaml` は**変更しない**: 追記は運用手順であってリミット値・条項構造の変更を伴わず、機械可読版に対応する項目がないため(hard_limits の値は不変)。版番号も v1.3 のまま据え置き、A-18-2(80-ips.md ⇔ config/ips.yaml の版突合)は一致を保つ — 判断の根拠は 80-ips.md 付録に明記した。発効は定款第3・4条のみなし承認(L2: 独立役員審査 → `#承認` 通知と同時に発効・事後否認可)であり、**本コミットは起票のみ**。"
    status: done # 2026-08-04 CIO 起票代行: 80-ips.md §3.2 に close_ok 確認手順を追記(独立役員審査+#承認 通知は起票後の手続)

