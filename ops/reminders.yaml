  - id: a18-github-pr-verification
    what: "A-18-1 の PR 実在照合を GitHub API で実装(実弾移行の前提条件)"
    conditions:
      - type: date_after
        date: "2026-09-01"
    action:
      type: issue_create
      title: "A-18-1: マージ PR の実在を GitHub API で照合する"
      labels: [impl]
      body: "現行の src/ryza/audit/a18.py は PR 件名(Merge pull request #N)の自己申告のみで承認と判定しており件名偽装でバイパス可能(独立役員審査 2026-08-03 で実証)。GitHub API で PR #N の実在・マージコミット SHA の一致・マージ実行者を照合する。定款第5条の実弾移行前提条件(ブランチ保護+トレーラ検査 CI)の実装判断と合わせて行う。**2026-08-04 追記**: PR 承継ルールの導入で偽トレーラの爆風半径が『1コミット』から『ブランチ全体』に拡大したため、本件は `approved-trailer-v2`(期限 2026-08-10)と統合して実装してよい(実装するなら早い方に寄せる)。"
    # 2026-08-04 完了: approved-trailer-v2 と統合して実装(PRVerifier)。件名の PR 番号と
    # トレーラの PR URL を `repos/<slug>/pulls/N` で実在+マージ済み照合し、A-18-1(承継起点・
    # 附則 b・トレーラ参照)と A-18-4(非 PR マージ)の双方に配線した。API 不達は fail-open で
    # 縮退し件数・理由を報告 notes に開示する(週次監査を API 障害で止めない)。私有リポジトリ
    # +認証不備で全件 404 になる誤検出を避けるため、`repos/<slug>` の到達性を先に確認する。
    # マージ実行者の照合は未実装(GitHub の設定上マージ実行者は PR 作成者と同一になりうるため
    # 統制価値が薄く、ブランチ保護 required review で担保する方が直接的)。
    status: done # 2026-08-04 実装(src/ryza/audit/a18.py の PRVerifier)

  - id: approved-trailer-v2
    what: "Approved トレーラ様式 v2(reviewed=<sha40> 等)と PR 実在照合 — PR 承継の起点検証(独立審査 2026-08-04 重大-1/重大-2 の恒久対策)"
    conditions:
      - type: date_after
        date: "2026-08-10"
    action:
      type: issue_create
      title: "Approved トレーラ様式 v2: 承継を reviewed SHA の祖先に限定し PR 実在を照合する"
      labels: [governance]
      body: "A-18-1 の PR 承継(2026-08-04 導入)は、first-parent 上の『件名がマージ形式・親2・Approved トレーラ有効』なマージが持ち込んだコミット群を承認扱いにする。独立役員審査(docs/reviews/g-a18-protect-independent-review.md「承継ルール審査記録」)は2つの構造的欠陥を PoC 付きで指摘した: **重大-1** `has_approval_trailer` は `^Approved:\\s*\\S+` を見るだけ、`_PR_MERGE_RE` は PR 番号の実在を見ないため、実在しない PR #999999 の件名+架空 URL のトレーラを持つマージが、ブランチ内 evil merge による Kill Switch 改変を violations=0 で通した。承継は偽トレーラ1件の爆風半径を『1コミット』から『ブランチ全体』へ公式化する。**重大-2** 承継は『マージ時点のブランチ全体』に及ぶため、独立審査・#承認 通知の**後**に積まれたコミットも同じトレーラで承認扱いになる(審査後 push の吸収)。実装内容: ①トレーラ様式を `Approved: <url> reviewed=<sha40> mode=deemed|principal notified=<ISO8601>` に拡張する(定款第5条 C-5 様式の改訂 = L1 手続)、②承継を `reviewed` SHA の祖先に限定する(reviewed より後に積まれたコミットは承継しない)、③`mode=deemed` は #承認 通知の実在と発効条件を機械検査する(定款 v0.4 は effective: on_notice のため 48h 経過検査ではなく**通知の実在**を照合する — 審査者の 48h 前提は v0.3 の様式で事実誤認、2026-08-04 設計リード裁定)、④様式不備のトレーラは承継の起点にしない(fail-safe)、⑤`a18-github-pr-verification`(PR 実在の API 照合)と統合してよい。移行: 既存の v1 トレーラ(reviewed 無し)は経過措置として当面 violations にしないが、承継の起点としては扱わない/扱う のいずれにするかを実装時に決めて記録すること。出典: 独立役員審査 2026-08-04 重大-1・重大-2 と反対意見書③(承継は reviewed SHA 固定を伴う場合のみ有効とし、それ以外は受容へ寄せる代替案)。"
    # 2026-08-04 実装(src/ryza/audit/a18.py・config/governance.yaml の様式コメント):
    #   ① 様式 v2 `Approved: <参照> reviewed=<sha40>` を**任意拡張**として受理(approval_trailers /
    #      reviewed_shas)。mode=/notified= は解釈せず属性として無視する — 定款 v0.4 のみなし承認は
    #      「通知と同時に発効」であり、通知の実在照合は A-18-5(未配送の検出)が既に担っているため
    #      トレーラ側に二重の様式を課さない(様式を増やすほど記入漏れで承継が落ちる副作用がある)
    #   ② 承継を reviewed の祖先に限定。reviewed 後に積んだコミットは (b)・(c) のいずれでも救済しない
    #   ③ 様式不備(40 桁 hex でない・リポジトリに存在しない reviewed)は承継の起点にしない(fail-safe)
    #   ④ **移行方針の決定**: v1(reviewed 無し)は当面 violations にせず、承継の起点としても
    #      **従来どおり扱う**。理由 = v1 を起点から外すと過去の全 PR 配下が一斉に違反化し、
    #      「毎週赤いが誰も見ない」形骸化(05-governance §6-5)を招く。代わりに承継件数を
    #      notes と embed(「様式 v1(範囲=マージ時点のブランチ全体)」)に毎週開示する
    #   ⑤ PR 実在照合を統合(a18-github-pr-verification を done に)
    status: done # 2026-08-04 実装(様式 v2 + PR 実在照合)

  - id: trailer-v1-sunset
    what: "Approved トレーラ v1(reviewed 無し)承継の打ち切り — v2 必須化(定款 C-5 改訂 = L1)。期限の無い経過措置は恒久仕様である(独立審査 2026-08-04 重大-2)"
    conditions:
      - type: date_after
        date: "2026-09-01"
    action:
      type: issue_create
      title: "Approved トレーラ v1 の承継を打ち切り、reviewed=<sha40> を必須にする"
      labels: [governance]
      body: "2026-08-04 の様式 v2 導入時、既存 PR の一斉違反化(05-governance §6-5 の形骸化)を避けるため v1(reviewed 無し)の承継を経過措置として残した。独立役員審査は『期限の無い経過措置は経過措置ではなく恒久仕様』『任意の統制は統制でない(実測採用率 0/4)』と指摘し、期限設定を統合条件とした。本リマインダーの発火時に以下を行う: ①`src/ryza/audit/a18.py` の `_v1_inheritance_notes` を注記から**警告(has_findings 寄与)**へ格上げする、②さらに実弾移行前に v1 承継そのものを廃止(reviewed 無しの PR マージは承継の起点にしない)、③定款第5条 C-5 の様式に reviewed を必須として明記する(L1 手続 = 独立役員審査 → #承認 通知)。判断材料として、発火時点の A-18 報告で v2 採用率(inherited のうち reviewed_scoped の割合)を確認すること。出典: docs/reviews/g-a18-protect-independent-review.md「トレーラ v2 審査記録」重大-2・反対意見書①。"
    status: pending

  - id: decision-reviewed-sha
    what: "承認記録(governance.decisions)に審査対象 SHA を持たせ、Approved トレーラの reviewed と突合する — reviewed の自己申告性の解消(独立審査 2026-08-04 重要-3)"
    conditions:
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "governance.decisions に審査対象 SHA を追加し A-18 の reviewed と突合する"
      labels: [impl]
      body: "様式 v2 の `reviewed=<sha40>` はトレーラの書き手の申告であり、『独立審査が実際にその SHA を見た』ことを A-18 は独立に確認できない。現在の機械検査は『reviewed が当該マージの第2親の祖先であること』までで、`reviewed=<マージ直前のブランチ head>` と書けば被覆は v1 と同じになる(独立役員審査 PoC 再現済み)。恒久対策は照合先を作ること: ①`governance.decisions`(または新テーブル)に審査対象コミット SHA 列を追加するマイグレーション(保護領域 — schema)、②独立審査エージェント/承認フロー(`src/ryza/governance/notices.py`・`src/ryza/bot/approvals.py`)が審査対象 SHA を記録する、③A-18-1 が `reviewed` と承認記録の SHA を突合し、不一致は承継の起点にしない(fail-safe)。②の記録主体が人間の手作業のままなら申告性は解消されないため、審査エージェントの出力から機械的に埋まる経路にすること。出典: docs/reviews/g-a18-protect-independent-review.md「トレーラ v2 審査記録」重要-3。**追記(2026-08-04・後続配線審査 後-2)**: 同じ穴が CLI 側にもある。`python -m ryza.governance.decisions --deemed-for-pr`/`--kind pr` は `--review <独立役員審査の参照>` を必須にしたが、**値の実在は検査せず**(`--review 嘘` が通る)、通知本文の文字列として残るだけで `governance.decisions` の構造化列にはならない。したがって「審査を経たと書かせる」抑止であって「審査を経たことの証明」ではなく、事後の機械照合もできない。本タスクで審査対象 SHA 列を足すときに、**`--review` の値も同じ構造化列(審査参照 + 対象 SHA)に載せ、実在検査(docs/reviews のファイル実在・審査エージェントの出力との突合)を掛ける**こと。列が入るまでの間、A-18 は審査の有無を検査できない。(完了 2026-08-04 — ①migrations/0029 が `governance.decisions` に `reviewed_sha`(40桁hex小文字の CHECK・NULL 可)と `review_ref`(空白のみ禁止)を追加し、`governance.current_decisions` view にも通した。**既存行は NULL のままで後から埋められない**(0021 の追記オンリートリガが UPDATE を拒否する)ため、過去の決定を遡って審査済みに見せる経路は開かない。②`record_deemed_approval` / `announce_deemed_approval` が両列を受け取り、CLI は `--deemed-for-pr` で **PR の head SHA を gh から取得して自動格納**(手入力させないことで発効時刻に固定する)・`--review` を `review_ref` に構造化・`--reviewed-sha` の手動指定も可。審査参照はリポジトリ内パス形式なら実在を検査するが**警告のみで拒否しない**(遡及登録とリポジトリ外の審査を塞がないため)。③監査に **A-18-8**(src/ryza/audit/a18.check_reviewed_sha_agreement)を新設 — トレーラ行単位で `reviewed=<sha40>` と参照先決定の `reviewed_sha` が**両方ある**ものを突合し、不一致を所見にする(分母 = 突合できた件数を緑にも必ず出す。記録側 NULL の件数は notes で開示)。**元の③との差異**: リマインダーは『不一致は承継の起点にしない(fail-safe)』としていたが、実装は**所見にとどめ承継判定は変えていない**(設計リード指示)。理由は爆風半径 —— 承継を落とすと1件の記入ミスが PR 全体のコミットを一斉に無承認変更へ変え、A-18-1 の信号が埋もれる。fail-safe へ強めるかは移行後の実測(不一致の発生源が記入ミスか改変か)を見て再判断すること。**残る限界**: `reviewed_sha` も `reviewed=` も発効を起票した側が書く申告であり、**審査エージェント自身の署名は無い** —— 同じ値を両方に書けば一致する。捕まえられるのは片側だけの改変・取り違え(別 PR の SHA の複写、マージ後のトレーラ書き換え)に限られる。②の『審査エージェントの出力から機械的に埋まる経路』は未達で、後続の `reviewed-sha-from-review-agent` として残す)"
    status: done # 2026-08-04 0029 + writer/CLI + A-18-8 まで。審査エージェント出力からの自動記入は未了(後続リマインダー)

  - id: reviewed-sha-from-review-agent
    what: "審査対象 SHA を**審査エージェントの出力から**機械的に埋める(decision-reviewed-sha の残り — 申告性の本丸)"
    conditions:
      - type: date_after
        date: "2026-09-01"
    action:
      type: issue_create
      title: "reviewed_sha を独立審査エージェントの出力から記録する(起票者の申告をやめる)"
      labels: [impl]
      body: "decision-reviewed-sha は照合先(migrations/0029 の `governance.decisions.reviewed_sha` / `review_ref`)と突合(A-18-8)まで実装したが、**値の書き手は依然として発効を起票した設計リードである**。`--deemed-for-pr` が gh から head SHA を取るのは手入力の排除であって、審査主体の証言ではない —— 起票者がトレーラと記録の両方に同じ嘘を書けば A-18-8 は一致で通る。したがって現状の統制は『片側だけの改変・取り違えの検出』であり、『独立審査が実際にその SHA を見たことの証明』ではない。実装内容: ①独立審査エージェント(プロンプト分離で走る審査ジョブ)が意見書を出すときに、審査対象コミット SHA を機械可読な形(docs/reviews の front matter か専用テーブル)で出力する、②`--deemed-for-pr` / `announce_deemed_approval` はその出力を読んで `reviewed_sha` / `review_ref` を埋め、**起票者が渡した値と食い違えば発効を止める**(ここは fail-safe にできる — 起票者の申告ではなく審査側の記録が正になるため)、③A-18-8 を『審査記録に由来する reviewed_sha の割合』の開示に拡張する。判断材料: 発火時点の A-18 報告で `compared_reviewed_shas` と `trailer_only_reviewed` の推移(突合が実際に働いている件数)を確認すること。前提: 審査エージェントの実行が現状ワークツリー内の手動起動であるため、②の自動化には審査ジョブの成果物置き場の確定が要る。出典: docs/reviews/g-a18-protect-independent-review.md 重要-3、ops/reminders.yaml decision-reviewed-sha の完了注記。(完了 2026-08-04 — 期限 2026-09-01 を前倒し。①意見書の新様式(先頭の YAML front matter: `reviewed_sha`(40桁hex)・`review_date`・`verdict`)を確定し、パーサ `src/ryza/reviews.py` を新設。仕様は docs/design/07-development.md §3-1 に追記。**既存の意見書は遡及改変せず**、front matter 無し = 旧様式として従来動作に落とす(過去の審査に後から front matter を足せると『審査側の記録』が起票者の申告と区別できなくなるため)。②`decisions` CLI(`--deemed` / `--deemed-for-pr`)は `--review` がリポジトリ内の新様式意見書を指す場合に `reviewed_sha` を**審査側の記録から採用**し、起票者の `--reviewed-sha` と食い違えば `ReviewedShaConflictError` で**発効を中止**(fail-safe・exit 1)。**PR の head SHA との相違は中止しない**(注記のみ)—— 意見書のコミット自身が head を進めるため審査対象 SHA と head は通常一致せず、ここを致命にすると front matter を書いた PR が軒並み発効不能になる。front matter の様式不備(閉じフェンス欠落・YAML 破損・短縮 SHA)は『旧様式』に読み替えず中止する(壊すことが回避策にならないように)。由来ラベル(`review_artifact` / `argument` / `pr_head`)を meta.runs の params に記録。③A-18-8 に `from_review_artifact`(突合済みのうち、決定の `review_ref` が指す意見書の front matter が同じ SHA を宣言している件数)を追加し、embed の A-18-8 行に『うち審査記録由来 N 件』として分母と同じ行に出す+注記で『残りは起票者が両側に書いた申告どうしの一致であり証明ではない』を開示。**残る限界**: 意見書はリポジトリ内の平文で審査エージェントの署名は無く、起票者が front matter を書き換える・消す・front matter の無いファイルを `--review` に指す経路は残る。したがって本実装が足すのは『食い違えば止まる』ことと『由来の割合が毎週見える』ことであり、署名(審査エージェントの鍵)は将来課題。②の前提だった『審査ジョブの成果物置き場の確定』は docs/reviews + front matter という形で確定した)"
    status: done # 2026-08-04 ①②③ 実装。署名(審査主体の暗号的証明)は未達 — 残る限界を body に記載

