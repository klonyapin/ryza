  - id: dashboard-deploy-hardening-followup
    what: "ダッシュボード・デプロイ統制の次回 PR 対応3件(再審査の非阻止指摘)"
    conditions:
      - type: date_after
        date: "2026-08-10"
    action:
      type: issue_create
      title: "デプロイ統制の強化3件(ロール検証のゲート化・pg_hba 検査の CIDR 列限定・リグレッションテスト)"
      labels: [impl]
      body: "(完了済み)独立役員 再審査 2026-08-03(docs/reviews/dashboard-deploy-independent-review.md 再審査記録「次回 PR 対応」)の3件。(1) ロール検証クエリのゲート化 → ops/deploy-dashboard.sh のロール定義 SQL 末尾に DO $ryza_gate$ ブロックを追加し、7項目(ロール存在・ロール属性・読取専用ロールの非 SELECT 権限・秘密テーブル権限・役員室の ops 権限表数・想定外 ops テーブル・履歴表の追記オンリー)が想定外なら RAISE EXCEPTION で中断。(2) pg_hba 検査の CIDR 列限定 → ops/lib/pg_hba_check.sh に切り出し、コメント除去のうえ host 系行のアドレス列(+netmask 列)だけで判定。include 指令は検査不能として中断。(3) リグレッションテスト → tests/ops/test_deploy_guards.py(42件・git ゲート/公開バインディング検査/pg_hba 検査。gcloud は PATH スタブ、git は一時ローカルリポジトリ)と tests/ops/test_deploy_role_gate.py(13件・生成 SQL の DO ブロックを実 PostgreSQL 上の一時ロールに対して実行)。さらに独立役員 第3回審査(変異試験でゲート無効化が検出されないことを指摘)の条件付き承認を受け、同 PR 内で C-1〜C-7 を是正: ロールゲートの psql 配線(ON_ERROR_STOP・握り潰し禁止・リモート errexit)をテストで固定、pg_hba 検査を終了コード3分岐+関数ロード確認に、ロールゲートに information_schema.column_privileges を併用(列レベル GRANT の検出)、0020 未適用 DB を正常と誤認しないよう対象表の実在を要求、origin 許可リストを env 上書き不可のハードコードに、samehost をループバック扱いから除外、追記判定を検査と同一の正規化に。統制を無効化する変異13件が全てテストで FAIL することを確認済み。以上をもって dashboard-cloudbuild-trigger の前提条件は充足。"
