    action:
      type: issue_create
      title: "record_deemed_approval を #承認 通知経路へ配線する"
      labels: [impl]
      body: "src/ryza/governance/decisions.record_deemed_approval は実装済みだが、まだ呼び出す経路が無く、みなし承認の実運用は手動記録のままである(governance-deemed-writer の①⑤が未了)。定款 v0.4 第3条は『通知と同時に発効』を定め、通知を欠いた発効は A-18 の無承認変更にあたるため、通知の投入(press.outbox / src/ryza/bot/approvals.py 経路)と deemed 行の INSERT は**同一トランザクション**に置く必要がある(片方だけ成功する状態を作らない)。実装内容: ①保護領域変更の PR が起票されたときに #承認 へ PR リンク付き通知を投げ、同一トランザクションで record_deemed_approval(proposal_ref=PR URL, notice_ref=通知メッセージ ID) を呼ぶ、②A-18-1 の `Approved:` トレーラ突合が deemed 行を承認記録として受理することを確認する(現状 A-18 はトレーラの存在検査までで decisions の実在照会をしていない)。**実在照合を実装するときは governance.decisions ではなく governance.current_decisions を読み、effective_decision='vetoed' の行を承認記録として受理しないこと**(独立役員審査 0021 C-5)— decisions を直読すると、代表が否認した承認を A-18 が承認として受理し、否認された変更が無承認変更として検出されない、③#承認 の否認ボタン → decisions.record_veto / record_veto_withdrawal の配線(オーナー検証・expected_proposal_ref 照合を通す)。(完了 2026-08-04 — **ただし①のうち「PR 起票を検知して自動で通知する」部分は未実装**。実装したのは手動起動の機械化であり、人が CLI を叩かなければ通知は出ない。自動起票は deemed-auto-announce に分割した。以下は実装済みの範囲: ①announce_deemed_approval(src/ryza/governance/notices.py・新設)が press.outbox への #承認 embed 投入と deemed 行の INSERT を SAVEPOINT で束ね、片方の失敗で両方が消える(autocommit 接続は AtomicityError で拒否)。notice_ref は outbox:<press.outbox.id>(Discord メッセージ ID は配送後にしか確定しないため。notice_message_id で実メッセージへ解決)。起動口は CLI python -m ryza.governance.decisions --deemed のみ(呼び出し元ジョブは無い)。②a18.verify_decision_refs が Approved トレーラの参照を governance.current_decisions と突合し、vetoed / reject / 不在を受理しない。decision:<id> は ID 一致、それ以外は proposal_ref 一致(本リポジトリの承認記録は全件 PR URL のため後者が主経路 — 独立役員審査 重大-1)。裸の数字は Issue 番号と区別できないため照合せず notes に開示(重要-2)。PR マージ経由でも否認済みトレーラは救済しない。加えて A-18-5(通知が 60 分超未配送 = 通知なき発効)を追加(重要-3)。③#承認 のみなし承認 embed に否認ボタン(押下 → 理由入力モーダル → apply_veto。配送時に対応する deemed 決定の実在を照合してからボタンを付ける — 重要-4)、/veto(Bot 再起動でボタン View が失われるため)、誤操作の復旧は /unveto → withdraw_veto。否認は run_id を記録し出所を追える(重要-5 後段)。意見書: docs/reviews/deemed-wiring-independent-review.md)"
    status: done # 2026-08-04 手動起動の機械化まで完了(自動起票は deemed-auto-announce へ分割)

