      title: "ledger 締め: 直近 N 営業日の再締め + nav_snapshots の producer リネージ"
      labels: [impl, ledger]
      body: "(完了済み)navflow のロールフォワード(2026-08-03)は『締めが走らなかった日』の外部フローを次のスナップショットへ寄せるが、**締めが走った後で同じ日付に立った仕訳**は救えず、±X% の対のリターンを生んでいた。是正実装(初版は固定窓 N=3 で独立審査が差し戻し — 窓外に落ちた仕訳が窓境界に恒久的な +50% を作るため。最終版は水位検出): (1) `ledger.closing.reclose_stale` が各スナップショットの水位(`detail.producer.input_refs`)より後ろの `entry_id` を持つ遅延仕訳がある日を 1 クエリで列挙し、その日だけ再計算する。窓の縁が構造的に存在しない。上書き条件は『NAV 変化 OR 水位変化』(NAV 中立の遅延約定でも水位を進めて再検出を止める)。`run_daily_close` は再実行しない(`post_mark_to_market` が現在保有を使うため過去日に存在しなかった建玉を記帳してしまう)。(2) リネージは `ledger.nav_snapshots.detail.producer` へ埋め込み — detail が jsonb のため **migration 不要**。2 回目以降の訂正は `producer_history` / `reclose` 配列に追記して痕跡を連鎖させる。(3) 訂正した日は `positions` を落として `positions_stale` / `restated` を立てる(status は締め時点の照合の結論なので据え置き)。(4) 5 営業日より古い日の書き換えは #運営 へ専用 embed で urgent 通知。出典: docs/reviews/risk-navflow-rollforward-independent-review.md 重要-2 および再締め審査記録。"
    status: done # 2026-08-04 実装: ledger.closing.reclose_stale(水位検出)+ detail.producer(migration 不要)

