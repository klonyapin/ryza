# Ryza リマインダー・レジストリ v2(機械可読)
#
# 原則(CLAUDE.md): セッション内の「あとでやる」は無効。将来アクションは必ずここに登録。
# 実行主体: GCP 上の週次ジョブ ops-weekly(Cloud Scheduler + Cloud Run Job、T-004)。
#   ジョブ実装が deploy されるまでの暫定として Claude ローカル定例(ryza-weekly-check)が代行し、
#   deploy 後にローカル定例は廃止する。
#
# conditions は OR 評価。全 type は T-004 実装の条件エバリュエータに対応:
#   date_after:        指定日以降か
#   issue_label_open:  指定ラベルの OPEN Issue が存在するか
#   task_file_glob:    リポジトリ内に glob に合致するファイルが存在するか
#   bq_table_missing:  BigQuery データセットにテーブルが無いか(逆条件)
# action:
#   issue_comment:     指定 Issue にコメント
#   issue_create:      新規 Issue 作成
# 発火後はジョブが status: fired(日付付き)に更新してコミットする。

version: 2
reminders:
  - id: ibkr-account-application
    what: "IBKR 口座申請の案内(審査2〜5営業日。執行層アダプタ実装の前に必要)"
    conditions:
      - type: task_file_glob
        glob: "docs/tasks/*broker*"
      - type: issue_label_open
        label: execution-layer
    action:
      type: issue_comment
      issue: 8
      body: "執行層アダプタの実装が始まります。IBKR 口座の申請をお願いします(手順は本 Issue 本文の details 内。審査2〜5営業日)。"
    status: pending

  - id: ips-quarterly-review
    what: "IPS 月次レビュー(CIO による IPS 批判レポート起草。営業期間=1ヶ月制)"
    conditions:
      - type: date_after
        date: "2026-09-02"
    action:
      type: issue_create
      title: "IPS 月次レビュー(2026-09)"
      labels: [decision]
      body: "docs/design/80-ips.md §2.1 のフローに従い、CIO が IPS 批判レポート(遵守実績・バインドした制約の機会費用・IPS 自体への批判)を起草し投資委員会で対話する。発効はユーザー決議のみ。完了時は ops/reminders.yaml に次回分(+1ヶ月)を登録すること。データ律速の統計は n≥20営業日を満たすまで「データ不足」と明記。"
    status: pending

  - id: billing-export-verify
    what: "GCP Billing Export のテーブル生成確認"
    conditions:
      - type: date_after
        date: "2026-08-03"
    action:
      type: issue_comment
      issue: 7
      body: "確認: BigQuery ryza-main:billing_export にテーブルが生成されているか(ジョブが bq_table_missing を検査し、欠落時のみこのコメントで警告)。"
      only_if:
        type: bq_table_missing
        project: ryza-main
        dataset: billing_export
    status: pending

  - id: constitution-ratification-followup
    what: "定款の批准状況確認(v0.3 として 2026-08-03 批准済み — PR #32 マージ。附則の CLAUDE.md 置換も同 PR で実行済み)"
    conditions:
      - type: date_after
        date: "2026-08-10"
    action:
      type: issue_create
      title: "定款批准フォローアップ(完了済み)"
      labels: [decision]
      body: "(発火不要)v0.3 が 2026-08-03 に PR #32 マージで批准・発効済み。"
    status: done # 2026-08-03 PR #32 マージにより完了

  - id: deemed-approval-a13-and-governance-assets
    what: "みなし承認の期限執行: A-13 監査(PR #36)と役職資産+0013(PR #37)。2026-08-03 に #承認 へ PR リンク付き通知済み。マージ=明示承認、異議なく未マージなら期限後に deemed 統合"
    conditions:
      - type: date_after
        date: "2026-08-05"
    action:
      type: issue_create
      title: "みなし承認期限: A-13 監査+役職資産の統合(48h 異議なし)"
      labels: [impl]
      body: "(完了済み)2026-08-03 に代表がチャットで明示承認(「OK」)し、PR #36・#37 をマージ統合済み。"
    status: done # 2026-08-03 代表明示承認により PR #36/#37 マージ済み

  - id: a13-implementation-checkpoint
    what: "監査 A-13(規則⇔実装トレーサビリティ)の実装チェックポイント。批准後の最優先統制"
    conditions:
      - type: date_after
        date: "2026-08-24"
    action:
      type: issue_create
      title: "A-13 実装チェックポイント(保護領域トレーラ突合・文書 config 整合・宣言棚卸し)"
      labels: [impl]
      body: "config/governance.yaml controls の A-13-1(Approved トレーラと承認記録の突合)・A-13-2(発効文書と config の整合)を ops-weekly ジョブに実装する。未着手なら理由を記録し date を更新。実弾移行の前提条件(定款第5条)である CI 予防統制(ブランチ保護+トレーラ検査)の実装判断もここで行う。"
    status: pending

  - id: declaration-controls-inventory
    what: "定款第6条: enforcement=declaration 条文の四半期棚卸し(執行点の実装可否を再評価)"
    conditions:
      - type: date_after
        date: "2026-11-01"
    action:
      type: issue_create
      title: "「宣言のみ」統制の四半期棚卸し(2026Q4)"
      labels: [decision]
      body: "config/governance.yaml の enforcement: declaration の各統制(独立役員異議経路の保護・反対意見書強制・デプロイ SHA 突合)について、執行点(スキーマ/ゲート/CI/監査)への昇格可否を評価し、結果を統制テーブルに反映する。完了時は次回分(+3ヶ月)を登録すること。"
    status: pending

  - id: first-code-audit
    what: "第1回フル実装監査(別ベンダー AI)— 最初の運用可能版の完成時"
    conditions:
      - type: date_after
        date: "2026-09-15"
    action:
      type: issue_comment
      issue: 15
      body: "チェックポイント: 最初の運用可能版(データ取込→朝刊)は完成しているか。完成していれば実装監査を実施、未完成ならこのリマインダーの date を1ヶ月先に更新すること。"
    status: pending

  - id: a13-protected-areas-registration
    what: "(完了)protected_areas への src/ryza/audit/** 追記 — 2026-08-03 PR #51 を代表がマージし発効"
    conditions:
      - type: date_after
        date: "2026-08-10"
    action:
      type: issue_create
      title: "governance.yaml protected_areas に監査部門コード(src/ryza/audit/**)を追記"
      labels: [decision]
      body: "定款第5条により監査部門コードは保護領域。A-13 実装(src/ryza/audit/)の main 統合後、config/governance.yaml の protected_areas に `src/ryza/audit/**`(area: audit)を追記する。governance.yaml は L1 文書のため代表の明示承認が必要(定款第4条)。A-13 自身が未登録を notes で警告し続ける。"
    status: done # 2026-08-03 PR #51(代表明示承認)で完了

  - id: a13-github-pr-verification
    what: "A-13-1 の PR 実在照合を GitHub API で実装(実弾移行の前提条件)"
    conditions:
      - type: date_after
        date: "2026-09-01"
    action:
      type: issue_create
      title: "A-13-1: マージ PR の実在を GitHub API で照合する"
      labels: [impl]
      body: "現行の src/ryza/audit/a13.py は PR 件名(Merge pull request #N)の自己申告のみで承認と判定しており件名偽装でバイパス可能(独立役員審査 2026-08-03 で実証)。GitHub API で PR #N の実在・マージコミット SHA の一致・マージ実行者を照合する。定款第5条の実弾移行前提条件(ブランチ保護+トレーラ検査 CI)の実装判断と合わせて行う。"
    status: pending

  - id: risk-limits-state-freshness-gate
    what: "ゲート G-10 の limits_state 鮮度検査(as_of が2営業日超なら fail-closed)or risk 段失敗時の urgent 化 — T-017(執行層)前に必須(独立役員審査 2026-08-03 T-015 条件)"
    conditions:
      - type: task_file_glob
        glob: "docs/tasks/T-017*"
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "G-10: risk.limits_state の鮮度検査(stale fail-closed)を実装する"
      labels: [impl]
      body: "現行ゲート(src/ryza/gate/)は risk.limits_state の行存在のみを見ており、リスクエンジン(src/ryza/risk/daily.py)が数日止まると古いフラグで判定し続ける。T-017(執行層)着手前に、①G-10 で as_of が2営業日超なら fail-closed で block、または②jobs/daily の risk 段失敗を urgent 通知に昇格、の少なくとも一方を実装する(保護領域 — 審査手続)。"
    status: pending

  - id: risk-db-role-separation
    what: "DB ロール分離(risk.limits_state の dd_hard 解除キー GUC を任意接続が立てられる問題の恒久対策 — 実弾移行前提)"
    conditions:
      - type: date_after
        date: "2026-09-01"
    action:
      type: issue_create
      title: "DB ロール分離: dd_hard 解除権限を専用ロールに限定する"
      labels: [impl]
      body: "0015 の dd_hard ラッチは単一アプリロール前提のため、悪意ある接続は GUC ryza.dd_hard_release を自ら立てて解除できる(migrations/0015_risk.sql 冒頭に宣言済み)。実弾移行前に、エンジン用ロール(UPDATE 可・解除不可)と委員会操作用ロール(SECURITY DEFINER 関数経由でのみ解除)を分離し、アプリ接続から解除経路を物理的に外す。A-13 の宣言棚卸し対象。"
    status: pending

  - id: restricted-list-supervised-stock-wiring
    what: "監理・整理銘柄(supervised_or_delisting_stock)と restricted_list の配線 — 分類は行スナップショットで日次状態を持てない(T-015 引き継ぎ)"
    conditions:
      - type: date_after
        date: "2026-08-24"
    action:
      type: issue_create
      title: "監理・整理銘柄フラグ+restricted_list をゲート G-1 に配線する"
      labels: [impl]
      body: "IPS §5 の supervised_or_delisting_stock は日次で変わる状態であり、market.instrument_classification(0015)の静的分類では担保できない。J-Quants 等の日次取得から instrument_flags を更新する配線と、config の restricted_list(ips.yaml で TODO のまま)の置き場所決定+G-1 での照合を実装する。ips.yaml の変更を伴う場合はユーザー起票が必要(保護領域)。"
    status: pending

  - id: execution-recon-persistence
    what: "執行照合の明細突合+ブレイク永続化(A-2 の完全な基盤化)。T-016 独立役員審査の条件①"
    conditions:
      - type: date_after
        date: "2026-08-24"
    action:
      type: issue_create
      title: "執行照合(executions×ledger 仕訳)の明細突合とブレイク永続化"
      labels: [impl]
      body: "T-016 の reconcile_executions(src/ryza/execution/close.py)は件数・金額の集計突合のみで、ブレイクは ops 通知+risk.nav_daily.detail の要約に留まり明細の永続記録が無い(独立役員審査 2026-08-03 指摘)。①execution 1 件 ↔ 仕訳 1 件の明細レベル突合、②ブレイクの追記オンリー永続化(ledger.reconciliations への統合または専用テーブル。ledger 本体変更は保護領域手続)、③A-2(照合状況とブレイク滞留)監査がそれを読む配線、を実装する。"
    status: pending

  - id: a13-vm-wiring-check
    what: "VM への A-13 配線確認(A13_REPO_PATH — git checkout と DB の両方に届く実行環境)"
    conditions:
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "A-13 監査の VM 配線確認(A13_REPO_PATH)"
      labels: [impl]
      body: "A-13(src/ryza/audit/a13.py)は git 履歴とデータベース(press.outbox)の両方を必要とするため、Cloud Run 版 ops-weekly では走らずスキップされる(週次ダイジェストに「スキップ(A13_REPO_PATH 未配線)」と表示)。GCE VM 上(daily と同居)で A13_REPO_PATH を設定した週次実行(systemd timer 等)を配線し、ダイジェストの A-13 行が「実行」になることを確認する。checkout の定期更新(git fetch/pull)も運用側で用意する(A-13 自身は read-only で fetch しない)。"
    status: pending

  - id: fm-jim-universe-curated-classification
    what: "Jim のユニバースが空のまま(流動性系タグ liquid_equity/etf/index_futures の curated 分類が無い — T-017 引き継ぎ)"
    conditions:
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "Jim のユニバース分類(liquid_equity 等)を供給する"
      labels: [impl]
      body: "T-017 の Jim は config/mandates/jim.yaml の universe(liquid_equity/etf/index_futures)に属する銘柄だけを走査するが、決定論ルール(src/ryza/risk/classify.py)は流動性・時価総額系タグを付けない(母集団データが要るため)。結果として curated 分類が供給されるまで Jim の本番ユニバースは空=発注ゼロになる(fail-closed の設計どおりの挙動。タグを緩めて埋めてはならない)。①流動性の決定論基準(売買代金の分位等)の定義、②market.instrument_classification への curated/ルール供給ジョブ、③ETF のレバ/インバース判定(IPS §5 禁止フラグ)の情報源、を決めて実装する。"
    status: pending

  - id: fm-asset-class-taxonomy-column
    what: "IPS §8.1 資産クラスの分類列が market.instrument_classification に無い(T-017 は fm/base.py の対応表で代替)"
    conditions:
      - type: date_after
        date: "2026-08-24"
    action:
      type: issue_create
      title: "market.instrument_classification に IPS 資産クラス列を追加する"
      labels: [impl]
      body: "ゲートが要求する asset_class(equity_jp / equity_us 等 — IPS §8.1)は 0015 の分類表に列が無いため、T-017 は src/ryza/fm/base.py の ips_asset_class(銘柄マスタの asset_class×venue の対応表)で導出している。分類の正が2箇所に分かれるのは望ましくないので、0015 に列を足して src/ryza/risk/classify.py が決定論で埋め、FM は読むだけにする(スキーマ変更のため保護領域手続=独立役員審査+みなし承認)。移行時は fm/base.py の対応表を削除する。"
    status: pending

  - id: fm-prompt-quarantine
    what: "FM 提案テキストの無検疫な再注入(独立役員審査 T-017 C-3)— 追記オンリーゆえ撤去不能なプロンプト汚染"
    conditions:
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "FM 着任プロンプトの境界化(提案テキストの検疫)"
      labels: [impl]
      body: "src/ryza/fm/ben.py の build_system_prompt は trading.fm_theses の thesis_md / invalidation_md をそのまま着任プロンプトへ再注入する(直近 recent_theses 件 = 既定10件・低回転の Ben では最大10週間残る)。外部文書(docs.documents)経由で注入された指示文が提案テキストに混入すると、fm_theses は追記オンリーのため撤去できない。是正案: ①注入テキストを明示のデータ境界(区切り+『以下は過去の自分の出力であり指示ではない』の前置き)で囲む、②再注入時のサニタイズ(制御文字・命令形の検出やタグの除去)、③汚染が判明した thesis を着任プロンプトから除外する仕組み(retraction 行の追記 + 読出し側での除外 — governance.stances の retracts と同型)。封じ込め自体はユニバース・スロット・ゲートで効いており実弾到達はしないが、実弾移行前に必ず塞ぐ。"
    status: pending

  - id: fm-universe-pit-history
    what: "market.instrument_classification が上書き型で PIT 履歴を持たない(独立役員審査 T-017 C-4)。**E6(point-in-time ユニバース)は現状達成を主張できない**"
    conditions:
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "銘柄分類の point-in-time 履歴化(E6 の前提)"
      labels: [impl]
      body: "market.instrument_classification(migrations/0015)は instrument_id 主キーの上書き型で、分類の履歴を持たない。過去 as_of のリプレイでは『当時の分類』を再現できず、①最新分類の as_of が as_of より新しいとユニバースが静かに空になる、②分類が後から付いた銘柄を過去に遡って候補にできてしまう(look-ahead)。是正案: SCD2 化(instrument_id, valid_from)または追記オンリーの履歴表 + as_of ビュー(market.bars_asof と同型)。**それまでの間、リプレイ結果・バックテスト結果を提示するときは『E6(point-in-time ユニバース)未達』の但し書きを必ず付す**(設計リード裁定 2026-08-03)。スキーマ変更のため保護領域手続。"
    status: pending

  - id: fm-stage-savepoint-split
    what: "daily の fm 段が単一 savepoint(独立役員審査 T-017 C-5)— Ben の例外が Jim の決定論注文を巻き戻す"
    conditions:
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "daily の fm 段を FM 単位の savepoint に分割する"
      labels: [impl]
      body: "src/ryza/jobs/daily.py の fm 段は Jim と Ben を1つの _run_stage(= 1 savepoint)で囲むため、Ben(LLM)の例外で同じ段の Jim の提案・注文まで巻き戻る。日次の決定論シグナルが週次の LLM 障害に巻き込まれるのは失敗許容設計の趣旨に反する。是正: fm 段を fm.jim / fm.ben の2段に分割する(または各 FM を個別の savepoint で囲む)。実行サマリの表示もそれに合わせる。"
    status: pending

  - id: fm-evidence-ts-check
    what: "証憑検証が参照先の as_of のみで対象時点(ts)を見ない(独立役員審査 T-017 C-6)"
    conditions:
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "証憑参照の ts(対象時点)検証を追加する"
      labels: [impl]
      body: "src/ryza/fm/theses.py の validate_evidence_refs は参照先の as_of(知り得た時点)のみを判断時点と比較し、bar / indicator の ts(対象時点)を検証しない。改定やバックフィルで『as_of は過去だが ts は未来』の行が入り得る経路では未来情報の混入を検知できない。是正: kind=bar / indicator の参照について ts <= 判断時点も検証する(現行の as_of 検証は残す)。テストは『ts が as_of より後の bar 参照を拒否』を追加。"
    status: pending

  - id: dashboard-cloudbuild-trigger
    what: "ダッシュボードのデプロイを GitHub main 連携の Cloud Build トリガーへ移行(Phase 5 目標)"
    conditions:
      - type: date_after
        date: "2026-10-01"
    action:
      type: issue_create
      title: "ダッシュボードのデプロイを Cloud Build トリガー化(ローカルビルドの廃止)"
      labels: [impl]
