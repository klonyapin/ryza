  - id: risk-flow-rollforward-fix
    what: "【優先度高・リスク数値の実バグ】NAV スナップショットが無い日の外部フローがリターン計算から落ちる問題の修正(独立役員審査 T-018 重要-5)"
    conditions:
      - type: date_after
        date: "2026-08-08"
    action:
      type: issue_create
      title: "risk エンジン: スナップショット欠落日の外部フローを次のスナップショットへロールフォワードする"
      labels: [impl, risk]
      body: "ryza.risk.engine.book_returns は `r_t = (nav_t − flow_t − nav_{t−1}) / nav_{t−1}` を隣接**スナップショット**間で計算するが、フローは「そのスナップショット日に計上された仕訳」だけを見る(src/ryza/risk/daily.py load_nav_series の flows 辞書は entry_date で引く)。締めが走らなかった日・非営業日に出資や払戻の仕訳が立つと、その日の flow はどのスナップショットにも紐付かず**リターンから脱落**する。結果、¥100万の帳簿に休日出資 ¥50万が入ると次の測定で『前日比 +50%』という実在しない利益が計上され、実現ボラ・ES の入力(帳簿リターン列)まで汚染される。是正: 前スナップショット日(排他)から当スナップショット日(包含)までの区間の flow を合算して flow_t とする(ロールフォワード)。同じ定義の重複実装になっている dashboard/queries.py fetch_nav_series も同時に合わせること(現状は engine と同一式であることが唯一の担保)。テストは『スナップショットの無い日に出資 → 次営業日のリターンが 0%』を最小ケースとする。**src/ryza/risk/ は保護領域(定款第5条)のため独立役員審査+みなし承認の手続を経ること。** 出典: docs/reviews/t018-dashboard-viz-independent-review.md 重要-5。"
    status: pending

