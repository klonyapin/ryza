      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "deemed 配線の残課題: A-18 の照合接続と原子性テストの補強"
      labels: [impl]
      body: "docs/reviews/deemed-wiring-independent-review.md の軽微指摘。①軽微-11: a18.run_and_report は検査の全体(git 走査を含む)を1つの接続・1トランザクションで囲むため、承認記録の照合が長時間の idle-in-transaction を作る。照合専用の autocommit 接続に分けるか、照合だけ先に済ませて接続を閉じる。②軽微-12: 原子性テストが「記録の失敗で通知が消える」方向のみで、逆方向(通知の投入が失敗したとき記録も残らない)はフォールト注入で検証していない。あわせて decisions.main の IDLE 分岐(CLI が新規接続で announce する経路)と bot/main.py の配送分岐(VetoView 付与)がテストで未カバー。(完了 2026-08-04 — ①a18.run_a18_readonly を新設し、照合は autocommit かつ default_transaction_read_only=on の別接続で完結させて**閉じてから**報告用の書込接続を開くようにした。git 走査中に開いたままのトランザクションが無くなり、read-only 設定は監査の read-only 原則の執行点にもなる(書込が紛れ込めば静かに通らず失敗する)。②逆方向のフォールト注入を2種追加: enqueue が outbox 行を書いた直後に落ちる(Python 例外)/run_id=None で NOT NULL 違反(DB 側の abort)— どちらも記録・通知の双方が消え、呼び出し側のトランザクションは生き残ることを検証。CLI の IDLE 分岐は『IDLE 接続で announce しても transaction() が COMMIT に化けない』テストと、commit を無効化した接続で main() を通す end-to-end テストで被覆した。**bot/main.py の配送分岐(VetoView 付与)は未被覆のまま** — 根拠は『フェイク構築コスト』ではなく**冗長経路の存在**である(後続配線審査の指摘: コスト論を根拠にすると安全弁が1本しかない箇所も同じ論法で落とせる)。ボタンが付かなくても代表の否認権は /veto コマンドで行使でき(Bot 再起動で View が失われる場合に備えた経路であり常設)、この分岐の欠落は否認権の喪失を意味しない。判定ロジック自体は notices.resolve_deemed_view に切り出され被覆済みで、未被覆なのは discord への受け渡しに限られる)"
    status: done # 2026-08-04 軽微-11・12 を実装(bot/main.py の配送分岐のみ未被覆・理由は body)

  - id: governance-deemed-ratio-audit
