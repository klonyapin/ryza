      body: "migrations/0023 の追記オンリー(解除行なし)は『解除』経路のみを塞ぐもので、DB の INSERT 権限を持つ攻撃者は防げない — 新しい汚染 thesis を INSERT することも、全 thesis_id を検疫表へ INSERT して判断履歴と建玉根拠を恒久的にプロンプトから消すこともできる。現状 fm 系ジョブと運用者の権限は分かれていない。是正: FM ジョブ専用ロール(fm_theses への INSERT のみ・検疫表は権限なし)と運用者ロール(検疫表への INSERT)を分け、Cloud Run のジョブ接続を前者に切り替える。risk-db-role-separation・db-role-separation-webhook-url と同じ実弾移行前提の統制であり、まとめて設計するのが妥当。それまでの検知策は日次サマリの検疫件数と mass-quarantine 警告(src/ryza/jobs/daily.py)。"
