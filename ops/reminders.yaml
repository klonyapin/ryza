  - id: governance-deemed-notice-wiring
    what: "みなし承認 writer を #承認 通知経路へ配線(通知と記録を同一トランザクションに置く)"
    conditions:
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "record_deemed_approval を #承認 通知経路へ配線する"
      labels: [impl]
      body: "src/ryza/governance/decisions.record_deemed_approval は実装済みだが、まだ呼び出す経路が無く、みなし承認の実運用は手動記録のままである(governance-deemed-writer の①⑤が未了)。定款 v0.4 第3条は『通知と同時に発効』を定め、通知を欠いた発効は A-18 の無承認変更にあたるため、通知の投入(press.outbox / src/ryza/bot/approvals.py 経路)と deemed 行の INSERT は**同一トランザクション**に置く必要がある(片方だけ成功する状態を作らない)。実装内容: ①保護領域変更の PR が起票されたときに #承認 へ PR リンク付き通知を投げ、同一トランザクションで record_deemed_approval(proposal_ref=PR URL, notice_ref=通知メッセージ ID) を呼ぶ、②A-18-1 の `Approved:` トレーラ突合が deemed 行を承認記録として受理することを確認する(現状 A-18 はトレーラの存在検査までで decisions の実在照会をしていない)。**実在照合を実装するときは governance.decisions ではなく governance.current_decisions を読み、effective_decision='vetoed' の行を承認記録として受理しないこと**(独立役員審査 0021 C-5)— decisions を直読すると、代表が否認した承認を A-18 が承認として受理し、否認された変更が無承認変更として検出されない、③#承認 の否認ボタン → decisions.record_veto / record_veto_withdrawal の配線(オーナー検証・expected_proposal_ref 照合を通す)。(完了 2026-08-04 — **ただし①のうち「PR 起票を検知して自動で通知する」部分は未実装**。実装したのは手動起動の機械化であり、人が CLI を叩かなければ通知は出ない。自動起票は deemed-auto-announce に分割した。以下は実装済みの範囲: ①announce_deemed_approval(src/ryza/governance/notices.py・新設)が press.outbox への #承認 embed 投入と deemed 行の INSERT を SAVEPOINT で束ね、片方の失敗で両方が消える(autocommit 接続は AtomicityError で拒否)。notice_ref は outbox:<press.outbox.id>(Discord メッセージ ID は配送後にしか確定しないため。notice_message_id で実メッセージへ解決)。起動口は CLI python -m ryza.governance.decisions --deemed のみ(呼び出し元ジョブは無い)。②a18.verify_decision_refs が Approved トレーラの参照を governance.current_decisions と突合し、vetoed / reject / 不在を受理しない。decision:<id> は ID 一致、それ以外は proposal_ref 一致(本リポジトリの承認記録は全件 PR URL のため後者が主経路 — 独立役員審査 重大-1)。裸の数字は Issue 番号と区別できないため照合せず notes に開示(重要-2)。PR マージ経由でも否認済みトレーラは救済しない。加えて A-18-5(通知が 60 分超未配送 = 通知なき発効)を追加(重要-3)。③#承認 のみなし承認 embed に否認ボタン(押下 → 理由入力モーダル → apply_veto。配送時に対応する deemed 決定の実在を照合してからボタンを付ける — 重要-4)、/veto(Bot 再起動でボタン View が失われるため)、誤操作の復旧は /unveto → withdraw_veto。否認は run_id を記録し出所を追える(重要-5 後段)。意見書: docs/reviews/deemed-wiring-independent-review.md)"
    status: done # 2026-08-04 手動起動の機械化まで完了(自動起票は deemed-auto-announce へ分割)

  - id: deemed-auto-announce
    what: "保護領域 PR の起票を検知して、みなし承認の発効通知を自動で出す(現状は CLI の手動起動のみ)"
    conditions:
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "みなし承認の発効通知を PR 起票から自動化する"
      labels: [impl]
      body: "governance-deemed-notice-wiring は記録と通知の**原子性**(src/ryza/governance/notices.announce_deemed_approval)と手動起動の CLI(python -m ryza.governance.decisions --deemed)までを実装したが、**呼び出し元が存在しない**(独立役員審査 中-7)。したがって「保護領域の変更 PR が起票されたら #承認 へ通知して発効する」という定款第3条の運用は、依然として人が CLI を叩くことに依存しており、叩き忘れれば通知なき発効(A-18 の無承認変更)になる。実装内容: ①保護領域に触れる PR の検知(gh CLI か GitHub webhook。config/governance.yaml の protected_areas と PR の変更ファイルを突合)、②独立役員審査の完了を確認してから announce_deemed_approval を呼ぶ(審査前に発効させない)、③起動主体は ops-weekly ではなく PR イベント駆動が望ましい(週次だと最大7日の遅延が発効時刻とずれる)。前提: A-18-5(通知の未配送検知)は実装済みなので、自動化後の配送障害は監査側で検出できる。(完了 2026-08-04 — **ただし PR 起票の自動検知は依然として未実装**。GitHub イベント受信基盤(webhook 受け口・常時稼働のサービス)が無く、①③は基盤の追加なしには満たせない。代わりに『叩き忘れの事後検出』と『叩く手間の削減』の2方向で次善を実装した: ①監査に **A-18-7**(src/ryza/audit/a18.check_unrecorded_protected_prs)を新設 — DEEMED_RECORD_BASELINE_COMMIT 以降の first-parent 上の PR マージ(親2・件名が Merge pull request)で保護領域に触れたもののうち、**その PR に帰属する**承認記録(proposal_ref が https://github.com/<slug>/pull/<N> に完全一致)が無いものを列挙する。トレーラの参照は、指す決定の proposal_ref が当該 PR である場合にのみ帰属と認める(後続配線審査 後-3: 『参照先の決定が実在するか』だけを見ると、追い PR にトレーラを複写しただけで緑になる)。他リポジトリの /pull/<N> も救済しない(後-5)。トレーラだけ書いて CLI を叩いていない場合・そもそも何も無い場合の双方を拾い、週次 A-18 の #運営 報告に載る(記録漏れ 0 でも**検査対象 N 件という分母つきで**1行出す — 後-4。N=0 は『対象 PR なし』と明示し、squash 運用移行時の沈黙を防ぐ)。否認済みは『記録はある』として扱い A-18-1 に任せる。**件名偽装の封鎖は A-18-7 の担当ではない**(後-6): --deemed は proposal_ref を無検証で受けるため架空 PR 番号の記録は作れる。偽装を封じるのは A-18-1 の PRVerifier(API 不達時は fail-open)であり、A-18-7 はそれに依存する。②CLI に簡易形 `python -m ryza.governance.decisions --deemed-for-pr <PR番号> --review <審査の参照>` を追加 — gh api で PR タイトル・URL・変更ファイルを取得し通知文面を自動生成する。--review は --deemed-for-pr と --kind pr で必須(--notice では代替不可 — 後-1)。ただし**実在検査のない形式要件**であり、値は通知本文に残るだけで構造化列にならない(後-2。構造化と実在検査は decision-reviewed-sha に登録済み)。**残課題**: PR イベント駆動の自動起票(webhook 受け口が要る)。A-18-7 は週次の事後検出であり、最大7日の遅延が残る)"
    status: done # 2026-08-04 A-18-7(事後検出)+ --deemed-for-pr(手間削減)まで。イベント駆動の自動起票は基盤待ちで未了

  - id: deemed-webhook-trigger
