        date: "2026-09-01"
    action:
      type: issue_create
      title: "Approved トレーラ v1 の承継を打ち切り、reviewed=<sha40> を必須にする"
      labels: [governance]
      body: "2026-08-04 の様式 v2 導入時、既存 PR の一斉違反化(05-governance §6-5 の形骸化)を避けるため v1(reviewed 無し)の承継を経過措置として残した。独立役員審査は『期限の無い経過措置は経過措置ではなく恒久仕様』『任意の統制は統制でない(実測採用率 0/4)』と指摘し、期限設定を統合条件とした。本リマインダーの発火時に以下を行う: ①`src/ryza/audit/a18.py` の `_v1_inheritance_notes` を注記から**警告(has_findings 寄与)**へ格上げする、②さらに実弾移行前に v1 承継そのものを廃止(reviewed 無しの PR マージは承継の起点にしない)、③定款第5条 C-5 の様式に reviewed を必須として明記する(L1 手続 = 独立役員審査 → #承認 通知)。判断材料として、発火時点の A-18 報告で v2 採用率(inherited のうち reviewed_scoped の割合)を確認すること。出典: docs/reviews/g-a18-protect-independent-review.md「トレーラ v2 審査記録」重大-2・反対意見書①。"
    status: pending

  - id: decision-reviewed-sha
    what: "承認記録(governance.decisions)に審査対象 SHA を持たせ、Approved トレーラの reviewed と突合する — reviewed の自己申告性の解消(独立審査 2026-08-04 重要-3)"
    conditions:
