      title: "みなし承認の発効通知を PR イベント駆動にする(webhook 受け口)"
      labels: [impl]
      body: "deemed-auto-announce は『叩き忘れの事後検出』(A-18-7)と『叩く手間の削減』(--deemed-for-pr)まで実装したが、**PR 起票を検知して自動で通知する**部分は GitHub イベント受信基盤が無いため未了である。**期限後退の経緯(後続配線審査 後-7)**: 元の deemed-auto-announce は 2026-08-17 期限だったが、本タスク(残り = webhook 受信基盤)は 2026-09-14 へ4週後退させた。理由は残作業の性質が変わったこと —— 前倒し実装で『CLI を叩けば通知が出る』『叩き忘れは週次で検出される』所までは満たされ、残るのは常時稼働の受信基盤という**別種の実装**(運用コストの判断を伴う)だからである。**ただし残リスクは不変**: 起票から週次 A-18-7 までの最大7日間、保護領域の変更が #承認 への通知なしにマージされたまま気づかれない窓が残る(定款第3条は『通知と同時に発効』を定めるので、この窓は通知なき発効そのもの)。A-18-7 が縮小したのは『永久に気づかれない』→『最大7日で気づく』であって、窓を閉じてはいない。4週の後退はこの窓を4週分だけ長く許容する判断であり、許容できないと判断した場合は日付を 2026-08-17 に戻すこと。現状の残リスク: 設計リードが CLI を叩き忘れると、保護領域の変更が #承認 への通知なしにマージされ、その事実が判明するのは最大7日後(週次 A-18-7)になる。定款第3条は『通知と同時に発効』を定めるので、この7日は通知なき発効の窓そのものである。実装内容: ①GitHub webhook の受け口(pull_request opened/synchronize)、②protected_areas と PR の変更ファイル突合、③独立役員審査の完了確認(審査前に発効させない — 現状は --review の手入力で担保している部分をどう機械化するか)、④announce_deemed_approval の呼び出し。前提の判断: 受け口を常時稼働させるコストと、A-18-7 の週次検出で足りるかを比較すること(A-18-1 の『PR 件名が GitHub API と未照合』という既存の限界も同じ基盤で解消できるため、実弾移行前提条件の API 照合と合わせて評価するのが効率的)。"
    status: pending

