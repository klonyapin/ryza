  - id: outbox-internal-key-separation
    what: "embed author の内部キー member_id を構造的に分離する(独立役員審査 0020 C-10)"
    conditions:
      - type: date_after
        date: "2026-08-31"
    action:
      type: issue_create
      title: "outbox の内部キー(author.member_id)を embed_json の外へ出す"
      labels: [impl]
      body: "0020 は配送時にアイコン上書きを解決するため、embed_json の author に内部キー member_id を載せる方式を採った(src/ryza/org.py embed_author / AUTHOR_MEMBER_KEY)。これは press.outbox の全行に Discord API のフィールドではない値が永続化されることを意味し、除去は送信直前の1関数(org.resolve_author)だけに依存している(独立役員審査 0020 C-10)。将来 embed_json を別経路(新しい配送先・再送ツール・エクスポート)へ流す実装が resolve_author を通し忘れると、未知フィールドが Discord へ送られる。是正: press.outbox に author_member_id 列を追加する(あるいは embed_json と並ぶ meta 列を設ける)か、outbox.OutboxMessage のデータ構造として embed とは別に持ち、embed_json には Discord のフィールドだけを入れる。press.outbox はスキーマ変更のため保護領域の手続を経ること。現行方式でも実害が出ていないのは、Discord が未知フィールドを無視するためであり(0020 時点で確認)、緊急性は低い。"
    # 2026-08-04 前倒し実施(migrations/0032):
    #   ①press.outbox に author_member_id 列を追加。②outbox.enqueue が org.split_author_member_id で
    #     embed から内部キーを外して列へ移す(embed_json には Discord のフィールドしか入らない)。
    #     ③OutboxMessage / claim_pending が列を運び、bot/main.py は列から member_id を渡す。
    #   **除去を投入時へ移すだけでは足りない**と判断し、embed_json への再混入を CHECK 制約
    #     (outbox_embed_has_no_internal_keys_check)で禁じた — enqueue を通さない書込経路
    #     (例 src/ryza/ingest/freshness.py の直接 INSERT)が strip を忘れても DB が書込時に落とす。
    #     制約は **NOT VALID**(既存行は評価しない): press.outbox の**送済**行は配送済みの投稿記録
    #     =証跡であり遡って書き換えない。
    #   **独立役員 追補審査 C-11(2026-08-04)で是正**: NOT VALID は「既存行を検証しない」だけで
    #     既存行への **UPDATE には効く**。未送の legacy 行を残すと、配送成功後の mark_sent(UPDATE)が
    #     CheckViolation で落ち、deliver_pending がバッチごと rollback → 5秒ごとに同じメッセージを
    #     送り続ける(承認・KS 通報を含む「送信は高々1回」の破壊+配送の恒久詰まり)。したがって
    #     0032 は**未送行のみ**を backfill する(embed から内部キーを外し列へ移す)。未送行は
    #     「まだ出していないキューの状態」であって出した記録ではないため証跡論は及ばない。
    #     送済行は不改変のまま残り、mark_sent が二度と UPDATE しない(WHERE sent_at IS NULL)ため
    #     CHECK にも当たらない。旧キーが残る送済行の配送側フォールバックは維持
    #     (org.resolve_author。tests/bot/test_outbox.py で再現→解消を対照検証)。
    status: done # 2026-08-04 0032 で列分離+CHECK 制約+未送行の backfill(C-11)

