      body: "(完了済み)config/governance.yaml の protected_areas に列挙されたパスが実在するかは、現状どこでも検証されていない。ファイルを改名・削除すると保護領域の登録は残るが実体を指さなくなり、A-18-1 は『そのパスに触れたコミット』を永久に見つけられないまま静かに無力化する(Issue #48 の改番で ops/deploy-a13.sh → ops/deploy-a18.sh、src/ryza/audit/a13.py → a18.py を改名した際に現実の危険として顕在化した。今回は同一 PR 内で登録も更新したが、機械的な検知は無い)。実装内容: ①tests/test_ips.py に、protected_areas のうち **glob メタ文字(`*`・`?`)を含まないパス**がリポジトリに実在することを検査するテストを追加する、②glob を含むパスは少なくとも1件にマッチすることを検査する(`ops/lib/**` のように並行ラインで新設されるパスは、実体が入るまで既知の未充足として明示的に許容リストへ入れるか、実体の追加後にテストを有効化するかを判断して記録すること)、③失敗メッセージには『保護領域の登録が実体を失っている』ことと governance.yaml の該当行を出す。**tests/test_ips.py は protected_areas に area: invariant_tests として登録済みの保護領域であり、変更には独立役員審査+承認手続を要する。** 出典: 改番 PR の独立審査 C-5。"
    status: done # 2026-08-03 実装: tests/test_ips.py TestProtectedAreaPathsExist(非 glob パスの実在+glob の 1 件以上マッチ+失敗時に governance.yaml の該当行を出力)

