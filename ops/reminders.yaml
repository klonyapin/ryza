      labels: [impl]
      body: "0019 で governance.decisions.decision に 'deemed' を許容したが、実際にその行を書くコードが無いため、定款 v0.4 第3条3号の記録要件(『みなし承認も governance.decisions に deemed として記録し、監査対象とする』)は未充足のままである(独立役員審査 0019 C-3)。実装内容: ①#承認 への PR リンク付き通知(src/ryza/bot/approvals.py 経路)と同一トランザクションで deemed 行を INSERT する、②decided_by は 'system:<source>' 形式(0019 の decisions_deemed_system_actor_check)、③3専決事項の kind には付けない(decisions_deemed_not_reserved_check がスキーマ側で拒否する — アプリ側でも事前に弾いて分かりやすいエラーにする)、④proposal_ref は PR URL 等の一意参照とし二重記録を UNIQUE で防ぐ、⑤A-18-1 の `Approved:` トレーラ突合が deemed 行を承認記録として受理することを確認。**順序制約: governance-decision-vetoes-schema(否認記録テーブル)のマージ後に着手すること** — 否認を記録できない状態で deemed 行を量産すると、代表が否認権を行使しても証跡を残せない。(完了 2026-08-03: src/ryza/governance/decisions.py の record_deemed_approval / record_veto / current_decision。②③④は実装済み。①#承認 通知経路との同一トランザクション配線と⑤A-18-1 の受理確認は未実施 — 後続リマインダー governance-deemed-notice-wiring に分離した)"
