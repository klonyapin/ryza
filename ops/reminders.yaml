  - id: gcp-iam-inventory
    what: "GCP プロジェクトレベル IAM の棚卸し(広すぎる付与・旧経路の残滓を洗う)"
    conditions:
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "GCP IAM の棚卸し: プロジェクトレベル付与と旧デプロイ経路の残滓"
      labels: [ops]
      body: "ops-weekly VM 移設審査(2026-08-04・低)が旧経路の IAM 残滓を指摘した。移設自体は撤回したため当該残滓は発生しないが、**既存の**付与を棚卸しする必要は残る。ops/deploy-ops-weekly.sh は `roles/run.invoker` と `roles/bigquery.dataViewer` を **プロジェクトレベル**でデフォルト Compute SA に付けており(--condition=None)、他の deploy スクリプトにも同種の付与がある。実施内容: ①`gcloud projects get-iam-policy ryza-main` を取り、SA ごとの付与を一覧化する。②プロジェクトレベルで足りている付与のうちリソースレベル(Cloud Run サービス単位・データセット単位)へ絞れるものを特定する。③使われていない付与(廃止した経路のもの)と、Artifact Registry の未使用イメージを洗う。④デフォルト Compute SA を全ジョブで共用している構成そのもの(1つの SA が漏れると全経路に及ぶ)の是非を評価し、判断材料を出す。**結論は『分離する/しない』ではなく、現状の棚卸し結果と分離コストの見積りを出すこと。** 変更を伴う場合、deploy スクリプトは保護領域(deploy_path)であり独立役員審査+承認記録の手続を経ること。"
    # 2026-08-04 実施(期限 8/17 より前倒し)。成果物 = docs/ops/gcp-iam-inventory.md。
    # gcloud の読み取りコマンドのみを使い、IAM の変更は一切行っていない。主な実測結果:
    #   ①**既定 Compute SA にプロジェクトレベル `roles/editor`(11,889 権限)**が付いている。
    #     どの deploy スクリプトにも宣言が無く(GCP がプロジェクト作成時に自動付与)、
    #     リポジトリを読んでも存在に気づけない。この SA は VM ryza-bot(Bot/日次/A-18)・
    #     Cloud Run Job ops-weekly・Cloud Scheduler の3系統を兼務する
    #   ②したがって `deploy-ops-weekly.sh` の run.invoker / bigquery.dataViewer は
    #     **現状 editor に包含されており1権限も増やしていない**(効いていない宣言)。
    #     是正の順序は「リソースレベル付与を先に足す → editor を剥がす」であり、逆順は
    #     ops-weekly と Scheduler を壊す
    #   ③`billing_export` データセット ACL の projectWriters=WRITER は editor 保持者に
    #     解決されるため、compute SA が請求エクスポート(運営帳簿の一次証憑)を消せる
    #   ④`discord-bot-token` に宣言の無い `secretVersionAdder`(2026-08-02 手動付与・
    #     git 全 ref に痕跡なし)。Secret に新版を積むコードは src に存在しない
    #   ⑤リマインダー④(SA 共用の是非)への回答: 分離すべきはまず editor。3 SA に割っても
    #     3つとも editor を継ぐなら爆風半径は変わらない。分離コストの見積りは文書 §5
    #   ⑥AR 残滓: ryza/dashboard が 12 世代(稼働は1)・削除済みサービス ryza-secret-drop
    #     のイメージ2件。allUsers/allAuthenticatedUsers はどこにも無い(既存ゲートが機能)
    # 是正の実施は本タスクから分離し `gcp-iam-remediation`(期限 2026-08-24・代表確認付き)へ。
    status: done # 2026-08-04 docs/ops/gcp-iam-inventory.md として完了(是正は gcp-iam-remediation へ分離)

