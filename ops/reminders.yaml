      body: "ryza.risk.state.state_metrics が残す測定値は `sufficient`(bool)と `n_returns` しか持たず、『どの指標がなぜ判定保留なのか』が読み手側で復元できない。ダッシュボードは暫定として『sufficient が偽なら vol/ES bullet を unknown にする』という粗い分岐で回避しているが(dashboard/app.py _insufficiency_note・独立役員審査 T-018 重大-3)、ES は観測不足以外の理由(価格欠測による銘柄除外など)でも採用値が変わるため、この分岐では保留理由を正しく説明できない。是正: state_metrics に `deferred`(判定を保留した指標名のリスト+各理由)と `excluded`(評価から外した銘柄+理由)を追加し、risk.limits_state_events.metrics 経由でダッシュボードと監査が同じ理由を読めるようにする。ダッシュボード側の暫定分岐は追加後に置き換える。**src/ryza/risk/ は保護領域のため独立役員審査+みなし承認の手続を経ること。** 出典: docs/reviews/t018-dashboard-viz-independent-review.md 重大-3。"
    status: pending

