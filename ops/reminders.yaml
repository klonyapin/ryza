      title: "判断: src/ryza/ops/github.py を protected_areas に登録するか(書き込み経路の迂回口)"
      labels: [decision, governance]
      body: "**決めること**: `src/ryza/ops/github.py` を config/governance.yaml の protected_areas に登録するか。登録する場合の area は既存の `ops_engine`(src/ryza/ops/weekly.py と同じ)か、クライアント専用の新 area か。登録しない場合は、代わりの担保と『登録しない』判断の根拠を governance.yaml に書き残すこと。\n\n**背景(迂回口の内容)**: 2026-08-04 に `src/ryza/ops/weekly.py` を保護領域へ登録した(area: ops_engine)。weekly.py は CLAUDE.md『将来アクションは必ず reminders.yaml に登録』の唯一の執行点だが、**ジョブが GitHub に読み書きする経路はすべて github.py の GitHubClient を通る**。したがって weekly.py に一切触れずに執行を空回りさせられる: ①`get_file` を空文字返しにすれば reminders.yaml が読めず条件評価が空になる、②`update_file` を no-op にすれば status が `fired:` へ遷移せず(=発火の記録が残らず)毎週同じ発火を繰り返すか、発火自体が記録されない、③`create_issue_comment` を no-op にすれば action の配送(notify・issue_comment)とダイジェスト投稿が黙って消える。いずれも例外を出さないため運用上は『静かに何も起きない』。\n\n**独立役員審査 重要-1 の実測(2026-08-04・両方向プローブ)**: 読み側 `get_file` の空返しは登録済みテスト `tests/ops/test_weekly.py::test_dry_run_real_client_makes_no_write_requests` が検出して落ちる(塞がっている)。一方、書き側 `update_file` と `create_issue_comment` を no-op 化すると **tests/ops/test_weekly.py の 31 テストは全て緑**のまま通り、落ちるのは `tests/ops/test_github.py` の 2 テストのみだった(是正実装時に再現確認済み)。理由は、weekly 側のテストが StubClient(偽実装)に対して書き込み契約を検査しているため、実クライアントの契約はどのテストにも固定されていなかったこと。\n\n**暫定の担保(すでに入っている)**: 上記の是正として `tests/ops/test_github.py` を protected_areas に `area: invariant_tests` で登録済み(2026-08-04・同 PR)。同ファイルは GitHub REST API のワイヤ様式のゴールデン(PUT contents の base64 本文+sha、POST issue comments の body 形、認証・API バージョンヘッダ、dry_run で opener へ 1 件も届かないこと)を持つ。CI は required status check なので、書き込み経路の no-op 化はテスト改変(=保護領域の変更=承認必須)なしには通らない。**したがって本件は『穴が開いたまま』ではなく『本体の登録要否を別途決める』案件である。**\n\n**判断材料**: (1) github.py の利用者は weekly.py だけでなく `src/ryza/ops/icon_revalidate.py` もあり、単純登録は運用スクリプト側の変更にも承認手続を課す。(2) 一方で ops/lib/** ・ src/ryza/risk/** を glob で登録した先例は『新しいモジュールを足す形の迂回』を塞ぐためであり、クライアントを差し替える新ファイルを足す迂回は本件にも当てはまる。(3) テスト側の登録だけでは『テストを通したまま実装を変える』余地(ワイヤ様式は保つが呼び出し元から見た副作用を変える)が残るかを検証すること。\n\n出典: docs/reviews/ops-weekly-protect-review.md 重要-1・重要-2、config/governance.yaml の tests/ops/test_github.py 登録行のコメント。"
    status: pending

  - id: reminders-status-tamper-detection
    what: "ops/reminders.yaml の status 直接書き換え(pending→done)に検出手段が無い — 制度の最安価な迂回(ops-weekly-protect 審査 中-4)"
    conditions:
      - type: date_after
        date: "2026-08-25"
    action:
      type: issue_create
      title: "決定: reminders.yaml の status 遷移をどう検出するか(pending→done の無検出書き換え)"
      labels: [decision, governance]
      body: "**問題**: 将来アクション制度(CLAUDE.md『将来のアクションは必ず ops/reminders.yaml に機械可読で登録すること』)の最も安価な迂回は、weekly.py でも github.py でもなく **ops/reminders.yaml の status を 1 行書き換えること**である。pending エントリを `done` にすれば、その将来アクションは承認手続も検出も無しに消える。ops/reminders.yaml は protected_areas に入っておらず、A-18 のどの検査も status の遷移を見ていない。根拠の添付(『なぜ done にしてよいか』)を強制する仕組みも無い — 実際、この指摘を生んだ PR 自身が 2 エントリを done 化しており(根拠付きで正当だったが、正当性を担保したのは起草者の裁量と独立審査であって仕組みではない)。\n\n**単純な保護登録は不可**: ops/reminders.yaml を protected_areas に入れると、**週次ジョブ自身の正常動作が毎週 A-18-1 違反になる**。ジョブは Contents API で main へ直接 `fired: <日付>` のコミットを書く(PR を経ない・Approved トレーラを持たない)ため、保護登録はジョブを止めるか監査を毎週赤にするかの二択を生む。これは 05-governance §6-5 の形骸化(『毎週赤いが誰も見ない』)を自ら作る手である。\n\n**対案(いずれかを選ぶ・併用可)**: (a) **週次ダイジェストへの status 遷移の列挙** — ジョブが reminders.yaml の直前版と現行版を diff し、『今週 status が遷移したエントリ(id・旧 status・新 status・遷移させたコミット)』をダイジェストに載せる。ジョブ自身の `fired:` 遷移と人手の `done` 化が同じ表に並ぶため、根拠なき done 化が代表の目に触れる。実装は weekly.py 側(保護領域)で完結し、A-18 にも DB にも依存しない。(b) **A-18 に遷移検査を足す** — main の履歴で ops/reminders.yaml の `pending` → `done` 遷移を含むコミットを列挙し、ジョブ自身のコミット(件名・author が `fired:` の様式)を除外したうえで、Approved トレーラまたは PR 承継を要求する。A-18-1 と同じ突合機構に載るので受容(acknowledged_findings)も効くが、A-18 実装(保護領域 src/ryza/audit/**)の変更が要る。\n\n**判断のポイント**: (a) は検出が『人が読むこと』に依存するが実装コストが小さく、ジョブの正常動作と競合しない。(b) は機械的な検出になるが、ジョブのコミットを様式で除外する部分が偽装可能(件名を真似れば除外される)なので、除外条件を author/committer や Contents API 経由であることに寄せられるか検証が要る。**両方を採るなら (a) を先に入れて実データで遷移の頻度を見てから (b) の閾値・除外条件を決めるのが順当。**\n\n出典: docs/reviews/ops-weekly-protect-review.md 中-4(敵対的観点・審査者の自発的提起)。関連: 同意見書 重要-2(『将来アクションを YAML コメントに書くのは CLAUDE.md 違反』)、リマインダー `github-client-protect`。"
    status: superseded
    superseded_by: "T-020-a18-reminders-tamper (Issue #117): A-18-9 として (b) 案の意味的改ざん検査を実装(pending→終端で証跡なし・期日後ろ倒し・pending 削除を Approved 無し検出)。docs/tasks/T-020-a18-reminders-tamper.md 参照。"

  - id: a18-9-review-followups
    what: "A-18-9(reminders 台帳改変検査)独立役員審査 PR #135 の任意所見の再評価 — F-7(生テキスト証跡の内在限界)・F-9(偽証跡: 7〜8桁数字列/hex-only 英単語)・F-10(履歴線形走査の性能)"
    conditions:
      - type: date_after
        date: "2026-11-01"
    action:
      type: issue_create
      title: "評価: A-18-9 の任意所見(F-7 生テキスト証跡・F-9 偽証跡・F-10 走査性能)"
      labels: [decision, audit]
      body: "**背景**: PR #135(f1-a18-reminders-tamper)の独立役員審査(docs/reviews/f1-a18-reminders-tamper-review-r1.md)で任意所見として3件が挙がり、再提出裁定では対応がフォローアップとされた。運用実データで再評価する。\n\n**F-7(生テキスト証跡の内在限界)**: 証跡判定は当該エントリ範囲ハンクの生テキスト検索であり、終端遷移と同時に同エントリ内の既存参照行(URL・#番号・SHA を含む行)を1箇所編集するだけで削除側 `-` 行の参照がハンクに現れて成立してしまう。並べ替え+終端遷移の複合も同様(移動でエントリ全行が追加行としてハンクに入る)。**再評価の材料**: (i) 実運用で生テキスト証跡が偽陽性を生んだ実例の有無、(ii) 判定を『追加行(`+`)のみを対象にする』に狭めたときの正当運用の巻き添え件数(3ヶ月の実データで測る)、(iii) A-18-1 のトレーラ実在照合(pr_verifier)を A-18-9 のトレーラ判定にも流用できるか(F-2 の存在検査のみ問題と合わせて設計)。\n\n**F-9(偽証跡)**: `_REMINDER_EVIDENCE_RE` は 7〜40 桁の数字/hex を SHA と扱うため、`20260804` の 8 桁数字列や `defaced` の hex-only 英単語(7 文字)も証跡として成立する(検出漏れ方向)。**再評価の材料**: (i) 実運用で偽証跡による見逃しの実例、(ii) SHA を『少なくとも1文字は非数字』または『7 桁+改行/空白境界+文脈語』に絞ったときの正当運用の巻き添え件数、(iii) `fired: <日付>` の限定拡張(本 PR で導入)が想定どおりに動いているか。\n\n**F-10(走査性能)**: 履歴線形の全走査(~73ms/コミット・審査時点で 27.9 秒/383 コミット)。`git rev-list -- ops/reminders.yaml` の事前絞り込みで大幅削減できるが、マージの履歴単純化(--full-history の要否)を検証する必要がある。**再評価の材料**: (i) 週次実行時間の観測値(基準コミット以降の履歴で測る)、(ii) `--first-parent` に絞ったときの evil-merge 検出の欠落有無(本 PR は blob 直接比較で全マージを対象化しているので、絞ってもよいか要検証)、(iii) 1年後の予測実行時間。\n\n出典: docs/reviews/f1-a18-reminders-tamper-review-r1.md(意見書)・src/ryza/audit/a18.py の A-18-9 実装。"
    status: pending

  - id: ledger-evidence-full-append-only
    what: "ledger.evidence の完全追記オンリー化(未参照行の DELETE 封鎖)を再評価する(T-022 / Issue #128 で保留した後半)"
    # 条件の是正(T-022 独立審査 所見7・設計リード裁定): 当初の issue_label_open は
    # (a) 該当ラベルが repo に無い、(b) Issue #23 は既に CLOSED、(c) 意味論が「open な間
    # fire」で意図(完了後に fire)と逆向き — の三重で発火不能だった。実際の前提条件は
    # #23 の完了そのものではなく「共有 DB 実行時の残留データ隔離が conftest の
    # _CLEAR_EVIDENCE_SQL(evidence DELETE)に依存しなくなること」であり、機械可読な
    # 完了シグナルが無いため、決定論的に発火する date_after で再評価日を固定する。
    conditions:
      - type: date_after
        date: "2026-09-01"
    action:
      type: issue_create
      title: "ledger.evidence の DELETE 封鎖(完全追記オンリー化)を再評価する"
      labels: [governance, impl]
      body: "T-022(migrations/0036)は ledger.evidence の UPDATE / TRUNCATE を封鎖したが、行 DELETE は封鎖しなかった。理由は Issue #128 本文と 0036 冒頭コメントに記す: (1) UPDATE 封鎖で sha256 / payload_ref の不変性は確立し改竄検知(A-1)の前提は満たす、(2) 参照済み行の DELETE は既に FK が拒否する、(3) 未参照行の DELETE 封鎖は tests/conftest.py `_CLEAR_EVIDENCE_SQL`(残留データ隔離の第二層)と衝突するため、テスト隔離戦略の再設計とセットでしか導入できない(Issue #23 は CLOSED だが、共有 DB 実行時=RYZA_TEST_DATABASE_URL 上書き時の残留データ隔離は依然この DELETE 経路に依存する)。**再評価では** 具体的には (i) 未参照行の DELETE を封鎖する行トリガと REVOKE DELETE を 0036 と同じ様式で追加できるか、(ii) conftest の evidence 掃除経路をテスト DB 分離だけで担保でき DELETE を残す必要が無いか、(iii) 取込ジョブ側で『記帳に至らなかった証憑』をどう処理するか(封鎖後は削除できないため、記帳側でダミー逆仕訳を切るなり、専用の quarantine スキーマへ隔離するなりの経路が要る)を判断する。保護領域(migrations・会計エンジン)のため、独立役員審査 → #承認 → みなし承認の手続を経ること。出典: T-022 実装指示書(docs/tasks/T-022-ledger-evidence-guard.md)、Issue #128、migrations/0036 冒頭コメント。"
    status: pending

  - id: g6-short-margin-model
    what: "G-6 現金下限のショート担保モデル導入 — F-5 の fail-closed 近似(担保拘束を数えない)を精緻化(実弾移行前提)"
    conditions:
      - type: date_after
        date: "2026-09-15"
    action:
      type: issue_create
      title: "G-6 現金下限: ショート担保モデル+クローズ売りの avg_cost 考慮"
      labels: [impl]
      body: "**現状(F-5 是正・Issue #120)**: src/ryza/gate/compliance.py `_g6_cash_floor` は新規ショート(side == \"short\")で `post_cash = ctx.state.cash`(売却代金を自由現金に加算しない)として現金下限を評価する — 担保拘束モデルを持たないための fail-closed 近似。**残課題**: (1) ブローカーの必要担保・維持証拠金モデル(例: 委託保証金率・維持保証金率・信用取引の建玉金額×一定率)を導入し、実際の担保拘束額を差し引いた自由現金で下限を判定する。(2) sell(ロング解消)で avg_cost と時価の乖離により実際の入金額が `qty*price` と異なるケース(税・手数料・信用返済の金利込み)を評価に含めるか判断する。(3) cover(買い戻し)の担保解放と当日決済の同時性を考慮した現金推移を評価する。(4) **フリップ売りのロング解消分代金の算入(独立役員審査 2026-08-04 O-1/R-2 の残課題)**: G-6 のショート性判定は side == \"short\" or post_pod_qty < 0 に対称化済み(F-5 是正で実装 — IPS ショート許可+stan short: true の発効 config 下で抜け穴が現に有効だったため即時 fail-closed 化)。ただし現近似はフリップ売りでロング解消分の代金(真に自由現金になる部分)も数えない過保守側 — 担保モデル導入時に約定をロング解消分と新規ショート分に分解し、前者のみ自由現金へ算入すること。ゲート・IPS 双方に触れるため保護領域手続で実装。実弾移行前に完成させること(担保無視の近似はデモ/紙面では安全側だが、実弾では機会損失が過大になる)。"
    status: pending

