  - id: dashboard-framework-evaluation
    what: "ダッシュボードのフレームワーク移行を比較調査する(Streamlit 継続 vs Next.js 系等。Phase 5 判断)"
    conditions:
      - type: date_after
        date: "2026-09-30"
    action:
      type: issue_create
      title: "ダッシュボード基盤の比較調査: Streamlit 継続 vs 移行(Phase 5 判断)"
      labels: [decision]
      body: "2026-08-03 の DADS デザイン改修(代表指示)で、Streamlit には CSS でも JS でも回避できない制約が7項目あることが確定した(docs/research/dads-streamlit-application.md §6)。とくに決定打になりうるのは (1) st.dataframe が canvas 描画で DOM にテキストを持たず、スクリーンリーダー・ブラウザ内検索・テキスト選択・拡大が一切効かないこと、(2) CSS 注入が非公式 API でありバージョン更新で無言で壊れ CI で検知できないこと。現時点では『単一利用者の非公開ツールに全面準拠の実利なし』という裁定でトークン層のみ採用したが、この裁定は利用者が代表1名という前提に依存する。調査すべき論点: (a) §6 の7項目のうち Phase 5 時点で実害が出ているものはどれか(『表の値をコピーできない』『Ctrl+F で銘柄を探せない』は単一利用者でも効く実害であり、想定と実測を突き合わせること)、(b) 移行先候補(Next.js + Recharts / SvelteKit / Dash / Panel 等)の実装コストと、Python の可視化ヘルパ dashboard/viz.py・queries.py をどこまで再利用できるか、(c) 移行しない場合の緩和策(明細を CSV ダウンロードで出す、st.dataframe を st.table に落とす等)で足りるか、(d) 二系統(取引デモ/実)の将来的な同時表示や外部公開の可能性が判断を変えるか。**結論は『移行する/しない』ではなく、判断材料(実害の実測とコスト見積り)を投資委員会へ出すこと。** 反対意見書(この提案が間違っている場合の理由トップ3+代替案)を添付すること(CLAUDE.md 議論規約2)。出典: docs/research/dads-streamlit-application.md §6・§7。"
    status: pending

