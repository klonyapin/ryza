    action:
      type: issue_create
      title: "governance.decision_vetoes(みなし承認の事後否認記録)を追加する"
      labels: [impl]
      body: "定款 v0.4 第3条は『みなし承認は通知と同時に発効し、代表はいつでも否認できる。否認された変更は遅滞なく取り消し、派生効果を #運営 へ報告する』と定めるが、この否認を記録する場所がスキーマに無い(独立役員審査 0019 C-1)。governance.decisions は 0007 の UNIQUE(proposal_ref) で 1提案=1行に固定されているため、否認を新規行として INSERT できず、既存行を UPDATE すると `Approved:` トレーラが指す承認記録の意味を遡及的に改変してしまう(A-18 の突合が過去に遡って壊れる)。結果として、監査部門が追う deemed_ratio(否認ゼロの長期継続=形骸化アラート)は構造的に発火不能な状態にある。是正: governance.decisions を参照する追記オンリーの governance.decision_vetoes テーブル(decision_id への FK・否認者・否認理由・取消コミット revert_commit・取消不能な派生効果の参照・run_id、UPDATE/DELETE 禁止トリガは 0013 の minutes/stances と同型)を migrations で追加し、A-18 と deemed_ratio 集計がこれを読む配線を行う。**順序制約: 本テーブルは governance-deemed-writer(みなし承認の記録 writer)の実装 PR より前にマージすること** — writer が先に入ると、否認できない deemed 行が本番データとして積み上がり、後から否認証跡を遡及付与できない。migrations は保護領域のため独立役員審査+みなし承認の手続を経ること。(完了 2026-08-03: migrations/0021_decision_vetoes.sql — decision_vetoes テーブル + governance.current_decisions view。A-18 / deemed_ratio 集計への配線は未実施のため後続リマインダー governance-deemed-ratio-audit に分離した)"
    status: done # 2026-08-03 migrations/0021 で対応(順序制約どおり deemed writer と同一 PR・先行定義)

