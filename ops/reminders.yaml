      labels: [impl]
      body: "(完了済み)独立役員 再審査 2026-08-03(docs/reviews/dashboard-deploy-independent-review.md 再審査記録「次回 PR 対応」)の3件。(1) ロール検証クエリのゲート化 → ops/deploy-dashboard.sh のロール定義 SQL 末尾に DO $ryza_gate$ ブロックを追加し、7項目(ロール存在・ロール属性・読取専用ロールの非 SELECT 権限・秘密テーブル権限・役員室の ops 権限表数・想定外 ops テーブル・履歴表の追記オンリー)が想定外なら RAISE EXCEPTION で中断。(2) pg_hba 検査の CIDR 列限定 → ops/lib/pg_hba_check.sh に切り出し、コメント除去のうえ host 系行のアドレス列(+netmask 列)だけで判定。include 指令は検査不能として中断。(3) リグレッションテスト → tests/ops/test_deploy_guards.py(42件・git ゲート/公開バインディング検査/pg_hba 検査。gcloud は PATH スタブ、git は一時ローカルリポジトリ)と tests/ops/test_deploy_role_gate.py(13件・生成 SQL の DO ブロックを実 PostgreSQL 上の一時ロールに対して実行)。さらに独立役員 第3回審査(変異試験でゲート無効化が検出されないことを指摘)の条件付き承認を受け、同 PR 内で C-1〜C-7 を是正: ロールゲートの psql 配線(ON_ERROR_STOP・握り潰し禁止・リモート errexit)をテストで固定、pg_hba 検査を終了コード3分岐+関数ロード確認に、ロールゲートに information_schema.column_privileges を併用(列レベル GRANT の検出)、0020 未適用 DB を正常と誤認しないよう対象表の実在を要求、origin 許可リストを env 上書き不可のハードコードに、samehost をループバック扱いから除外、追記判定を検査と同一の正規化に。統制を無効化する変異13件が全てテストで FAIL することを確認済み。以上をもって dashboard-cloudbuild-trigger の前提条件は充足。"
    status: done # 2026-08-03 ops/lib/{deploy-guards,pg_hba_check}.sh + tests/ops/test_deploy_{guards,role_gate}.py で完了(第3回審査 C-1〜C-7 是正済み)

  - id: governance-decision-vetoes-schema
    what: "みなし承認の事後否認を記録する追記オンリーテーブル governance.decision_vetoes(定款 v0.4 第3条が定める否認権の証跡。独立役員審査 0019 C-1)"
    conditions:
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "governance.decision_vetoes(みなし承認の事後否認記録)を追加する"
      labels: [impl]
      body: "定款 v0.4 第3条は『みなし承認は通知と同時に発効し、代表はいつでも否認できる。否認された変更は遅滞なく取り消し、派生効果を #運営 へ報告する』と定めるが、この否認を記録する場所がスキーマに無い(独立役員審査 0019 C-1)。governance.decisions は 0007 の UNIQUE(proposal_ref) で 1提案=1行に固定されているため、否認を新規行として INSERT できず、既存行を UPDATE すると `Approved:` トレーラが指す承認記録の意味を遡及的に改変してしまう(A-18 の突合が過去に遡って壊れる)。結果として、監査部門が追う deemed_ratio(否認ゼロの長期継続=形骸化アラート)は構造的に発火不能な状態にある。是正: governance.decisions を参照する追記オンリーの governance.decision_vetoes テーブル(decision_id への FK・否認者・否認理由・取消コミット revert_commit・取消不能な派生効果の参照・run_id、UPDATE/DELETE 禁止トリガは 0013 の minutes/stances と同型)を migrations で追加し、A-18 と deemed_ratio 集計がこれを読む配線を行う。**順序制約: 本テーブルは governance-deemed-writer(みなし承認の記録 writer)の実装 PR より前にマージすること** — writer が先に入ると、否認できない deemed 行が本番データとして積み上がり、後から否認証跡を遡及付与できない。migrations は保護領域のため独立役員審査+みなし承認の手続を経ること。(完了 2026-08-03: migrations/0021_decision_vetoes.sql — decision_vetoes テーブル + governance.current_decisions view。A-18 / deemed_ratio 集計への配線は未実施のため後続リマインダー governance-deemed-ratio-audit に分離した)"
    status: done # 2026-08-03 migrations/0021 で対応(順序制約どおり deemed writer と同一 PR・先行定義)

  - id: governance-deemed-writer
    what: "みなし承認を governance.decisions に decision='deemed' で記録する writer の実装(0019 でスキーマは通ったが書き手が居ない。独立役員審査 0019 C-3)"
    conditions:
