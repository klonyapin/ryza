        date: "2026-08-17"
    action:
      type: issue_create
      title: "governance.decisions に審査対象 SHA を追加し A-18 の reviewed と突合する"
      labels: [impl]
      body: "様式 v2 の `reviewed=<sha40>` はトレーラの書き手の申告であり、『独立審査が実際にその SHA を見た』ことを A-18 は独立に確認できない。現在の機械検査は『reviewed が当該マージの第2親の祖先であること』までで、`reviewed=<マージ直前のブランチ head>` と書けば被覆は v1 と同じになる(独立役員審査 PoC 再現済み)。恒久対策は照合先を作ること: ①`governance.decisions`(または新テーブル)に審査対象コミット SHA 列を追加するマイグレーション(保護領域 — schema)、②独立審査エージェント/承認フロー(`src/ryza/governance/notices.py`・`src/ryza/bot/approvals.py`)が審査対象 SHA を記録する、③A-18-1 が `reviewed` と承認記録の SHA を突合し、不一致は承継の起点にしない(fail-safe)。②の記録主体が人間の手作業のままなら申告性は解消されないため、審査エージェントの出力から機械的に埋まる経路にすること。出典: docs/reviews/g-a18-protect-independent-review.md「トレーラ v2 審査記録」重要-3。"
    status: pending

