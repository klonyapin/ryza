      title: "A-18-1: マージ PR の実在を GitHub API で照合する"
      labels: [impl]
      body: "現行の src/ryza/audit/a18.py は PR 件名(Merge pull request #N)の自己申告のみで承認と判定しており件名偽装でバイパス可能(独立役員審査 2026-08-03 で実証)。GitHub API で PR #N の実在・マージコミット SHA の一致・マージ実行者を照合する。定款第5条の実弾移行前提条件(ブランチ保護+トレーラ検査 CI)の実装判断と合わせて行う。**2026-08-04 追記**: PR 承継ルールの導入で偽トレーラの爆風半径が『1コミット』から『ブランチ全体』に拡大したため、本件は `approved-trailer-v2`(期限 2026-08-10)と統合して実装してよい(実装するなら早い方に寄せる)。"
    # 2026-08-04 完了: approved-trailer-v2 と統合して実装(PRVerifier)。件名の PR 番号と
    # トレーラの PR URL を `repos/<slug>/pulls/N` で実在+マージ済み照合し、A-18-1(承継起点・
