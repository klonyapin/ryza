  - id: risk-state-metrics-sufficiency
    what: "state_metrics に判定保留の理由(deferred / excluded)を持たせる(T-018 重大-3 の恒久対応)"
    conditions:
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "risk.state_metrics に deferred / excluded を追加し、保留理由を機械可読にする"
      labels: [impl, risk]
      body: "ryza.risk.state.state_metrics が残す測定値は `sufficient`(bool)と `n_returns` しか持たず、『どの指標がなぜ判定保留なのか』が読み手側で復元できない。ダッシュボードは暫定として『sufficient が偽なら vol/ES bullet を unknown にする』という粗い分岐で回避しているが(dashboard/app.py _insufficiency_note・独立役員審査 T-018 重大-3)、ES は観測不足以外の理由(価格欠測による銘柄除外など)でも採用値が変わるため、この分岐では保留理由を正しく説明できない。是正: state_metrics に `deferred`(判定を保留した指標名のリスト+各理由)と `excluded`(評価から外した銘柄+理由)を追加し、risk.limits_state_events.metrics 経由でダッシュボードと監査が同じ理由を読めるようにする。ダッシュボード側の暫定分岐は追加後に置き換える。**src/ryza/risk/ は保護領域のため独立役員審査+みなし承認の手続を経ること。** 出典: docs/reviews/t018-dashboard-viz-independent-review.md 重大-3。 **完了(2026-08-04)**: `engine.Deferral`(指標名・理由コード・観測数/必要数)と `engine.Exclusion`(銘柄・対象測定・理由)を追加し、`RiskState.deferred` / `RiskState.excluded` として評価結果に載せ、`state_metrics` が `deferred` / `excluded_instruments` / `es95_deferred` として `risk.limits_state_events.metrics` に記録する。理由コードは `insufficient_returns` / `insufficient_obs` / `no_observations` / `majority_excluded`(保留)と `short_series` / `missing_price`(除外)。時価欠測で評価から外れた銘柄(`risk/daily.load_positions`)も同じ列に載るため、『ES の採用値が何を含まないか』を 1 か所で読める。ダッシュボードは新キーを優先して**指標ごとに**保留理由を表示し(`_deferral_note`)、除外銘柄を名指しする(`_exclusion_note`)。`deferred` キーを持たない過去のイベント行は従来表示に落とす(後方互換 — metrics は追記のみで遡って書き換わらない)。既存キー(`sufficient` / `n_returns` / `es95_*`)は残した。 **独立審査の条件是正(重大-1)**: 初版は `evaluate` が理由を代理指標から推測しており、過半でないのに `majority_excluded` と記録する誤りがあった(3 銘柄・1 銘柄短系列・残る 2 銘柄の共通観測日ゼロ)。理由は `es95()` 自身が `ESResult.deferral_reason` として返す構造に変え、`no_common_days` を独立コードとして追加した(`deferred` は理由の有無を見る派生値)。注記文も残部の有無で言い分ける。評価結果の全キーは `tests/risk/engine_snapshot.json` にゴールデン固定し、判定変更が必ずテスト差分に出るようにした。出典: docs/reviews/risk-observability-independent-review.md 重大-1・推奨。"
    status: done # 2026-08-04 実装: engine.Deferral/Exclusion → state_metrics.deferred/excluded_instruments + ダッシュボード新表示(審査 重大-1 是正済み)

  - id: db-indexes-dashboard
    what: "ダッシュボードの重いクエリ向け索引を追加する(ledger.journal_lines / meta.runs。独立役員審査 T-018 中-10)"
    conditions:
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "migrations: journal_lines / meta.runs の索引を追加する"
      labels: [impl]
      body: "ダッシュボードの NAV 系列(dashboard/queries.py fetch_nav_series)は ledger.journal_lines × journal_entries × accounts を全走査して出資フローを日次集計し、コスト集計(fetch_cost_daily / fetch_cost_summary)は meta.runs を started_at で全走査する。どちらも支える索引が無い(journal_lines の PK は (entry_id, line_no)、meta.runs の PK は run_id のみ)。現在は行数が小さく問題にならないが、仕訳と実行記録は単調増加するため放置すると再実行のたびに全表走査が効く。暫定対応として app.py 側に @st.cache_data(ttl=60) を入れてある(独立役員審査 中-10 の部分対応)。是正: (1) ledger.journal_lines (book_id, account_id) の索引、(2) ledger.journal_entries (book_id, entry_date) の索引、(3) meta.runs (started_at DESC) の索引、(4) meta.runs (job_name, run_id DESC) の索引を migrations で追加し、EXPLAIN で効いていることを確認する。**migrations は保護領域(定款第5条)のため独立役員審査+みなし承認の手続を経ること。** 出典: docs/reviews/t018-dashboard-viz-independent-review.md 中-10。 **追記(2026-08-04・再締め審査 新-5)**: (2) の `ledger.journal_entries (book_id, entry_date)` は優先度が上がった。日次の再締め(`ledger.closing.reclose_stale`)の stale 検出が、スナップショット 1 日につき `journal_entries` への相関サブクエリを 2 本(水位 max・建玉性 EXISTS)回すため、コストは スナップショット数 × 仕訳数 で伸びる(`EXPLAIN ANALYZE` で `SubPlan 3` が `loops=15`)。年単位の運用で毎日の締めが線形に重くなる。索引に加えて安価な枝刈り(全スナップショットの `stored_watermark` 最大値より後ろの `entry_id` を持つ最古の `entry_date` を 1 回求め、その日以降のスナップショットだけを候補にする)も同時に検討すること。出典: docs/reviews/risk-navflow-rollforward-independent-review.md 再々審査 新-5。"
    status: done # 2026-08-04 実装: migrations/0027_query_indexes.sql。EXPLAIN ANALYZE の前後比較で採否を決めた。採用は4本 — (1) は 2 列版が規模B でプランナに選ばれないため 3 列 (book_id, account_id, instrument_id) に変更して採用、(2) journal_entries (book_id, entry_date) は**採用**(ただし審査が想定した stale 検出には効かず、再締めの as_of 建玉復元 _util.replay_position に効く別根拠で採用)、(3) started_at は採用、加えて meta.runs (run_id DESC) WHERE status='running' の部分索引を追加。**不採用は (4) meta.runs (job_name, run_id DESC) のみ**(実クエリが索引なしで 0.007 ms、一方この索引だけ 13MB と最大)。(2) が本来狙った stale 検出の是正(枝刈り)は reclose-stale-pruning として別項目に登録。独立役員審査は 0027 について条件付き承認(docs/reviews/0027-indexes-independent-review.md)

  - id: reclose-stale-pruning
    what: "再締めの stale 検出に枝刈りを入れる(索引では直せないことが実測で確定した — db-indexes-dashboard の残り)"
    conditions:
      - type: date_after
        date: "2026-08-20"
    action:
      type: issue_create
      title: "ledger.closing: reclose_stale の stale 検出を枝刈りで定数時間に近づける"
      labels: [impl, ledger]
      body: "`ledger.closing.reclose_stale` の stale 検出(`_STALE_SNAPSHOTS_SQL`)は、スナップショット 1 日ごとに `SELECT max(je.entry_id) ... WHERE book_id = %s AND entry_date <= snap.snap_date` という相関サブクエリを回すため、コストが スナップショット数 × 仕訳数 で伸びる。**索引では直らないことが実測で確定した**(2026-08-04・migrations/0027 の検証): プランナはこのサブクエリを『主キーの逆走査 + フィルタ + LIMIT 1』(見積りコスト 0.43)と評価するので、`(book_id, entry_date)`・`(book_id, entry_date) INCLUDE (entry_id)`・`(book_id, entry_date, entry_id)` のいずれを置いても選ばれず、実行時間が変わらない(規模A = 仕訳 31,413 行 で 778.6 ms → 766.6 ms、規模B = 仕訳 314,013 行・スナップショット 785 日 で 8,371.1 ms → 8,184.6 ms。どちらも誤差で、`pg_stat_user_indexes.idx_scan` は 0)。実測の伸び方も理論どおりで、行数 10 倍で所要 10.7 倍(778.6 ms → 8,371.1 ms)。是正は再々審査 新-5 が併記していた**枝刈り**である: 全スナップショットの `stored_watermark` の最大値より後ろの `entry_id` を持つ最古の `entry_date` を 1 回だけ求め(実測 0.57 ms)、その日以降のスナップショットだけを stale 候補にする。遅延仕訳が無い通常日は候補ゼロになり、検出は事実上ゼロコストになる。**注意点**: `stored_watermark` が NULL のスナップショット(本機能より前に書かれた日)は判定材料が無く現行実装が fail-safe で stale 扱いにしているので、枝刈りでもこの日を落としてはならない。**src/ryza/ledger/ は会計エンジン = 保護領域のため独立役員審査+みなし承認の手続を経ること。** 出典: docs/reviews/risk-navflow-rollforward-independent-review.md 再々審査 新-5、`migrations/0027_query_indexes.sql` の **索引2(`ledger.journal_entries (book_id, entry_date)`)の「効かない用途」節**(『入れなかったもの』節ではない — 索引2 自体は別根拠で採用済み)、`docs/reviews/0027-indexes-independent-review.md` 中-3。 **完了(2026-08-04)**: `_STALE_SNAPSHOTS_SQL` を書き換えた。**ただし本項目が案として挙げた『最大水位より後ろの entry_id を持つ最古の entry_date で枝刈り』は採用していない — 検出漏れを起こすことが反例で確定したためである**。反例: 9/1 の締め(水位 5)の後に 9/1 付けの仕訳(entry_id 50)が立ち、その状態で 9/2 の締めが走る(水位 100)。9/1 は `50 > 5` で stale だが、最大水位 100 より後ろの仕訳は無いので候補が空になり、遅延仕訳を取り込んだ日が**永久に再締めされない**(本機能が存在する理由そのものを壊す)。同じ形で健全にするには閾値を水位の**最小値**にするしかなく、最小値は最古のスナップショットの水位なので枝刈りが効かない。代わりに採ったのは**同値な分解**である: `max(entry_id) WHERE entry_date <= d` を『日ごとの max の running max』に分解し(`entry_day` CTE)、日ごと 1 回の集約に落とす。相関サブクエリはスナップショット数 × 仕訳数 だったが、分解後は 1 パス + 日数×日数 の小さな走査になる。建玉性(`position_changing_late`)は `EXISTS(∃e: date<=d ∧ id>W)` を `max{id} > W` に書き換えたうえで、**stale と判定された日にだけ**必要な範囲を集約する(`pos_day` は `entry_id > min(stale の水位)` かつ `entry_date <= max(stale の日)` で刈る — これは同値性を壊さない下限であり、stale ゼロなら走査自体が起きない)。実測(0027 と同じ合成データ・中央値7回): 規模A 788.0 → 28.9 ms(27x)、規模B 8,558.5 → 46.1 ms(**186x**)。全日が stale の最悪ケースでも 規模A 2,950.7 → 83.6 ms、規模B 53,817.9 → 150.3 ms(358x)。等価性は `tests/ledger/test_stale_query_rewrite.py`(旧 SQL を凍結した対照テスト17件・シード固定のランダム化総当たりを含む)が固定する — 上の反例も対照テストとして残した。"
    status: done # 2026-08-04 実装: _STALE_SNAPSHOTS_SQL を同値分解で書き換え(規模B 8,558→46 ms)。案の「最大水位で枝刈り」は検出漏れの反例が出たため不採用・反例をテスト化

  - id: navflow-equity-flow-query-rewrite
    what: "navflow の出資フロー抽出クエリを書き換える(索引が効かない理由が見積り誤差にあることが実測で確定した)"
    conditions:
      - type: date_after
        date: "2026-09-15"
    action:
      type: issue_create
      title: "risk.navflow: NAV_FLOW_SQL の flow CTE をプランナが絞れる形に書き換える"
      labels: [impl, risk]
      body: "`ryza.risk.navflow.NAV_FLOW_SQL` の flow CTE は `ledger.journal_lines` を `ledger.accounts` と結合して `category='equity' AND account_id <> 'retained'` の科目に絞るが、**プランナは結合前に『どの account_id が equity か』を知れない**ため、journal_lines 側の行数を平均選択度で見積もる(実測: 真値 13 行に対し見積り 6,107 行)。結果としてどんな索引を置いてもハッシュ結合＋逐次走査が選ばれ、`journal_lines` の全走査が消えない(2026-08-04 の migrations/0027 検証: 規模B で前後とも 58〜61 ms、プラン不変)。結合順を強制すると 2.4x 速い(規模A: 10.5 ms → 4.4 ms、共有バッファ 1,102 → 96)ので、**是正は索引ではなくクエリの書き換えである**。案: 対象科目を先に確定させる(`WITH eq AS (SELECT account_id FROM ledger.accounts WHERE book_id = %(book)s AND category='equity' AND account_id <> 'retained')` を MATERIALIZED にして `jl.account_id IN (SELECT ...)` にする、あるいは LATERAL で科目ごとに journal_lines を引く)。**科目リストを SQL にハードコードしてはならない** — accounts が正であり、二重管理は帳簿の定義がコード側にずれる典型経路である。現状の緩和は dashboard 側の `@st.cache_data(ttl=60)` のみ。**src/ryza/risk/ は保護領域のため独立役員審査+みなし承認の手続を経ること。** 出典: `migrations/0027_query_indexes.sql` の「入れなかったもの」節の **(B) ryza.risk.navflow.NAV_FLOW_SQL 向けの索引**、および `docs/reviews/0027-indexes-independent-review.md`。 **完了(2026-08-04)**: flow CTE を書き換えた。対象科目を `eq AS MATERIALIZED` で先に確定させ、`CROSS JOIN LATERAL (... OFFSET 0)` で科目ごとに `journal_lines` を引く(`OFFSET 0` は**必須の最適化フェンス** — 外すとプランナが LATERAL を引き上げて旧形と同じハッシュ結合+逐次走査に戻る)。科目リストはハードコードせず `ledger.accounts` が正のまま。実測(0027 と同じ合成データ・中央値7回): **規模A は NAV_FLOW_SQL 全体で 9.1 → 5.3 ms**、flow CTE 単体では実行 11.0 → 3.8 ms・共有バッファ 979 → 341 で、狙いどおり `journal_lines` の全走査が索引走査に変わった。**規模B は 49.7 → 49.7 ms で改善しなかった**(共有バッファは 9,637 → 3,286 に減ったが、残る支配項が `journal_entries` 側のハッシュ結合(314,002 行の build が work_mem 4MB を超えて temp に溢れる)に移っただけだった)。原因は本項目が指摘した見積り誤差そのもので、`l.account_id = eq.account_id` の右辺が実行時まで不明なため `journal_lines` 側が 209,335 行(真値 2 行)と見積もられ、ネストループが選ばれない。ネストループを強制する形(二段 LATERAL + OFFSET 0)は I/O は最適(共有バッファ 13)だが、同じ誤見積りが**総コストを 1.5M に膨らませて JIT を起動する**ため実測は逆に遅い(規模B 57.9 ms。`SET jit = off` なら 0.68 ms)。根治は科目リストを**クエリパラメータで渡す**こと(実測 規模B 0.66 ms = 75x)だが、これは読み出しが 2 文になり navflow の「1 クエリ」設計性質(独立審査 中-6)に触れるため、本 PR では採らず `navflow-equity-account-parameterization` として別項目に登録した。等価性は `tests/risk/test_navflow_query_rewrite.py`(旧 SQL を凍結した対照テスト16件・シード固定のランダム化総当たりを含む)が固定する。"
    status: done # 2026-08-04 実装: eq CTE + LATERAL(OFFSET 0)で journal_lines の全走査を除去(規模A 9.1→5.3 ms)。規模B は journal_entries 側の誤見積りが残り横ばい — 根治案は navflow-equity-account-parameterization へ

  - id: navflow-equity-account-parameterization
    what: "navflow の equity 科目リストをクエリパラメータで渡すか決める(規模B の残り — 1 クエリ性質とのトレードオフ)"
    conditions:
      - type: date_after
        date: "2026-09-15"
    action:
      type: issue_create
      title: "risk.navflow: equity 科目をパラメータで渡すか(2 文化)を設計判断する"
      labels: [design, risk]
      body: "`navflow-equity-flow-query-rewrite`(2026-08-04 完了)で flow CTE を `eq` CTE + LATERAL に書き換え、`journal_lines` の全走査は消えた(規模A 9.1 → 5.3 ms)。**しかし規模B(仕訳 314,002 行・明細 628,004 行)では 49.7 → 49.7 ms で改善しなかった** — 支配項が `journal_entries` とのハッシュ結合に移り、その build(314,002 行)が work_mem 4MB を超えて temp ファイルへ溢れるためである。根本原因は同じで、`l.account_id = eq.account_id` の右辺が実行時まで不明なので `journal_lines` 側が 209,335 行(真値 2 行)と見積もられ、ネストループ+索引走査が選ばれない。**単一クエリの範囲では上限に達している**: ネストループを強制する形(二段 LATERAL + `OFFSET 0`)は共有バッファ 13 まで落ちるが、同じ誤見積りが総コストを 1.5M に膨らませて JIT(`jit_above_cost=100000`・`jit_inline/optimize_above_cost=500000`、本番 PostgreSQL 17.10 は既定で `jit=on`)を起動し、コンパイルだけで 55 ms 掛かって実測は逆に遅い(`SET jit = off` なら 0.68 ms)。**根治は科目リストをプランナに見せること** — `ledger.accounts` から equity 科目を先に 1 文で読み、`jl.account_id = ANY(%(accounts)s)` として渡すと MCV 統計が効き、規模B で **0.66 ms(75x)**・共有バッファ 8 になる(実測済み)。科目リストの正は `ledger.accounts` のままなのでハードコード禁止には抵触しない。**判断が要るのは 1 クエリ性質**である: navflow は『NAV 点と pending が同一スナップショットから出ること』を 1 クエリで保証している(独立審査 中-6)。科目リストの読み出しを分けても NAV 点と pending は依然 1 クエリで出るためこの保証自体は壊れないが、READ COMMITTED では 2 文の間に `ledger.accounts` が変わりうる(実際には accounts の変更は migration = 保護領域の事象であり実行時には起きない)。**決めること**: (a) パラメータ化して 2 文にする(規模B 75x・`NAV_FLOW_SQL` にパラメータ追加という API 変更を伴う)、(b) 現状維持(規模B は横ばいのまま。dashboard 側は `@st.cache_data(ttl=60)`)、(c) 規模B に達する見込み時期まで先送りする(現行の実データは明細数千行規模)。**src/ryza/risk/ は保護領域のため独立役員審査+みなし承認の手続を経ること。** 出典: 本ファイル `navflow-equity-flow-query-rewrite` の完了注記、`migrations/0027_query_indexes.sql` の「入れなかったもの」(B)、`src/ryza/risk/navflow.py` の `NAV_FLOW_SQL` コメント。"
    status: pending

  - id: meta-runs-status-check
    what: "meta.runs.status に CHECK を置いて語彙を凍結する(runs_running_idx の述語が自由文字列に依存している — 独立役員審査 0027 中-4)"
    conditions:
      - type: date_after
        date: "2026-08-24"
    action:
      type: issue_create
      title: "migrations: meta.runs.status に CHECK 制約を置き、部分索引の述語を守る"
      labels: [impl, schema]
      body: "`migrations/0027` が追加した部分索引 `meta.runs (run_id DESC) WHERE status = 'running'` は、**述語が守られていない自由文字列に依存している**。`meta.runs.status` に CHECK 制約は存在せず(0001)、`running|success|failed` という語彙の根拠は列コメントだけである。したがって `'starting'` / `'retrying'` のような値を後から足す、あるいは `dashboard.queries.fetch_running_runs` の述語を `status IN (...)` に広げると、**エラーも警告も出ないまま索引が使われなくなる**。テストは索引の存在と定義しか見ておらず(EXPLAIN のプラン検証はフレーク源なのでテスト化していない)、CI の DB は空に近いので EXPLAIN でも捕まらない — 典型的な沈黙劣化の経路である。比較対象として `press.outbox` の `outbox_pending_idx`(0007)は述語が `sent_at IS NULL` という**構造的条件**なのでドリフトしえない。是正の選択肢: (a) `ALTER TABLE meta.runs ADD CONSTRAINT runs_status_check CHECK (status IN ('running','success','failed'))` で語彙を凍結する(既存行に違反が無いことを先に確認すること。`ryza.provenance.runs` が書く値が唯一の生成元)、(b) 索引の述語を構造的条件 `finished_at IS NULL` に置き換える(meta.runs には同型の列がある。ただし `fetch_running_runs` の述語も揃える必要があり、『実行中』の定義が status と finished_at の 2 箇所に散る点は要検討)。**どちらも migrations = 保護領域(定款第5条 area: schema)のため独立役員審査+みなし承認の手続を経ること。** 出典: docs/reviews/0027-indexes-independent-review.md 中-4、migrations/0027_query_indexes.sql の索引4の節。**(完了 2026-08-04)** migrations/0031 が (a) を採り、ALTER TABLE meta.runs ADD CONSTRAINT runs_status_check CHECK (status IN ('running','success','failed')) で語彙を凍結した。(b)(述語を finished_at IS NULL に置き換える)を採らなかった理由: 「実行中」の定義が status と finished_at の2箇所に散り、両者の一致を保証する制約がどこにも無い —— 索引の沈黙劣化を二重定義の沈黙不整合に置き換えるだけになる。さらに `fetch_running_runs` の述語も同時に書き換えねばならず、怠れば直したい失敗モードがそのまま残る。語彙の確認: 書き手は `provenance/runs.py`(start_run が running、finish が success / failed)・`ledger/_util.create_run`(既定 success・明示指定の呼び出し無し)・seed migrations 0006/0011(success)のみ。実データは運用 DB が success/failed、テスト DB が success で、partial 等の第4の値はコードにもデータにも存在しない(NOT VALID は使わず、既存行を検証したうえで追加した)。付随: 0027 の索引4の「述語がドリフトしうる」注記を「0031 で解消済み」へ更新し、`meta.runs_running_idx` と `meta.runs.status` のカタログコメントを 0031 が上書きする。`provenance.runs.RUN_STATUSES` を新設して writer 側でも語彙外を早期に弾く(CheckViolation は共有接続の呼び出し側トランザクションを巻き添えにするため)。**語彙を増やすときは CHECK・0027 の索引述語・fetch_running_runs・RUN_STATUSES を必ず同時に動かす**(手順は 0031 の冒頭コメント)。"
    status: done # 2026-08-04 migrations/0031 で CHECK を追加(案 (a) を採用)

  - id: streamlit-upgrade-dads-visual-check
    what: "【恒常運用ルール】Streamlit を更新したら DADS の CSS 層(44px・行間・フォーカスリング)を実ブラウザで目視・実測する"
    conditions:
      - type: date_after
        date: "2026-11-01"
    action:
      type: issue_create
      title: "棚卸し: Streamlit 更新時の DADS 目視確認ルールが守られているか"
      labels: [decision]
      body: "**これは日付で発火する一回限りの作業ではなく、恒常的な運用ルールの棚卸しである。** ルール本体: `dashboard/dads.py` の CSS 注入層は Streamlit の内部 DOM(data-testid・生成クラス名)に依存する非公式手段であり、Streamlit を更新するとセレクタが一致しなくなって**例外も警告も出さずに無効化する**(docs/research/dads-streamlit-application.md §6-7)。AppTest は DOM もレンダラも持たないため CI では検知できず(検査できるのは『CSS ブロックが注入されていること』まで)、唯一の緩和策が人間による実ブラウザでの確認である。**pyproject.toml の streamlit を上げる PR では、必ず以下を実施し結果を PR 本文に記載すること**: (1) `.venv/bin/streamlit run dashboard/app.py` をリポジトリルートから起動、(2) DevTools コンソールで `Array.from(document.querySelectorAll('[data-testid=\"stSidebarNavLink\"]')).map(a=>a.getBoundingClientRect().height)` を実行し**全 14 本が 44 以上**であることを確認、(3) Tab キーでナビを移動しフォーカスリング(2px・Blue-900・角丸の変形なし)が見えることを確認、(4) 本文段落の computed style が font-size 16px / line-height 24px であることを確認。壊れていたら dashboard/dads.py のセレクタを更新する。この Issue では『前回の Streamlit 更新以降、この手順が実施されたか』を git 履歴と PR 本文で確認し、実施漏れがあれば即座に上記を実行する。棚卸し後は次回分(+3ヶ月)を ops/reminders.yaml に登録すること。出典: docs/reviews/dads-design-independent-review.md 重要-1。"
    status: pending

