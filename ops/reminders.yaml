    action:
      type: issue_create
      title: "A-18-8 の不一致を承継の遮断(fail-safe 全面化)に格上げするか判断する"
      labels: [governance]
      body: "**中間案は採用済み(2026-08-04 独立役員審査 SHA-1 + 設計リード裁定)**: トレーラと承認記録の両方に SHA があり食い違う場合、A-18-1 の承継範囲は**記録側 `reviewed_sha`** を採用する(`a18.resolve_reviewed_scope`)。記録側は発効通知の時点に固定され追記オンリーで改変困難であり、48h 異議期間が実際に係属した内容を指すため。したがって『発効通知の後に積んだコミットをマージ時トレーラで承認済みにする』経路は塞がれている。**残る再判断対象は fail-safe の全面化**、すなわち『不一致があればその起点 PR の承継を全部落とす』へ強めるかである。現状は承継を記録側まで縮めるだけで、記録側 SHA の祖先であるコミットは承継され続ける。判断材料: ①発火時点までに A-18-8 が出した不一致の件数と原因内訳(記入ミス / 別 PR の SHA の複写 / マージ後のトレーラ書き換え)、②`compared_reviewed_shas`(突合できた**決定**数)— **不一致 0 件は『穴が無い』ではなく『まだ突合が働いていない』ことが多い**ので分母を先に見る、③`record_only_reviewed`(記録側にはあるがトレーラが v1 = 承継が無制限のまま A-18-8 が無音になる決定数)。③が高止まりしているなら、fail-safe 全面化より先に `trailer-v1-sunset`(reviewed 必須化)を進めるほうが効く。**未着手の関連課題**(審査の敵対的検証より): `reviewed_sha` がマージの第2親と一致する件数(= 実質的に被覆無制限)と、squash/rebase マージで A-18-1 が承継を拒否する一方 A-18-8 が緑になるケースの開示は未実装 — 緑の意味を正しく読ませるには本判断と同時に手当てすること。"
