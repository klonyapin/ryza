# Ryza リマインダー・レジストリ v2(機械可読)
#
# 原則(CLAUDE.md): セッション内の「あとでやる」は無効。将来アクションは必ずここに登録。
# 実行主体: GCP 上の週次ジョブ ops-weekly(Cloud Scheduler + Cloud Run Job、T-004)。
#   ジョブ実装が deploy されるまでの暫定として Claude ローカル定例(ryza-weekly-check)が代行し、
#   deploy 後にローカル定例は廃止する。
#
# conditions は OR 評価。全 type は T-004 実装の条件エバリュエータに対応:
#   date_after:        指定日以降か
#   issue_label_open:  指定ラベルの OPEN Issue が存在するか
#   task_file_glob:    リポジトリ内に glob に合致するファイルが存在するか
#   bq_table_missing:  BigQuery データセットにテーブルが無いか(逆条件)
# action:
#   issue_comment:     指定 Issue にコメント
#   issue_create:      新規 Issue 作成
# 発火後はジョブが status: fired(日付付き)に更新してコミットする。

version: 2
reminders:
  - id: ibkr-account-application
    what: "IBKR 口座申請の案内(審査2〜5営業日。執行層アダプタ実装の前に必要)"
    conditions:
      - type: task_file_glob
        glob: "docs/tasks/*broker*"
      - type: issue_label_open
        label: execution-layer
    action:
      type: issue_comment
      issue: 8
      body: "執行層アダプタの実装が始まります。IBKR 口座の申請をお願いします(手順は本 Issue 本文の details 内。審査2〜5営業日)。"
    status: pending

  - id: ips-quarterly-review
    what: "IPS 月次レビュー(CIO による IPS 批判レポート起草。営業期間=1ヶ月制)"
    conditions:
      - type: date_after
        date: "2026-09-02"
    action:
      type: issue_create
      title: "IPS 月次レビュー(2026-09)"
      labels: [decision]
      body: "docs/design/80-ips.md §2.1 のフローに従い、CIO が IPS 批判レポート(遵守実績・バインドした制約の機会費用・IPS 自体への批判)を起草し投資委員会で対話する。発効はユーザー決議のみ。完了時は ops/reminders.yaml に次回分(+1ヶ月)を登録すること。データ律速の統計は n≥20営業日を満たすまで「データ不足」と明記。"
    status: pending

  - id: billing-export-verify
    what: "GCP Billing Export のテーブル生成確認"
    conditions:
      - type: date_after
        date: "2026-08-03"
    action:
      type: issue_comment
      issue: 7
      body: "確認: BigQuery ryza-main:billing_export にテーブルが生成されているか(ジョブが bq_table_missing を検査し、欠落時のみこのコメントで警告)。"
      only_if:
        type: bq_table_missing
        project: ryza-main
        dataset: billing_export
    status: pending

  - id: constitution-ratification-followup
    what: "定款の批准状況確認(v0.3 として 2026-08-03 批准済み — PR #32 マージ。附則の CLAUDE.md 置換も同 PR で実行済み)"
    conditions:
      - type: date_after
        date: "2026-08-10"
    action:
      type: issue_create
      title: "定款批准フォローアップ(完了済み)"
      labels: [decision]
      body: "(発火不要)v0.3 が 2026-08-03 に PR #32 マージで批准・発効済み。"
    status: done # 2026-08-03 PR #32 マージにより完了

  - id: deemed-approval-a13-and-governance-assets
    what: "みなし承認の期限執行: A-13 監査(PR #36)と役職資産+0013(PR #37)。2026-08-03 に #承認 へ PR リンク付き通知済み。マージ=明示承認、異議なく未マージなら期限後に deemed 統合"
    conditions:
      - type: date_after
        date: "2026-08-05"
    action:
      type: issue_create
      title: "みなし承認期限: A-13 監査+役職資産の統合(48h 異議なし)"
      labels: [impl]
      body: "(完了済み)2026-08-03 に代表がチャットで明示承認(「OK」)し、PR #36・#37 をマージ統合済み。"
    status: done # 2026-08-03 代表明示承認により PR #36/#37 マージ済み

  - id: a13-implementation-checkpoint
    what: "監査 A-13(規則⇔実装トレーサビリティ)の実装チェックポイント。批准後の最優先統制"
    conditions:
      - type: date_after
        date: "2026-08-24"
    action:
      type: issue_create
      title: "A-13 実装チェックポイント(保護領域トレーラ突合・文書 config 整合・宣言棚卸し)"
      labels: [impl]
      body: "config/governance.yaml controls の A-13-1(Approved トレーラと承認記録の突合)・A-13-2(発効文書と config の整合)を ops-weekly ジョブに実装する。未着手なら理由を記録し date を更新。実弾移行の前提条件(定款第5条)である CI 予防統制(ブランチ保護+トレーラ検査)の実装判断もここで行う。"
    status: pending

  - id: declaration-controls-inventory
    what: "定款第6条: enforcement=declaration 条文の四半期棚卸し(執行点の実装可否を再評価)"
    conditions:
      - type: date_after
        date: "2026-11-01"
    action:
      type: issue_create
      title: "「宣言のみ」統制の四半期棚卸し(2026Q4)"
      labels: [decision]
      body: "config/governance.yaml の enforcement: declaration の各統制(独立役員異議経路の保護・反対意見書強制・デプロイ SHA 突合)について、執行点(スキーマ/ゲート/CI/監査)への昇格可否を評価し、結果を統制テーブルに反映する。完了時は次回分(+3ヶ月)を登録すること。"
    status: pending

  - id: first-code-audit
    what: "第1回フル実装監査(別ベンダー AI)— 最初の運用可能版の完成時"
    conditions:
      - type: date_after
        date: "2026-09-15"
    action:
      type: issue_comment
      issue: 15
      body: "チェックポイント: 最初の運用可能版(データ取込→朝刊)は完成しているか。完成していれば実装監査を実施、未完成ならこのリマインダーの date を1ヶ月先に更新すること。"
    status: pending

  - id: a13-protected-areas-registration
    what: "(完了)protected_areas への src/ryza/audit/** 追記 — 2026-08-03 PR #51 を代表がマージし発効"
    conditions:
      - type: date_after
        date: "2026-08-10"
    action:
      type: issue_create
      title: "governance.yaml protected_areas に監査部門コード(src/ryza/audit/**)を追記"
      labels: [decision]
      body: "定款第5条により監査部門コードは保護領域。A-13 実装(src/ryza/audit/)の main 統合後、config/governance.yaml の protected_areas に `src/ryza/audit/**`(area: audit)を追記する。governance.yaml は L1 文書のため代表の明示承認が必要(定款第4条)。A-13 自身が未登録を notes で警告し続ける。"
    status: done # 2026-08-03 PR #51(代表明示承認)で完了

  - id: a13-github-pr-verification
    what: "A-13-1 の PR 実在照合を GitHub API で実装(実弾移行の前提条件)"
    conditions:
      - type: date_after
        date: "2026-09-01"
    action:
      type: issue_create
      title: "A-13-1: マージ PR の実在を GitHub API で照合する"
      labels: [impl]
      body: "現行の src/ryza/audit/a13.py は PR 件名(Merge pull request #N)の自己申告のみで承認と判定しており件名偽装でバイパス可能(独立役員審査 2026-08-03 で実証)。GitHub API で PR #N の実在・マージコミット SHA の一致・マージ実行者を照合する。定款第5条の実弾移行前提条件(ブランチ保護+トレーラ検査 CI)の実装判断と合わせて行う。"
    status: pending

  - id: a13-vm-wiring-check
    what: "VM への A-13 配線確認(A13_REPO_PATH — git checkout と DB の両方に届く実行環境)"
    conditions:
      - type: date_after
        date: "2026-08-17"
    action:
      type: issue_create
      title: "A-13 監査の VM 配線確認(A13_REPO_PATH)"
      labels: [impl]
      body: "A-13(src/ryza/audit/a13.py)は git 履歴とデータベース(press.outbox)の両方を必要とするため、Cloud Run 版 ops-weekly では走らずスキップされる(週次ダイジェストに「スキップ(A13_REPO_PATH 未配線)」と表示)。GCE VM 上(daily と同居)で A13_REPO_PATH を設定した週次実行(systemd timer 等)を配線し、ダイジェストの A-13 行が「実行」になることを確認する。checkout の定期更新(git fetch/pull)も運用側で用意する(A-13 自身は read-only で fetch しない)。"
    status: pending
